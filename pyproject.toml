[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billiards-trainer"
dynamic = ["version"]
description = "Local real-time pool/billiards practice analyst — table & ball detection, shot tracking, make/miss stats."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Caulfield Engineering" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    # <5: OpenCV 5.0 changed API output shapes; upgrade deliberately, with testing
    "opencv-python-headless>=4.8,<5",
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "pygrabber>=0.2 ; sys_platform == 'win32'",
    # Bluetooth LE cue-stroke sensor (lazily imported; degrades gracefully)
    "bleak>=0.22",
    # Tethered Canon DSLR: native PTP over libusb (lazily imported; degrades
    # gracefully). macOS also needs the libusb dylib (brew install libusb).
    "pyusb>=1.2",
]

[project.optional-dependencies]
# ONNX ball detector — runs a YOLO .onnx model with NO torch (~15 MB runtime).
# This is the lightweight path: drop a pool-trained .onnx in the models dir and
# the app uses it. (Generic COCO weights do NOT detect top-down pool balls — a
# pool/billiards-specific model is required; see docs/CV_ROADMAP.md.)
onnx = ["onnxruntime>=1.17"]
# Heavyweight ML ball detector via Ultralytics. Pulls in torch (~2 GB) — only
# needed to TRAIN/convert weights (see tools/train_pool_model.py); the app runs
# the exported .onnx with the lightweight `onnx` extra. Includes the Roboflow SDK
# for downloading the CC-BY Pool V2 dataset.
yolo = ["ultralytics>=8.1", "supervision>=0.18", "roboflow>=1.1"]
# Optional pose/body-fundamentals analysis (Phase 8).
pose = ["mediapipe>=0.10"]
dev = ["pytest>=8.0", "pyinstaller>=6.3", "ruff>=0.4", "onnxruntime>=1.17"]

[project.scripts]
billiards-trainer = "billiards_trainer.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "billiards_trainer.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# QtMultimedia/Qt is never constructed during the headless CV tests.
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Verbatim port of the video-validated stroke analysis (pool-stroke-analyzer).
# Kept byte-comparable to the reference — style is not worth diverging over.
"src/billiards_trainer/cue/analysis.py" = ["E702", "F841", "B905"]
