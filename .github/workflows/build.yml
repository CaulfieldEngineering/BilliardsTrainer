name: Build & Release

# Every push to main: run tests and build BOTH platform binaries — a Windows
# .exe and a macOS (Apple silicon) .app — then publish them + version.json to
# one GitHub Release. The in-app updater polls
# releases/latest/download/version.json on launch (see update/updater.py);
# Windows self-updates in place, macOS opens the download page (the .app swap
# isn't automated until it can be validated on real hardware).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bake version into the package
        shell: pwsh
        run: |
          $v = "0.2.$($env:GITHUB_RUN_NUMBER)"
          Write-Host "Version: $v"
          $f = "src/billiards_trainer/version.py"
          (Get-Content $f) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content $f

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable
        run: pyinstaller packaging/billiards_trainer.spec --noconfirm

      - name: Stage artifact
        shell: pwsh
        run: |
          $v = "0.2.$($env:GITHUB_RUN_NUMBER)"
          Copy-Item dist/BilliardsTrainer.exe "dist/BilliardsTrainer-$v.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/BilliardsTrainer-*.exe

  build-macos:
    # macos-14 runners are Apple silicon (M-series) — the same architecture as
    # the billiards-room Mac Mini, so tests here are real ARM verification.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bake version into the package
        run: |
          v="0.2.${GITHUB_RUN_NUMBER}"
          echo "Version: $v"
          sed -i '' "s/__version__ = \".*\"/__version__ = \"$v\"/" src/billiards_trainer/version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build .app bundle
        run: pyinstaller packaging/billiards_trainer.spec --noconfirm

      - name: Stage artifact (zip the .app)
        run: |
          v="0.2.${GITHUB_RUN_NUMBER}"
          # ditto preserves bundle metadata; plain zip breaks .app bundles
          ditto -c -k --keepParent dist/BilliardsTrainer.app "dist/BilliardsTrainer-mac-$v.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/BilliardsTrainer-mac-*.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Build version.json manifest
        id: stage
        run: |
          v="0.2.${GITHUB_RUN_NUMBER}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          win_sha=$(sha256sum "dist/BilliardsTrainer-$v.exe" | cut -d' ' -f1)
          mac_sha=$(sha256sum "dist/BilliardsTrainer-mac-$v.zip" | cut -d' ' -f1)
          echo "win_sha=$win_sha" >> "$GITHUB_OUTPUT"
          echo "mac_sha=$mac_sha" >> "$GITHUB_OUTPUT"
          base="https://github.com/${{ github.repository }}/releases/download/v$v"
          python packaging/make_version_json.py \
            --version "$v" \
            --url "$base/BilliardsTrainer-$v.exe" --sha256 "$win_sha" \
            --mac-url "$base/BilliardsTrainer-mac-$v.zip" --mac-sha256 "$mac_sha" \
            --notes "Automated build of ${{ github.sha }}" \
            --out dist/version.json
          cat dist/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: Billiards Trainer v${{ steps.stage.outputs.version }}
          generate_release_notes: true
          body: |
            ## Billiards Trainer v${{ steps.stage.outputs.version }}

            **Windows:** `BilliardsTrainer-${{ steps.stage.outputs.version }}.exe`
            SHA256 `${{ steps.stage.outputs.win_sha }}`

            **macOS (Apple silicon):** `BilliardsTrainer-mac-${{ steps.stage.outputs.version }}.zip`
            SHA256 `${{ steps.stage.outputs.mac_sha }}`
            Unzip, drag `BilliardsTrainer.app` to Applications, then
            **right-click → Open** the first time (the app is unsigned). Grant
            the camera and Bluetooth prompts on first use.

            The Windows in-app updater verifies its hash automatically. If a
            self-update ever fails to relaunch, see `updater.log` /
            `RECOVERY.txt` next to the exe, or just re-download from this page.
          files: |
            dist/BilliardsTrainer-*.exe
            dist/BilliardsTrainer-mac-*.zip
            dist/version.json
