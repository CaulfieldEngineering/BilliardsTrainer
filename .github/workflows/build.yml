name: Build & Release

# Every push to main: run tests, build a Windows .exe with PyInstaller, and
# publish it + version.json to a GitHub Release. The in-app updater polls
# releases/latest/download/version.json on launch (see update/updater.py).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $v = "0.2.$($env:GITHUB_RUN_NUMBER)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Bake version into the package
        shell: pwsh
        run: |
          $f = "src/billiards_trainer/version.py"
          (Get-Content $f) -replace '__version__ = ".*"', "__version__ = `"${{ steps.ver.outputs.version }}`"" | Set-Content $f

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable
        run: pyinstaller packaging/billiards_trainer.spec --noconfirm

      - name: Stage release artifacts
        id: stage
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item dist/BilliardsTrainer.exe "dist/BilliardsTrainer-$v.exe"
          $hash = (Get-FileHash "dist/BilliardsTrainer-$v.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/BilliardsTrainer-$v.exe"
          python packaging/make_version_json.py --version $v --url $url --sha256 $hash --notes "Automated build of ${{ github.sha }}" --out dist/version.json
          Get-Content dist/version.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilliardsTrainer-windows
          path: |
            dist/BilliardsTrainer-*.exe
            dist/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Billiards Trainer v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Billiards Trainer v${{ steps.ver.outputs.version }}

            **Download:** `BilliardsTrainer-${{ steps.ver.outputs.version }}.exe`
            **SHA256:** `${{ steps.stage.outputs.sha256 }}`

            Verify your download (PowerShell):
            ```powershell
            (Get-FileHash .\BilliardsTrainer-${{ steps.ver.outputs.version }}.exe -Algorithm SHA256).Hash
            ```

            The in-app updater verifies this hash automatically. If a self-update
            ever fails to relaunch, see `updater.log` / `RECOVERY.txt` next to the
            exe, or just re-download from this page.
          files: |
            dist/BilliardsTrainer-*.exe
            dist/version.json
