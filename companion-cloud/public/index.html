<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Billiards Review</title>
<style>
  :root { --bg:#0B0F14; --panel:#12161D; --line:#1D2530; --text:#E6EDF3;
          --dim:#7D8590; --faint:#3E4A5A; --make:#3FB950; --scratch:#E3B341;
          --accent:#58A6FF; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      /* app, not a web page (Joe): no text selection, no long-press
         callouts on the video, no double-tap zoom */
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none; }
  body { touch-action:manipulation; }
  /* the video area owns ALL its gestures: without this, iOS treats
     two-finger and drag input over the <video> as PAGE gestures — pinch-
     out got stolen and pans scrolled the page (Joe) */
  #vwrap, #vwrap video, #vwrap canvas { touch-action:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,
         "Segoe UI", sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:baseline; gap:10px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  /* floating pill BELOW the island — as a top bar it hid behind the
     clock (Joe's screenshot) */
  #update { display:none; position:fixed; z-index:20;
            top:calc(env(safe-area-inset-top) + 8px);
            left:16px; right:16px; padding:12px 16px;
            background:#122c1a; border:1px solid var(--make);
            border-radius:6px; color:var(--make); font-weight:600;
            text-align:center; }
  #keygate { padding:40px 24px; text-align:center; color:var(--dim);
             display:none; }
  #sessions { padding:8px 0; }
  .acc { display:flex; align-items:center; gap:10px; padding:16px 16px 10px;
         font-size:17px; font-weight:700; }
  .acc .ch { color:var(--dim); transition:transform .15s;
             display:inline-block; }
  .acc.open .ch { transform:rotate(90deg); }
  .acc .cnt { margin-left:auto; color:var(--faint); font-size:13px;
              font-weight:600; }
  .indent { padding-left:10px; }
  .swipe { position:relative; overflow:hidden; touch-action:pan-y; }
  .swipe .swdel { position:absolute; right:0; top:0; bottom:0; width:80px;
                  background:#D64545; color:#fff; border:none;
                  font-weight:700; font-size:14px; }
  .swipe .sess { position:relative; background:var(--bg); }
  .sess.new { color:var(--accent); font-weight:600; display:block; }
  .sess { display:grid; grid-template-columns: 1fr 64px 56px;
          gap:10px; padding:12px 16px; align-items:baseline;
          border-bottom:1px solid var(--line); }
  .sess:active { background:var(--panel); }
  .sess .d { font-weight:600; }
  .sess .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sess .dim { color:var(--dim); }
  .sess.stub .d, .sess.stub .num { color:var(--faint); font-weight:400; }
  .sess.head { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .sess.head span { color:var(--dim); font-size:11px; font-weight:600;
                    letter-spacing:.8px; }
  /* the player is a fixed-height column: video flexes to absorb what
     remains after the control stack, so every button fits on screen
     with zero scrolling (Joe) */
  #player { display:none; flex-direction:column; height:100dvh;
            overflow:hidden; }
  #player.open { display:flex; }
  #topbar { display:flex; align-items:center; gap:12px;
            padding:calc(8px + env(safe-area-inset-top)) 16px 8px; }
  #back { color:var(--accent); font-weight:600; background:none; border:none;
          font-size:15px; }
  #title { color:var(--dim); font-size:13px; margin-left:auto; }
  video { width:100%; height:100%; background:#000; display:block;
          object-fit:contain; }
  /* native controls are gone (Joe): tap the video to play/pause; a quiet
     glyph marks the paused state */
  #paused-glyph { position:absolute; inset:0; display:none;
                  align-items:center; justify-content:center;
                  font-size:44px; color:rgba(230,237,243,.55);
                  pointer-events:none; }
  /* show briefly on pause, then fade away (Joe: it blocks the frame
     he paused to study). Re-pausing restarts the animation. */
  #vwrap.paused #paused-glyph { display:flex;
      animation: glyphfade 2.2s ease forwards; }
  @keyframes glyphfade { 0%,55% { opacity:1; } 100% { opacity:0; } }
  #spinner { position:absolute; inset:0; display:none;
             align-items:center; justify-content:center;
             pointer-events:none; }
  #vwrap.loading #spinner { display:flex; }
  #vwrap.loading #paused-glyph { display:none; }
  #trails { position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; }
  #sh-cut button.on, #sh-miss button.on { color:var(--accent);
      border-color:var(--accent); font-weight:800; }
  #statsheet table { width:100%; border-collapse:collapse; margin-top:8px; }
  #statsheet th, #statsheet td { padding:8px 10px; text-align:center;
      border-bottom:1px solid #232B36; font-variant-numeric:tabular-nums; }
  #statsheet th { color:var(--dim); font-size:12px; font-weight:600; }
  #statsheet td.big { font-weight:800; font-size:16px; }
  .newsbar { display:flex; align-items:center; gap:4px; margin:10px 12px;
             padding:11px 14px; background:var(--panel,#12161C);
             border:1px solid #2A323D; border-radius:12px; cursor:pointer; }
  /* Legend is HUD, not overlay: it lives outside #vrot so it stays
     upright and bottom-left no matter how the video is rotated. */
  #vwrap.rot #vrot { transform: rotate(180deg); }
  /* draggable (Joe: "it's blocking my view of the shot"). It takes
     pointer events so it can be grabbed; it is small and the whole point
     is that you can move it off whatever it covers. */
  #legend { position:absolute; left:10px; top:auto; bottom:10px;
            display:none; flex-direction:column; gap:3px; z-index:19;
            font-size:11px; line-height:1.35; cursor:grab;
            touch-action:none; user-select:none; -webkit-user-select:none; }
  #legend.dragging { cursor:grabbing; opacity:.75; }
  #legend div { display:flex; align-items:center; gap:7px; color:#E6EDF3;
                background:rgba(13,17,23,.78); border-radius:5px;
                padding:2px 7px; width:max-content; }
  #legend i { display:block; width:14px; height:3px; border-radius:2px;
              flex:0 0 auto; }
  #spinner div { width:36px; height:36px; border-radius:50%;
                 border:3px solid var(--line);
                 border-top-color:var(--accent);
                 animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #shotbar { padding:8px 16px calc(8px + env(safe-area-inset-bottom));
             flex:0 0 auto; }
  #shotinfo { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  #shotinfo .n { font-size:18px; font-weight:700; }
  #shotinfo .oc { font-weight:700; }
  #shotinfo .t { color:var(--dim); font-size:12px; margin-left:auto; }
  #desc { color:var(--dim); font-size:13px; min-height:1.3em;
          margin-bottom:6px; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; }
  #sheet #sh-desc { font-size:14px; line-height:1.45; color:var(--text);
                    margin-bottom:8px; }
  #nav { display:flex; gap:8px; margin-bottom:8px; }
  #nav #rate.on { color:var(--accent); border-color:var(--accent); }
  #correct { width:100%; height:38px; margin-bottom:8px;
             background:var(--panel); color:var(--dim);
             border:1px solid var(--line); border-radius:4px;
             font-size:14px; font-weight:600; }
  /* ---- overlay bottom sheet (standard iOS pattern: scrim + slide-up
     card with grabber; tool grid like Markup) ---- */
  #ovscrim { display:none; position:fixed; inset:0; z-index:48;
             background:rgba(0,0,0,.45); }
  #ovmenu { display:none; position:fixed; left:0; right:0; bottom:0;
            z-index:49; background:var(--panel);
            border-top:1px solid var(--line);
            border-radius:14px 14px 0 0;
            padding:8px 16px calc(18px + env(safe-area-inset-bottom));
            animation:ovup .22s ease; }
  @keyframes ovup { from { transform:translateY(30%); opacity:.4; }
                    to { transform:none; opacity:1; } }
  #ovmenu .grab { width:36px; height:5px; border-radius:3px;
                  background:var(--faint); margin:4px auto 14px; }
  #ovmenu h3 { font-size:13px; font-weight:600; letter-spacing:.06em;
               color:var(--dim); text-transform:uppercase; margin:14px 0 8px; }
  #ovmenu .lrow { display:flex; align-items:center; width:100%;
                  height:48px; padding:0 4px; background:none; border:none;
                  border-bottom:1px solid var(--line); color:var(--text);
                  font-size:16px; }
  #ovmenu .lrow .chev { margin-left:auto; color:var(--faint); }
  #ovmenu .tools { display:grid; grid-template-columns:repeat(4, 1fr);
                   gap:10px; }
  #ovmenu .tool { display:flex; flex-direction:column; align-items:center;
                  gap:6px; padding:12px 0 10px; background:var(--bg);
                  border:1px solid var(--line); border-radius:12px;
                  color:var(--text); }
  #ovmenu .tool .ic { font-size:22px; line-height:1; }
  #ovmenu .tool .lb { font-size:11px; color:var(--dim); }
  #pl-pick button { display:block; width:100%; height:44px; text-align:left;
                    padding:0 10px; margin-top:6px; background:var(--bg);
                    border:1px solid var(--line); border-radius:10px;
                    color:var(--text); font-size:15px; }
  /* ---- floating style pill (Markup-style) ---- */
  #dtools { display:none; position:absolute; left:50%;
            transform:translateX(-50%); bottom:96px; z-index:39;
            background:rgba(18,22,29,.96); border:1px solid var(--line);
            border-radius:18px; padding:10px 14px;
            flex-direction:column; gap:10px;
            box-shadow:0 6px 24px rgba(0,0,0,.5);
            width:min(360px, calc(100% - 24px)); }
  #dtools .dtrow { display:flex; align-items:center; gap:12px;
                   justify-content:center; width:100%; }
  #dtools .dtrow label { font-size:13px; color:var(--dim); width:18px;
                         text-align:center; }
  #dtools input[type=range] { flex:1; min-width:0; }
  #dtools .sw { width:24px; height:24px; border-radius:50%; padding:0;
                border:2px solid transparent; }
  #dtools .sw.on { border-color:#fff; }
  #dtools input[type=range] { width:84px; }
  #sheet { display:none; }
  #sheet .row { display:flex; gap:6px; margin-bottom:8px; }
  #sheet button { flex:1; height:42px; background:var(--panel);
                  color:var(--dim); border:1px solid var(--line);
                  border-radius:4px; font-size:12px; font-weight:600; }
  #sheet button.sel { color:var(--make); border-color:var(--make); }
  #sheet textarea { width:100%; height:64px; padding:8px 10px;
                    background:var(--panel); color:var(--text);
                    border:1px solid var(--line); border-radius:4px;
                    /* 16px minimum or iOS auto-zooms on focus (Joe) */
                    font:16px/1.4 -apple-system, sans-serif; resize:none;
                    margin-bottom:8px; }
  #sheet #sh-save { color:var(--make); border-color:var(--make);
                    font-size:14px; }
  /* corrected clips: a subtle accent dot on the chip corner */
  .chip { position:relative; }
  .chip.fixed::after { content:""; position:absolute; top:3px; right:3px;
                       width:5px; height:5px; border-radius:50%;
                       background:var(--accent); }
  .chip.seen::after { content:""; position:absolute; top:3px; right:3px;
                      width:5px; height:5px; border-radius:50%;
                      background:var(--make); }
  #nav button { flex:1; height:44px; background:var(--panel); color:var(--text);
                border:1px solid var(--line); border-radius:4px; font-size:15px;
                font-weight:600; }
  #nav button:active { background:#1B2430; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px;
           -webkit-overflow-scrolling:touch; }
  /* glanceable shot facts: balls in play as coloured badges + the
     description's lead clause — full story stays in Details (Joe) */
  #inline { display:flex; align-items:center; gap:6px; min-height:22px;
            margin-bottom:6px; overflow:hidden; }
  #inline .ball { width:20px; height:20px; border-radius:50%; flex:0 0 auto;
                  display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:700; color:#0B0F14;
                  border:1px solid rgba(0,0,0,.4); }
  #inline .frag { color:var(--dim); font-size:12px; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; margin-left:4px; }
  #lane { position:relative; height:40px; margin:0 0 8px;
          background:var(--panel); border:1px solid var(--line);
          border-radius:4px; touch-action:none; overflow:hidden; }
  .region { position:absolute; top:5px; bottom:5px; border-radius:2px;
            opacity:.6; }
  .region.make { background:var(--make); }
  .region.miss { background:#4A5563; }
  .region.scratch { background:var(--scratch); }
  .region.inhand { background:var(--faint); opacity:.25; }
  .region.lead { opacity:.22; }
  #playhead { position:absolute; top:0; bottom:0; width:2px;
              background:var(--text); pointer-events:none; }
  /* between clips (continuity mode): the lane owns no time yet, so the
     playhead waits visibly instead of looking stuck */
  #playhead.waiting { opacity:.35; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.1; } }
  .chip { min-width:42px; height:42px; border-radius:4px; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center;
          background:var(--panel); border:2px solid var(--line);
          font-weight:700; }
  .chip.make { border-color:var(--make); color:var(--make); }
  .chip.miss { border-color:#39414d; color:var(--text); }
  .chip.scratch { border-color:var(--scratch); color:var(--scratch); }
  .chip.inhand { border-color:#242b35; color:var(--faint); opacity:.55;
                 font-size:11px; }
  .chip.cur { background:#1B2430; outline:2px solid var(--accent); }
  .empty { padding:32px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>BILLIARDS REVIEW</h1>
  <span class="sub" id="build"></span>
</header>
<div id="update">Update available — tap to reload</div>
<div id="keygate"></div>
<div id="keyentry" style="display:none; padding:0 24px 24px; text-align:center;">
  <input id="keyfield" placeholder="paste key here" autocapitalize="off"
         autocorrect="off" spellcheck="false"
         style="width:100%; max-width:340px; height:44px; padding:0 12px; font-size:16px;
                background:var(--panel); border:1px solid var(--line);
                border-radius:4px; color:var(--text); font-size:15px;">
  <button id="keysave"
          style="margin-top:10px; height:44px; padding:0 24px;
                 background:var(--panel); border:1px solid var(--accent);
                 border-radius:4px; color:var(--accent); font-weight:600;
                 font-size:15px;">Save key</button>
</div>

<div id="sessions"></div>
    <div id="statsheet" style="display:none;position:fixed;inset:0;z-index:40;
         background:var(--bg,#0B0F14);overflow-y:auto">
      <div style="margin:calc(10px + env(safe-area-inset-top)) 12px 20px;
           background:var(--panel,#12161C);border:1px solid #2A323D;
           border-radius:16px;padding:18px 16px 12px">
        <div style="display:flex;align-items:center;margin-bottom:4px">
          <h3 style="margin:0;font-size:17px">Lifetime Stats</h3>
          <button id="stats-close" style="margin-left:auto;min-width:44px">‹ Home</button>
        </div>
        <div id="stats-body" ></div>
      </div>
    </div>
    <div id="ovmenu">
      <div class="grab"></div>
      <h3>Drawing tools</h3>
      <div class="tools">
        <button id="d-line" class="tool"><span class="ic">╱</span>
          <span class="lb">Line</span></button>
        <button id="d-angle" class="tool"><span class="ic">∠</span>
          <span class="lb">Angle</span></button>
        <button id="d-show" class="tool"><span class="ic">👁</span>
          <span class="lb" id="d-show-lb">Shown</span></button>
        <button id="d-clear" class="tool"><span class="ic">🗑</span>
          <span class="lb">Clear</span></button>
      </div>
      <button id="d-del" class="lrow" disabled style="display:none"></button>
      <h3>View</h3>
      <button id="ov-rot" class="lrow">Rotate 180°
        <span class="chev" id="ov-rot-st">Off</span></button>
      <h3>Overlays</h3>
      <button id="ov-aim" class="lrow">Aim line
        <span class="chev" id="ov-aim-st">Off</span></button>
      <button id="ov-paths" class="lrow">Ball paths
        <span class="chev" id="ov-paths-st">Off</span></button>
      <button id="ov-why" class="lrow">Shot lines
        <span class="chev" id="ov-why-st">Off</span></button>
    </div>
    <div id="dtools">
      <div class="dtrow">
        <span id="dt-colors" style="display:flex;gap:10px"></span>
        <button id="dt-w" style="min-width:40px;background:none;border:none;
                color:var(--text)">──</button>
        <button id="dt-del" style="min-width:36px;background:none;
                border:none">🗑</button>
      </div>
      <div class="dtrow">
        <label>◐</label>
        <input id="dt-a" type="range" min="15" max="100" value="55">
      </div>
      <div class="dtrow" id="dt-lenrow" style="display:none">
        <label>↔</label>
        <input id="dt-len" type="range" min="5" max="160" value="40"
               title="line length">
      </div>
    </div>
    <div id="sheet">
      <p id="sh-desc"></p>
      <div class="row">
        <button id="sh-split">✂ Split at playhead</button>
        <button id="sh-copyid">⧉ Copy Shot ID</button>
      </div>
      <div class="row">
        <button id="pl-save">☆ Playlist</button>
        <button id="rife-req">✨ Slo-mo</button>
      </div>
      <div id="pl-pick" style="display:none"></div>
      <div id="sh-missing" style="display:none;color:var(--dim);
           font-size:12px;line-height:1.5;padding:2px 0 6px"></div>
      <div class="row" id="sh-stroke" style="display:none">
        <span style="align-self:center;color:var(--dim);font-size:12px;
              min-width:52px">STROKE</span>
        <span id="sh-stroke-txt" style="align-self:center;font-size:13px;
              font-variant-numeric:tabular-nums"></span>
      </div>
      <div class="row" id="sh-cut">
        <span style="align-self:center;color:var(--dim);font-size:12px;
              min-width:52px">CUT</span>
        <button data-c="left">LEFT</button>
        <button data-c="straight">STRAIGHT</button>
        <button data-c="right">RIGHT</button>
      </div>
      <div class="row" id="sh-miss">
        <span style="align-self:center;color:var(--dim);font-size:12px;
              min-width:52px">MISSED</span>
        <button data-m="left">LEFT</button>
        <button data-m="right">RIGHT</button>
      </div>
      <div class="row" id="sh-outcome">
        <button data-o="make">MAKE</button>
        <button data-o="miss">MISS</button>
        <button data-o="scratch">SCRATCH</button>
      </div>
      <div class="row" id="sh-action">
        <button data-a="stroke">STROKE</button>
        <button data-a="break">BREAK</button>
        <button data-a="ball_in_hand">IN HAND</button>
        <button data-a="rearrange">SHUFFLE</button>
      </div>
      <textarea id="sh-note" placeholder="Details — what did the system get wrong?"></textarea>
      <div class="row">
        <button id="sh-confirm" style="color:var(--make);
                border-color:var(--make);">✓ Looks right — mark reviewed</button>
      </div>
      <div class="row">
        <button id="sh-cancel">Cancel</button>
        <button id="sh-save">Save correction</button>
      </div>
      <div class="row">
        <button id="sh-clear"
                style="display:none; color:var(--scratch);
                       border-color:var(--scratch);">Remove correction</button>
      </div>
    </div>
  </div>
    <div id="newssheet" style="display:none;position:fixed;inset:0;z-index:40;
         background:var(--bg,#0B0F14);overflow-y:auto">
      <div style="margin:calc(10px + env(safe-area-inset-top)) 12px 20px;
           background:var(--panel,#12161C);border:1px solid #2A323D;
           border-radius:16px;padding:18px 16px 12px">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <h3 style="margin:0;font-size:17px">What’s New</h3>
          <button id="news-close" style="margin-left:auto;min-width:44px">‹ Home</button>
        </div>
        <div id="news-list" ></div>
      </div>
    </div>

<div id="player">
  <div id="topbar">
    <button id="back">‹ Sessions</button>
    <span id="title"></span>
    <button id="ovbtn" title="overlays &amp; drawing"
            style="flex:0 0 auto;min-width:46px;margin-left:8px">☰</button>
  </div>
  <div id="vwrap" style="position:relative; flex:1 1 auto; min-height:120px; display:flex; overflow:hidden;">
    <!-- ONLY this layer rotates (Joe: "keep your legend upright when I
         rotate the video", "play button seems to flip"). The video and
         the canvases that share its coordinate space live inside; every
         piece of HUD chrome stays outside and upright. -->
    <div id="vrot" style="position:absolute; inset:0; display:flex;">
    <video id="video" playsinline preload="metadata"></video>
    <canvas id="scrubcv" style="position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none"></canvas>
    <canvas id="trails"></canvas>
    <canvas id="drawcv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none"></canvas>
    </div><!-- /vrot -->
    <button id="zoomreset" style="display:none;position:absolute;top:12px;
         right:12px;z-index:21;background:rgba(13,17,23,.85);color:#EAF2F3;
         border:1px solid #2A323D;border-radius:14px;padding:4px 12px;
         font-size:13px;font-weight:700">1×</button>
    <div id="holdpill" style="display:none;position:absolute;top:12px;
         left:50%;transform:translateX(-50%);background:rgba(13,17,23,.85);
         color:#EAF2F3;border:1px solid #2A323D;border-radius:14px;
         padding:4px 12px;font-size:13px;font-weight:700;z-index:20">¼×</div>
    <div id="spinner"><div></div></div>
    <div id="paused-glyph">▶</div>
    <div id="legend"></div>
  </div>
  <div id="shotbar">
    <div id="shotinfo">
      <span class="n" id="shot-n">–</span>
      <span class="oc" id="shot-oc"></span>
      <span class="t" id="shot-t"></span>
    </div>
    <div id="inline"></div>
    <div id="lane"><div id="playhead"></div></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="fprev" title="back one frame">‹·</button>
      <button id="play" title="play / pause">▶</button>
      <button id="mode" title="repeat this shot">⟳</button>
      <button id="rate" title="playback speed">1×</button>
      <button id="fnext" title="forward one frame">·›</button>
      <button id="next">›</button>
    </div>
    <div id="lower">
      <button id="correct">✎ Correct this clip</button>
      <div id="chips"></div>
    </div>
    <div id="ovscrim"></div>
</div>

<script src="app.js?v=__BUILD_ID__"></script>
</body>
</html>
