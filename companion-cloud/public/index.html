<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Billiards Review</title>
<style>
  :root { --bg:#0B0F14; --panel:#12161D; --line:#1D2530; --text:#E6EDF3;
          --dim:#7D8590; --faint:#3E4A5A; --make:#3FB950; --scratch:#E3B341;
          --accent:#58A6FF; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      /* app, not a web page (Joe): no text selection, no long-press
         callouts on the video, no double-tap zoom */
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none; }
  body { touch-action:manipulation; }
  /* nothing may ever exceed the viewport (Joe: "content pushes right up
     to the right side... even overflows when I make the window wider") */
  html, body { max-width:100%; overflow-x:hidden; }
  img, canvas, video { max-width:100%; }
  /* the video area owns ALL its gestures: without this, iOS treats
     two-finger and drag input over the <video> as PAGE gestures — pinch-
     out got stolen and pans scrolled the page (Joe) */
  #vwrap, #vwrap video, #vwrap canvas { touch-action:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,
         "Segoe UI", sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:baseline; gap:10px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  /* floating pill BELOW the island — as a top bar it hid behind the
     clock (Joe's screenshot) */
  #update { display:none; position:fixed; z-index:20;
            top:calc(env(safe-area-inset-top) + 8px);
            left:16px; right:16px; padding:12px 16px;
            background:#122c1a; border:1px solid var(--make);
            border-radius:6px; color:var(--make); font-weight:600;
            text-align:center; }
  #keygate { padding:40px 24px; text-align:center; color:var(--dim);
             display:none; }
  #sessions { padding:8px 0; }
  .acc { display:flex; align-items:center; gap:10px; padding:16px 16px 10px;
         font-size:17px; font-weight:700; }
  .acc .ch { color:var(--dim); transition:transform .15s;
             display:inline-block; }
  .acc.open .ch { transform:rotate(90deg); }
  .acc .cnt { margin-left:auto; color:var(--faint); font-size:13px;
              font-weight:600; }
  .indent { padding-left:10px; }
  .swipe { position:relative; overflow:hidden; touch-action:pan-y; }
  .swipe .swdel { position:absolute; right:0; top:0; bottom:0; width:80px;
                  background:#D64545; color:#fff; border:none;
                  font-weight:700; font-size:14px; }
  .swipe .sess { position:relative; background:var(--bg); }
  .sess.new { color:var(--accent); font-weight:600; display:block; }
  .sess { display:grid; grid-template-columns: 1fr 64px 56px;
          gap:10px; padding:12px 16px; align-items:baseline;
          border-bottom:1px solid var(--line); }
  .sess:active { background:var(--panel); }
  .sess .d { font-weight:600; }
  .sess .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sess .dim { color:var(--dim); }
  .sess.stub .d, .sess.stub .num { color:var(--faint); font-weight:400; }
  .sess.head { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .sess.head span { color:var(--dim); font-size:11px; font-weight:600;
                    letter-spacing:.8px; }
  /* the player is a fixed-height column: video flexes to absorb what
     remains after the control stack, so every button fits on screen
     with zero scrolling (Joe) */
  #player { display:none; flex-direction:column; height:100dvh;
            overflow:hidden; }
  #player.open { display:flex; }
  #topbar { display:flex; align-items:center; gap:12px;
            padding:calc(8px + env(safe-area-inset-top)) 16px 8px; }
  #back { color:var(--accent); font-weight:600; background:none; border:none;
          font-size:15px; }
  #title { color:var(--dim); font-size:13px; margin-left:auto; }
  video { width:100%; height:100%; background:#000; display:block;
          object-fit:contain; }
  /* native controls are gone (Joe): tap the video to play/pause; a quiet
     glyph marks the paused state */
  #paused-glyph { position:absolute; inset:0; display:none;
                  align-items:center; justify-content:center;
                  font-size:44px; color:rgba(230,237,243,.55);
                  pointer-events:none; }
  /* show briefly on pause, then fade away (Joe: it blocks the frame
     he paused to study). Re-pausing restarts the animation. */
  #vwrap.paused #paused-glyph { display:flex;
      animation: glyphfade 2.2s ease forwards; }
  @keyframes glyphfade { 0%,55% { opacity:1; } 100% { opacity:0; } }
  #spinner { position:absolute; inset:0; display:none;
             align-items:center; justify-content:center;
             pointer-events:none; }
  #vwrap.loading #spinner { display:flex; }
  #vwrap.loading #paused-glyph { display:none; }
  #trails { position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; }
  #sh-cut button.on, #sh-miss button.on { color:var(--accent);
      border-color:var(--accent); font-weight:800; }
  #statsheet table { width:100%; border-collapse:collapse; margin-top:8px; }
  #statsheet th, #statsheet td { padding:8px 10px; text-align:center;
      border-bottom:1px solid #232B36; font-variant-numeric:tabular-nums; }
  #statsheet th { color:var(--dim); font-size:12px; font-weight:600; }
  #statsheet td.big { font-weight:800; font-size:16px; }
  .newsbar { display:flex; align-items:center; gap:4px; margin:10px 12px;
             padding:11px 14px; background:var(--panel,#12161C);
             border:1px solid #2A323D; border-radius:12px; cursor:pointer; }
  /* Legend is HUD, not overlay: it lives outside #vrot so it stays
     upright and bottom-left no matter how the video is rotated. */
  #vwrap.rot #vrot { transform: rotate(180deg); }
  /* draggable (Joe: "it's blocking my view of the shot"). It takes
     pointer events so it can be grabbed; it is small and the whole point
     is that you can move it off whatever it covers. */
  #legend { position:absolute; left:10px; top:auto; bottom:10px;
            display:none; flex-direction:column; gap:3px; z-index:19;
            font-size:11px; line-height:1.35; cursor:grab;
            touch-action:none; user-select:none; -webkit-user-select:none; }
  #legend.dragging { cursor:grabbing; opacity:.75; }
  #legend div { display:flex; align-items:center; gap:7px; color:#E6EDF3;
                background:rgba(13,17,23,.78); border-radius:5px;
                padding:2px 7px; width:max-content; }
  #legend i { display:block; width:14px; height:3px; border-radius:2px;
              flex:0 0 auto; }
  #spinner div { width:36px; height:36px; border-radius:50%;
                 border:3px solid var(--line);
                 border-top-color:var(--accent);
                 animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #shotbar { padding:8px 16px calc(8px + env(safe-area-inset-bottom));
             flex:0 0 auto; }
  #shotinfo { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  #shotinfo .n { font-size:18px; font-weight:700; }
  #shotinfo .oc { font-weight:700; }
  #shotinfo .t { color:var(--dim); font-size:12px; margin-left:auto; }
  #desc { color:var(--dim); font-size:13px; min-height:1.3em;
          margin-bottom:6px; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; }
  #sheet #sh-desc { font-size:14px; line-height:1.45; color:var(--text);
                    margin-bottom:8px; }
  #nav { display:flex; gap:8px; margin-bottom:8px; }
  #nav #rate.on { color:var(--accent); border-color:var(--accent); }
  #correct { width:100%; height:38px; margin-bottom:8px;
             background:var(--panel); color:var(--dim);
             border:1px solid var(--line); border-radius:4px;
             font-size:14px; font-weight:600; }
  /* ---- overlay bottom sheet (standard iOS pattern: scrim + slide-up
     card with grabber; tool grid like Markup) ---- */
  #ovscrim { display:none; position:fixed; inset:0; z-index:48;
             background:rgba(0,0,0,.45); }
  #ovmenu { display:none; position:fixed; left:0; right:0; bottom:0;
            z-index:49; background:var(--panel);
            border-top:1px solid var(--line);
            border-radius:14px 14px 0 0;
            padding:8px 16px calc(18px + env(safe-area-inset-bottom));
            animation:ovup .22s ease; }
  @keyframes ovup { from { transform:translateY(30%); opacity:.4; }
                    to { transform:none; opacity:1; } }
  #ovmenu .grab { width:36px; height:5px; border-radius:3px;
                  background:var(--faint); margin:4px auto 14px; }
  #ovmenu h3 { font-size:13px; font-weight:600; letter-spacing:.06em;
               color:var(--dim); text-transform:uppercase; margin:14px 0 8px; }
  #ovmenu .lrow { display:flex; align-items:center; width:100%;
                  height:48px; padding:0 4px; background:none; border:none;
                  border-bottom:1px solid var(--line); color:var(--text);
                  font-size:16px; }
  #ovmenu .lrow .chev { margin-left:auto; color:var(--faint); }
  #ovmenu .tools { display:grid; grid-template-columns:repeat(4, 1fr);
                   gap:10px; }
  #ovmenu .tool { display:flex; flex-direction:column; align-items:center;
                  gap:6px; padding:12px 0 10px; background:var(--bg);
                  border:1px solid var(--line); border-radius:12px;
                  color:var(--text); }
  #ovmenu .tool .ic { font-size:22px; line-height:1; }
  #ovmenu .tool .lb { font-size:11px; color:var(--dim); }
  #pl-pick button { display:block; width:100%; height:44px; text-align:left;
                    padding:0 10px; margin-top:6px; background:var(--bg);
                    border:1px solid var(--line); border-radius:10px;
                    color:var(--text); font-size:15px; }
  /* ---- floating style pill (Markup-style) ---- */
  #dtools { display:none; position:absolute; left:50%;
            transform:translateX(-50%); bottom:96px; z-index:39;
            background:rgba(18,22,29,.96); border:1px solid var(--line);
            border-radius:18px; padding:10px 14px;
            flex-direction:column; gap:10px;
            box-shadow:0 6px 24px rgba(0,0,0,.5);
            width:min(360px, calc(100% - 24px)); }
  #dtools .dtrow { display:flex; align-items:center; gap:12px;
                   justify-content:center; width:100%; }
  #dtools .dtrow label { font-size:13px; color:var(--dim); width:18px;
                         text-align:center; }
  #dtools input[type=range] { flex:1; min-width:0; }
  #dtools .sw { width:24px; height:24px; border-radius:50%; padding:0;
                border:2px solid transparent; }
  #dtools .sw.on { border-color:#fff; }
  #dtools input[type=range] { width:84px; }
  /* Details as a true BOTTOM SHEET (Joe: "worst UI I've ever seen" — the
     old inline block grew past the viewport and shoved the page under the
     status bar). Fixed overlay, own scroll, safe-area aware, grouped. */
  #sh-backdrop { display:none; position:fixed; inset:0; z-index:44;
                 background:rgba(0,0,0,.55); }
  #sheet { display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
           max-height:86vh; background:var(--bg,#0B0F14);
           border:1px solid var(--line); border-bottom:none;
           border-radius:16px 16px 0 0;
           padding-bottom:env(safe-area-inset-bottom);
           flex-direction:column; }
  #sh-grab { width:36px; height:4px; border-radius:2px; background:#2A323D;
             margin:8px auto 2px; flex:0 0 auto; }
  #sh-scroll { overflow-y:auto; padding:6px 14px 10px;
               -webkit-overflow-scrolling:touch; }
  #sheet .row { display:flex; gap:6px; margin-bottom:8px; }
  #sheet button { flex:1; height:38px; background:var(--panel);
                  color:var(--dim); border:1px solid var(--line);
                  border-radius:8px; font-size:12px; font-weight:600; }
  #sheet button.sel { color:#08110A; background:var(--make);
                      border-color:var(--make); }
  #sheet .row.tools button { display:flex; flex-direction:column;
                             align-items:center; justify-content:center;
                             gap:1px; height:46px; font-size:15px; }
  #sheet .row.tools small { font-size:10px; font-weight:500;
                            color:var(--dim); }
  .sh-section { border:1px solid var(--line); border-radius:12px;
                padding:10px 10px 4px; margin-bottom:10px; }
  .sh-label { font-size:10px; letter-spacing:.12em; color:var(--dim);
              margin:0 0 8px 2px; }
  #sh-stay { font-size:26px; font-weight:800; letter-spacing:-.02em;
             font-variant-numeric:tabular-nums; margin:0 0 6px 2px; }
  #sh-stay small { font-size:11px; font-weight:600; color:var(--dim);
                   letter-spacing:.08em; margin-left:6px; }
  #sh-stroke-txt { color:var(--text); font-size:13px;
                   font-variant-numeric:tabular-nums; }
  #sh-missing { color:var(--dim); font-size:12px; line-height:1.5;
                padding:2px 0 6px; }
  .row.seg { align-items:stretch; }
  .seg-cap { flex:0 0 52px; align-self:center; color:var(--dim);
             font-size:11px; letter-spacing:.06em; }
  #sheet textarea { width:100%; height:56px; padding:8px 10px;
                    background:var(--panel); color:var(--text);
                    border:1px solid var(--line); border-radius:8px;
                    /* 16px minimum or iOS auto-zooms on focus (Joe) */
                    font:16px/1.4 -apple-system, sans-serif; resize:none;
                    margin-bottom:4px; }
  #sh-foot { display:flex; gap:8px; padding:10px 14px; flex:0 0 auto;
             border-top:1px solid var(--line); }
  #sh-foot button { height:44px; border-radius:10px; font-size:14px; }
  #sh-foot #sh-cancel { flex:0 0 84px; }
  #sh-foot #sh-confirm { flex:1.4; color:#08110A; background:var(--make);
                         border-color:var(--make); font-weight:700; }
  #sh-foot #sh-save { flex:1; color:var(--make); border-color:var(--make); }
  /* corrected clips: a subtle accent dot on the chip corner */
  .chip { position:relative; }
  .chip.fixed::after { content:""; position:absolute; top:3px; right:3px;
                       width:5px; height:5px; border-radius:50%;
                       background:var(--accent); }
  .chip.seen::after { content:""; position:absolute; top:3px; right:3px;
                      width:5px; height:5px; border-radius:50%;
                      background:var(--make); }
  #nav button { flex:1; height:44px; background:var(--panel); color:var(--text);
                border:1px solid var(--line); border-radius:4px; font-size:15px;
                font-weight:600; }
  #nav button:active { background:#1B2430; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px;
           -webkit-overflow-scrolling:touch; }
  /* glanceable shot facts: balls in play as coloured badges + the
     description's lead clause — full story stays in Details (Joe) */
  #inline { display:flex; align-items:center; gap:6px; min-height:22px;
            margin-bottom:6px; overflow:hidden; }
  #inline .ball { width:20px; height:20px; border-radius:50%; flex:0 0 auto;
                  display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:700; color:#0B0F14;
                  border:1px solid rgba(0,0,0,.4); }
  #inline .frag { color:var(--dim); font-size:12px; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; margin-left:4px; }
  #lane { position:relative; height:40px; margin:0 0 8px;
          background:var(--panel); border:1px solid var(--line);
          border-radius:4px; touch-action:none; overflow:hidden; }
  .region { position:absolute; top:5px; bottom:5px; border-radius:2px;
            opacity:.6; }
  .region.make { background:var(--make); }
  .region.miss { background:#4A5563; }
  .region.scratch { background:var(--scratch); }
  .region.inhand { background:var(--faint); opacity:.25; }
  .region.lead { opacity:.22; }
  #playhead { position:absolute; top:0; bottom:0; width:2px;
              background:var(--text); pointer-events:none; }
  /* between clips (continuity mode): the lane owns no time yet, so the
     playhead waits visibly instead of looking stuck */
  #playhead.waiting { opacity:.35; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.1; } }
  /* ---- Dev Journal: the ONE channel (What's New merged in), built
     like a small blog - fixed header, entry sidebar, article pane,
     responsive down to a phone ------------------------------------- */
  #jrnsheet { position:fixed; inset:0; z-index:40; display:none;
              background:var(--bg,#0B0F14); }
  #jrnsheet.open { display:flex; flex-direction:column; }
  .jhead { position:sticky; top:0; z-index:3; display:flex;
           align-items:center; gap:12px; flex:0 0 auto;
           padding:calc(14px + env(safe-area-inset-top)) 24px 14px;
           background:rgba(11,15,20,.92);
           -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
           border-bottom:1px solid #232B36; }
  .jhead h3 { margin:0; font-size:16px; letter-spacing:.2px; }
  .jhead .sub { color:var(--faint); font-size:12px; }
  .jhead .grow { flex:1 1 auto; }
  .jbody { flex:1 1 auto; min-height:0; display:grid;
           grid-template-columns:300px minmax(0,1fr); }
  .jbody > * { min-width:0; }   /* grid children overflow without this */
  .jside { border-right:1px solid #232B36; overflow-y:auto;
           padding:14px 14px 32px 16px; }
  .jsec { color:var(--faint); font-size:11px; letter-spacing:1px;
          padding:10px 8px 6px; }
  .jitem { display:block; width:100%; margin-bottom:3px;
           text-align:left; background:none;
           border:0; border-left:2px solid transparent; cursor:pointer;
           color:#C7D0DA; padding:8px 10px; border-radius:0 4px 4px 0;
           font-size:13px; line-height:1.35; }
  .jitem:hover { background:#151B23; }
  .jitem.on { background:#151B23; border-left-color:var(--accent,#2F81F7);
              color:#EAF2F3; font-weight:600; }
  .jitem .d { display:block; color:var(--faint); font-size:11px;
              font-weight:400; margin-top:2px; }
  .jitem .k { display:inline-block; font-size:10px; padding:0 6px;
              border-radius:999px; margin-right:6px; vertical-align:1px;
              border:1px solid #2A323D; color:var(--faint); }
  .jitem .k.finding { color:#7DF29B; border-color:rgba(125,242,155,.35); }
  .jmain { overflow-y:auto; padding:30px 44px 72px; }
  .jart { max-width:700px; margin:0 auto; padding-right:8px; }
  .jtitle { font-weight:700; font-size:22px; line-height:1.25;
            overflow-wrap:anywhere; margin-bottom:8px; }
  .jmeta { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
           margin-bottom:18px; }
  .jdate { color:var(--faint); font-size:12px; }
  .jscore { font-size:11px; font-weight:700; letter-spacing:.3px;
            color:#7DF29B; background:rgba(125,242,155,.10);
            border:1px solid rgba(125,242,155,.28); border-radius:999px;
            padding:2px 9px; overflow-wrap:anywhere; }
  .jbodyp { color:#C7D0DA; font-size:15px; line-height:1.65;
            margin:0 0 14px; overflow-wrap:anywhere; }
  .jfig { margin:18px 0; }
  .jfig img { display:block; width:100%; height:auto; max-height:56vh;
              object-fit:contain; object-position:left top;
              background:#0B0F14; border:1px solid #232B36;
              border-radius:6px; cursor:zoom-in; }
  .jcap { color:var(--faint); font-size:12.5px; line-height:1.5;
          margin-top:6px; overflow-wrap:anywhere; }
  /* LIGHTBOX. Tapping a journal picture used to window.open() it, which
     in the installed app opens a chromeless view with no back button -
     Joe: "there's no Back or exit button. I'm stuck." A picture must
     never be able to strand the reader, so it opens HERE, over the
     page, with four independent ways out: the Close button, the scrim,
     Escape, and the phone's own Back (a history entry is pushed). */
  /* OPAQUE, not a translucent scrim. The offscreen render showed the
     page reading through a 94% wash - "Dev Journal", "Sessions" and the
     stats rows all legible behind the picture, which looks broken and
     breaks the flat-surface rule. A picture is a full takeover. */
  #lb { position:fixed; inset:0; z-index:120; display:none;
        background:var(--bg,#0B0F14); }
  #lb.on { display:flex; flex-direction:column; }
  #lb-bar { display:flex; align-items:center; gap:10px; flex:0 0 auto;
            padding:10px 12px; border-bottom:1px solid var(--line);
            background:var(--panel); }
  #lb-close { background:none; border:1px solid #232B36; border-radius:2px;
              color:var(--text); font-size:14px; font-weight:600;
              padding:8px 14px; cursor:pointer; min-height:38px; }
  #lb-close:active { background:#1A212B; }
  #lb-close:focus { outline:none; }      /* DESIGN.md: no focus rectangles */
  #lb-hint { color:var(--faint); font-size:12px; overflow-wrap:anywhere; }
  #lb-stage { flex:1 1 auto; display:flex; align-items:center;
              justify-content:center; overflow:auto; padding:10px;
              -webkit-overflow-scrolling:touch; }
  /* FIT by default, and TAP THE PICTURE for actual size. These are wide
     evidence strips - four ball crops side by side - and fitting one to
     a 390px phone renders it smaller than it was in the article, so
     "tap to see the picture" would make the picture harder to see. In
     .zoom the image drops to natural width and the stage scrolls. */
  #lb-stage img { max-width:100%; max-height:100%; object-fit:contain;
                  display:block; cursor:zoom-in; }
  #lb-stage.zoom { align-items:flex-start; justify-content:flex-start; }
  #lb-stage.zoom img { max-width:none; max-height:none; width:auto;
                       cursor:zoom-out; }
  #lb-cap { flex:0 0 auto; color:var(--faint); font-size:12.5px;
            line-height:1.5; padding:10px 12px;
            border-top:1px solid var(--line); background:var(--panel);
            max-height:28vh; overflow:auto; overflow-wrap:anywhere; }
  #lb-cap:empty { display:none; }
  .jnav { display:flex; gap:10px; margin-top:28px;
          border-top:1px solid #232B36; padding-top:14px; }
  .jnav button { background:none; border:1px solid #232B36; color:#9AA4B2;
                 border-radius:4px; padding:8px 14px; font-size:13px;
                 cursor:pointer; }
  .jnav button:disabled { opacity:.35; cursor:default; }
  .jempty { color:var(--faint); font-size:14px; padding:14px 0; }
  /* ---- rich entry content (entries may ship HTML) ---------------- */
  .jc { color:#C7D0DA; font-size:15px; line-height:1.65; }
  .jc h2 { font-size:15px; letter-spacing:.6px; text-transform:uppercase;
           color:var(--faint); margin:22px 0 8px; font-weight:700; }
  .jc h3 { font-size:16px; margin:18px 0 6px; color:#EAF2F3; }
  .jc p { margin:0 0 12px; overflow-wrap:anywhere; }
  .jc ul, .jc ol { margin:0 0 12px 20px; }
  .jc li { margin:4px 0; }
  .jc strong { color:#EAF2F3; }
  .jc code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:13px; background:#151B23; border:1px solid #232B36;
             border-radius:3px; padding:1px 5px; overflow-wrap:anywhere; }
  .jc table { width:100%; border-collapse:collapse; margin:10px 0 16px;
              font-size:13.5px; }
  .jc th { text-align:left; color:var(--faint); font-weight:600;
           font-size:11px; letter-spacing:.6px; text-transform:uppercase;
           padding:6px 8px; border-bottom:1px solid #232B36; }
  .jc td { padding:7px 8px; border-bottom:1px solid #171E26;
           vertical-align:top; overflow-wrap:anywhere; }
  .jc td.num { text-align:right; font-variant-numeric:tabular-nums;
               white-space:nowrap; }
  .jc .pass { color:#3FB950; font-weight:700; }
  .jc .fail { color:#E5484D; font-weight:700; }
  .jc .note { border-left:2px solid var(--accent,#2F81F7);
              background:#0F141A; padding:10px 14px; margin:14px 0;
              border-radius:0 4px 4px 0; }
  .jc .win { border-left-color:#3FB950; }
  .jc .warn { border-left-color:#E3B341; }
  .jc .grid2 { display:grid; gap:14px; margin:14px 0;
               grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .jc figure { margin:0; }
  .jc figure img { width:100%; height:auto; max-height:52vh;
                   object-fit:contain; object-position:left top;
                   background:#0B0F14; border:1px solid #232B36;
                   border-radius:6px; cursor:zoom-in; }
  .jc figcaption { color:var(--faint); font-size:12px; margin-top:5px;
                   line-height:1.45; }
  /* pinned status view: the bench scorecard, recomputed every round */
  .jstat { border:1px solid #232B36; border-radius:8px; padding:16px 18px;
           margin-bottom:18px; background:#0F141A; }
  .jstatgrid { display:grid; gap:12px; margin:12px 0 4px;
               grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
  .jstatbox { border:1px solid #232B36; border-radius:6px; padding:10px 12px; }
  .jstatbox .v { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .jstatbox .l { color:var(--faint); font-size:11px; letter-spacing:.5px;
                 margin-top:2px; }
  .jshotrow { display:flex; gap:10px; align-items:baseline; padding:6px 0;
              border-bottom:1px solid #171E26; font-size:13px; }
  .jshotrow:last-child { border-bottom:0; }
  .jshotrow .mk { flex:0 0 auto; font-weight:800; width:22px; }
  .jshotrow .tm { flex:0 0 auto; color:var(--faint);
                  font-variant-numeric:tabular-nums; width:52px; }
  .jshotrow .ds { flex:1 1 auto; color:#C7D0DA; overflow-wrap:anywhere; }
  .ok { color:#3FB950; } .bad { color:#E5484D; }
  @media (min-width: 1500px) {
    .jbody { grid-template-columns:340px minmax(0,1fr); }
    .jmain { padding:34px 64px 80px; }
    .jart { max-width:760px; }
  }
  @media (max-width: 860px) {
    .jbody { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
    .jside { border-right:0; border-bottom:1px solid #232B36;
             display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
             padding:8px 10px; }
    .jsec { display:none; }
    .jitem { flex:0 0 auto; width:auto; max-width:60vw; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; border-left:0;
             border:1px solid #232B36; border-radius:999px; padding:6px 12px; }
    .jitem.on { border-color:var(--accent,#2F81F7); }
    .jitem .d, .jitem .k { display:none; }
    .jmain { padding:20px 18px 52px; }
    .jart { padding-right:0; }
    .jtitle { font-size:19px; }
  }
  .chip .chipdet { display:none; }   /* desktop-only detail span */
  .chip { min-width:42px; height:42px; border-radius:4px; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center;
          background:var(--panel); border:2px solid var(--line);
          font-weight:700; }
  .chip.make { border-color:var(--make); color:var(--make); }
  .chip.miss { border-color:#39414d; color:var(--text); }
  .chip.scratch { border-color:var(--scratch); color:var(--scratch); }
  .chip.inhand { border-color:#242b35; color:var(--faint); opacity:.55;
                 font-size:11px; }
  .chip.cur { background:#1B2430; outline:2px solid var(--accent); }
  .empty { padding:32px 16px; color:var(--dim); text-align:center; }
  /* ---- desktop mode (Joe: "see the controls and parameters without
     the fields covering the video") — pure CSS, phone DOM untouched.
     Wide window: video owns the left column edge-to-edge; shot info,
     lane, transport and chips live in a right rail; the overlay menu
     and correction sheet anchor to the right edge instead of covering
     the picture. -------------------------------------------------- */
  @media (min-width: 1100px) {
    #player.open {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top top" "video side";
      column-gap: 16px;
      padding: 0 16px 12px;
    }
    #topbar { grid-area: top; }
    #vwrap  { grid-area: video; }
    #shotbar {
      grid-area: side;
      display: flex; flex-direction: column;
      overflow-y: auto; min-height: 0;
      border-left: 1px solid #232B36; padding-left: 16px;
    }
    #lane { height: 56px; }
    /* shot chips become a VERTICAL LIST on desktop (Joe): one row per
       shot with time + outcome; the rail scrolls, colors unchanged */
    #chips { flex-direction: column; flex-wrap: nowrap;
             overflow-x: visible; gap: 4px; }
    #chips .chip { width: 100%; min-height: 32px;
                   display: flex; align-items: center;
                   justify-content: flex-start; padding: 0 12px;
                   box-sizing: border-box; }
    #chips .chip .chipdet { display: inline; margin-left: auto;
                            font-size: 12px; color: var(--faint);
                            font-weight: 400; }
    /* overlays hug the right rail instead of the video */
    #ovmenu { left: auto !important; right: 24px; }
    #sheet {
      left: auto !important; right: 0 !important;
      width: 420px; max-width: 40vw;
      border-left: 1px solid #232B36;
    }
    #sessions { max-width: 760px; margin: 0 auto; }
  }
</style>
</head>
<body>
<header>
  <h1>BILLIARDS REVIEW</h1>
  <span class="sub" id="build"></span>
</header>
<div id="update">Update available — tap to reload</div>
<div id="lb" aria-hidden="true" role="dialog" aria-modal="true"
     aria-label="Picture">
  <div id="lb-bar">
    <button id="lb-close" type="button">‹ Close</button>
    <span id="lb-hint">tap picture to zoom · tap outside to close</span>
  </div>
  <div id="lb-stage"><img id="lb-img" alt=""></div>
  <div id="lb-cap"></div>
</div>
<div id="keygate"></div>
<div id="keyentry" style="display:none; padding:0 24px 24px; text-align:center;">
  <input id="keyfield" placeholder="paste key here" autocapitalize="off"
         autocorrect="off" spellcheck="false"
         style="width:100%; max-width:340px; height:44px; padding:0 12px; font-size:16px;
                background:var(--panel); border:1px solid var(--line);
                border-radius:4px; color:var(--text); font-size:15px;">
  <button id="keysave"
          style="margin-top:10px; height:44px; padding:0 24px;
                 background:var(--panel); border:1px solid var(--accent);
                 border-radius:4px; color:var(--accent); font-weight:600;
                 font-size:15px;">Save key</button>
</div>

<div id="sessions"></div>
    <div id="statsheet" style="display:none;position:fixed;inset:0;z-index:40;
         background:var(--bg,#0B0F14);overflow-y:auto">
      <div style="margin:calc(10px + env(safe-area-inset-top)) 12px 20px;
           background:var(--panel,#12161C);border:1px solid #2A323D;
           border-radius:16px;padding:18px 16px 12px">
        <div style="display:flex;align-items:center;margin-bottom:4px">
          <h3 style="margin:0;font-size:17px">Lifetime Stats</h3>
          <button id="stats-close" style="margin-left:auto;min-width:44px">‹ Home</button>
        </div>
        <div id="stats-body" ></div>
      </div>
    </div>
    <div id="ovmenu">
      <div class="grab"></div>
      <h3>Drawing tools</h3>
      <div class="tools">
        <button id="d-line" class="tool"><span class="ic">╱</span>
          <span class="lb">Line</span></button>
        <button id="d-angle" class="tool"><span class="ic">∠</span>
          <span class="lb">Angle</span></button>
        <button id="d-show" class="tool"><span class="ic">👁</span>
          <span class="lb" id="d-show-lb">Shown</span></button>
        <button id="d-clear" class="tool"><span class="ic">🗑</span>
          <span class="lb">Clear</span></button>
      </div>
      <button id="d-del" class="lrow" disabled style="display:none"></button>
      <h3>View</h3>
      <button id="ov-rot" class="lrow">Rotate 180°
        <span class="chev" id="ov-rot-st">Off</span></button>
      <h3>Overlays</h3>
      <button id="ov-aim" class="lrow">Aim line
        <span class="chev" id="ov-aim-st">Off</span></button>
      <button id="ov-paths" class="lrow">Ball paths
        <span class="chev" id="ov-paths-st">Off</span></button>
      <button id="ov-why" class="lrow">Shot lines
        <span class="chev" id="ov-why-st">Off</span></button>
    </div>
    <div id="dtools">
      <div class="dtrow">
        <span id="dt-colors" style="display:flex;gap:10px"></span>
        <button id="dt-w" style="min-width:40px;background:none;border:none;
                color:var(--text)">──</button>
        <button id="dt-del" style="min-width:36px;background:none;
                border:none">🗑</button>
      </div>
      <div class="dtrow">
        <label>◐</label>
        <input id="dt-a" type="range" min="15" max="100" value="55">
      </div>
      <div class="dtrow" id="dt-lenrow" style="display:none">
        <label>↔</label>
        <input id="dt-len" type="range" min="5" max="160" value="40"
               title="line length">
      </div>
    </div>
    <div id="sh-backdrop"></div>
    <div id="sheet">
      <div id="sh-grab"></div>
      <div id="sh-scroll">
        <p id="sh-desc"></p>
        <div class="row tools">
          <button id="sh-split">✂<small>Split</small></button>
          <button id="sh-copyid">⧉<small>Shot ID</small></button>
          <button id="pl-save">☆<small>Playlist</small></button>
          <button id="rife-req">✨<small>Slo-mo</small></button>
        </div>
        <div id="pl-pick" style="display:none"></div>
        <div class="sh-section" id="sh-measured">
          <div class="sh-label">MEASURED</div>
          <div id="sh-stay" style="display:none"></div>
          <div class="row" id="sh-stroke" style="display:none">
            <span id="sh-stroke-txt"></span>
          </div>
          <div id="sh-missing" style="display:none"></div>
        </div>
        <div class="sh-section">
          <div class="sh-label">YOUR CALL</div>
          <div class="row seg" id="sh-cut">
            <span class="seg-cap">CUT</span>
            <button data-c="left">LEFT</button>
            <button data-c="straight">STRAIGHT</button>
            <button data-c="right">RIGHT</button>
          </div>
          <div class="row seg" id="sh-miss">
            <span class="seg-cap">MISSED</span>
            <button data-m="left">LEFT</button>
            <button data-m="right">RIGHT</button>
          </div>
          <div class="row seg" id="sh-outcome">
            <span class="seg-cap">RESULT</span>
            <button data-o="make">MAKE</button>
            <button data-o="miss">MISS</button>
            <button data-o="scratch">SCRATCH</button>
          </div>
          <div class="row seg" id="sh-action">
            <span class="seg-cap">EVENT</span>
            <button data-a="stroke">STROKE</button>
            <button data-a="break">BREAK</button>
            <button data-a="ball_in_hand">IN HAND</button>
            <button data-a="rearrange">SHUFFLE</button>
          </div>
          <textarea id="sh-note"
            placeholder="Optional note — what did you see?"></textarea>
        </div>
        <div class="row">
          <button id="sh-clear"
                  style="display:none;color:var(--scratch);
                         border-color:var(--scratch);">Remove correction</button>
        </div>
      </div>
      <div id="sh-foot">
        <button id="sh-cancel">Cancel</button>
        <button id="sh-confirm">✓ Looks right</button>
        <button id="sh-save">Save</button>
      </div>
    </div>
  </div>
    <div id="jrnsheet">
      <div class="jhead">
        <h3>Dev Journal</h3>
        <span class="sub" id="jrn-count"></span>
        <span class="grow"></span>
        <button id="jrn-close" style="min-width:44px">‹ Home</button>
      </div>
      <div class="jbody">
        <div class="jside" id="jrn-side"></div>
        <div class="jmain" id="jrn-main"></div>
      </div>
    </div>

    <div id="player">
  <div id="topbar">
    <button id="back">‹ Sessions</button>
    <span id="title"></span>
    <button id="ovbtn" title="overlays &amp; drawing"
            style="flex:0 0 auto;min-width:46px;margin-left:8px">☰</button>
  </div>
  <div id="vwrap" style="position:relative; flex:1 1 auto; min-height:120px; display:flex; overflow:hidden;">
    <!-- ONLY this layer rotates (Joe: "keep your legend upright when I
         rotate the video", "play button seems to flip"). The video and
         the canvases that share its coordinate space live inside; every
         piece of HUD chrome stays outside and upright. -->
    <div id="vrot" style="position:absolute; inset:0; display:flex;">
    <video id="video" playsinline preload="metadata"></video>
    <canvas id="scrubcv" style="position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none"></canvas>
    <canvas id="trails"></canvas>
    <canvas id="drawcv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none"></canvas>
    </div><!-- /vrot -->
    <button id="zoomreset" style="display:none;position:absolute;top:12px;
         right:12px;z-index:21;background:rgba(13,17,23,.85);color:#EAF2F3;
         border:1px solid #2A323D;border-radius:14px;padding:4px 12px;
         font-size:13px;font-weight:700">1×</button>
    <div id="holdpill" style="display:none;position:absolute;top:12px;
         left:50%;transform:translateX(-50%);background:rgba(13,17,23,.85);
         color:#EAF2F3;border:1px solid #2A323D;border-radius:14px;
         padding:4px 12px;font-size:13px;font-weight:700;z-index:20">¼×</div>
    <div id="spinner"><div></div></div>
    <div id="paused-glyph">▶</div>
    <div id="legend"></div>
  </div>
  <div id="shotbar">
    <div id="shotinfo">
      <span class="n" id="shot-n">–</span>
      <span class="oc" id="shot-oc"></span>
      <span class="t" id="shot-t"></span>
    </div>
    <div id="inline"></div>
    <div id="lane"><div id="playhead"></div></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="fprev" title="back one frame">‹·</button>
      <button id="play" title="play / pause">▶</button>
      <button id="mode" title="repeat this shot">⟳</button>
      <button id="rate" title="playback speed">1×</button>
      <button id="fnext" title="forward one frame">·›</button>
      <button id="next">›</button>
    </div>
    <div id="lower">
      <button id="correct">✎ Correct this clip</button>
      <div id="chips"></div>
    </div>
    <div id="ovscrim"></div>
</div>

<script src="app.js?v=__BUILD_ID__"></script>
</body>
</html>
