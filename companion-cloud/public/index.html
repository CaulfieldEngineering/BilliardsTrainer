      $("dt-a").value = Math.round((o.alpha != null ? o.alpha : 0.55) * 100);
      const c = o.color || "#7DF29B";
      [...$("dt-colors").children].forEach(b =>
        b.classList.toggle("on", b.dataset.c === c));
      const isLine = o.type === "line";
      $("dt-lenrow").style.display = isLine ? "flex" : "none";
      if (isLine) {
        const AR = 936 / 1640;
        const L = Math.hypot((o.pts[1][0] - o.pts[0][0]) * AR,
                             o.pts[1][1] - o.pts[0][1]);
        $("dt-len").value = Math.max(5, Math.min(160, Math.round(L * 100)));
      }
    }
  }
  return {
    render, add,
    toggleShow: () => { show = !show; syncUI(); },
    removeSel: () => { if (sel >= 0) { objs.splice(sel, 1); sel = -1; save(); syncUI(); } },
    clear: () => { objs = []; sel = -1; save(); syncUI(); },
  };
})();
function ovOpen(open) {
  $("ovmenu").style.display = open ? "block" : "none";
  $("ovscrim").style.display = open ? "block" : "none";
  if (!open) $("pl-pick").style.display = "none";

}
// The slo-mo button is STATE-AWARE (Joe): if this shot's render already
// exists in the Slow-mo playlist, the button VIEWS it instead of
// re-requesting.
function rifeNameFor(s2) {
  const sess = (s2._session || curSession || "").replace(/\.mp4$/, "");
  return `slowmo-${sess}-${Math.round(s2.start)}.mp4`;
}
function findSlowmo(s2) {
  if (!s2 || s2._slowmo) return null;
  const want = rifeNameFor(s2);
  const pl = PL.all().find(q => q.name === "Slow-mo");
  if (!pl) return null;
  const idx = pl.clips.findIndex(c => c.slowmo === want);
  return idx >= 0 ? { pl, idx } : null;
}
function syncRifeBtn() {
  const hit = findSlowmo((typeof target !== "undefined" && target)
                         || shots[cur]);
  $("rife-req").textContent = hit ? "▶ View slo-mo" : "✨ Slo-mo";
}
$("ovbtn").onclick = () => ovOpen($("ovmenu").style.display !== "block");
$("ovscrim").onclick = () => ovOpen(false);
// ---- save the current clip into a playlist (picker inline in the menu)
$("pl-save").onclick = () => {
  const box = $("pl-pick");
  if (box.style.display !== "none") { box.style.display = "none"; return; }
  box.innerHTML = "";
  const choose = pl => {
    const s = shots[cur];
    if (!s) return;
    const ls = PL.all();
    const t = ls.find(p => p.id === pl.id) || pl;
    const sess = s._session || curSession;
    if (!t.clips.some(c => c.session === sess
        && Math.abs(c.start - s.start) < 0.5))
      t.clips.push({ session: sess, start: s.start });
    t.mod = Date.now();
    if (!ls.some(p => p.id === t.id)) ls.push(t);
    PL.save(ls);
    box.style.display = "none";
    $("pl-save").textContent = `✓ ${t.name}`;
    setTimeout(() => { $("pl-save").textContent = "☆ Playlist"; }, 1600);
  };
  PL.all().forEach(pl => {
    const b = document.createElement("button");
    b.textContent = `${pl.name} (${pl.clips.length})`;
    b.style.cssText = "display:block;width:100%;margin-bottom:6px;text-align:left";
    b.onclick = () => choose(pl);
    box.appendChild(b);
  });
  const nb = document.createElement("button");
  nb.textContent = "＋ New playlist…";
  nb.style.cssText = "display:block;width:100%;text-align:left";
  nb.onclick = () => {
    const name = (prompt("Playlist name") || "").trim();
    if (name) choose(PL.create(name));
  };
  box.appendChild(nb);
  box.style.display = "block";
};
$("rife-req").onclick = async () => {
  const s2 = target || shots[cur];
  if (!s2 || s2._slowmo) return;
  const hit = findSlowmo(s2);
  if (hit) {                        // already rendered: jump to the clip
    ovOpen(false);
    await openPlaylist(hit.pl);
    if (hit.idx > 0) gotoShot(hit.idx, true);
    return;
  }
  $("rife-req").textContent = "✨ Requesting…";
  try {
    await api("/api/correct", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: s2._session || curSession,
                             start: s2.start, end: s2.end, rife: true }),
    });
    $("rife-req").textContent = "✓ Queued";
  } catch (e) {
    $("rife-req").textContent = "✕ Retry";
  }
  setTimeout(syncRifeBtn, 2500);
};
// pinch-zoom belt-and-suspenders (iOS ignores user-scalable in odd cases)
document.addEventListener("gesturestart", e => e.preventDefault());
$("video").addEventListener("contextmenu", e => e.preventDefault());
$("d-line").onclick = () => { Draw.add("line"); ovOpen(false); };
$("d-angle").onclick = () => { Draw.add("angle"); ovOpen(false); };
$("d-show").onclick = () => Draw.toggleShow();
$("d-del").onclick = () => Draw.removeSel();
$("d-clear").onclick = () => Draw.clear();

// ---- frame stepping (Joe: "thumb scroll frame by frame"): single-
// frame nudges with precise seeks; pauses playback so the frame holds.
(() => {
  const step = dir => {
    const v = $("video");
    v.pause();
    requestSeek(Math.max(0, v.currentTime + dir / 30), false);
  };
  $("fprev").onclick = () => step(-1);
  $("fnext").onclick = () => step(1);
})();

// ---- slow motion (Joe): ONE button on the transport line, tap to
// cycle 1x -> 1/2x -> 1/4x -> 1x. iOS resets rate on new media, so
// reapply on every play.
const RATES = [1, 0.5, 0.25];
const RATE_LABEL = { 1: "1×", 0.5: "½×", 0.25: "¼×" };
let rate = parseFloat(localStorage.getItem("rate") || "1") || 1;
if (!RATES.includes(rate)) rate = 1;
function applyRate() {
  $("video").playbackRate = rate;
  $("rate").textContent = RATE_LABEL[rate];
  $("rate").classList.toggle("on", rate !== 1);
}
$("rate").onclick = () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  localStorage.setItem("rate", rate);
  applyRate();
};
$("video").addEventListener("play", applyRate);
applyRate();
modeLabel();



// no native controls: video tap and the ⏯ button both toggle
function togglePlay() {
  const v = $("video");
  if (v.paused) v.play(); else v.pause();
}
// ---- ZOOM (Joe: "zoom features for dialing in my paint overlays"):
// pinch scales the video AND every overlay canvas with one shared
// transform, so drawings stay glued and remain editable while zoomed.
// One-finger drag pans when zoomed (flick nav suspends until 1x).
const Zoom = (() => {
  let scale = 1, tx = 0, ty = 0;
  const els = () => [$("video"), $("trails"), $("drawcv"), $("scrubcv")];
  function apply() {
    const t = scale > 1
      ? `translate(${tx}px, ${ty}px) scale(${scale})` : "";
    els().forEach(el => {
      el.style.transformOrigin = "0 0";
      el.style.transform = t;
    });
    $("zoomreset").style.display = scale > 1 ? "block" : "none";
  }
  function clamp() {
    const r = $("vwrap").getBoundingClientRect();
    tx = Math.min(0, Math.max(r.width * (1 - scale), tx));
    ty = Math.min(0, Math.max(r.height * (1 - scale), ty));
  }
  return {
    get scale() { return scale; },
    pinch(cx, cy, factor) {
      const ns = Math.min(4, Math.max(1, scale * factor));
      const r = $("vwrap").getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      // keep the pinch centre stationary
      tx = px - (px - tx) * (ns / scale);
      ty = py - (py - ty) * (ns / scale);
      scale = ns;
      if (scale <= 1.02) { scale = 1; tx = ty = 0; }
      clamp(); apply();
    },
    pan(dx, dy) {
      if (scale <= 1) return;
      tx += dx; ty += dy; clamp(); apply();
    },
    reset() { scale = 1; tx = ty = 0; apply(); },
  };
})();
$("zoomreset").onclick = () => Zoom.reset();
// two-pointer tracking shared by video + draw canvas
const Pinch = { pts: new Map(), lastD: 0, active: false };
function pinchDown(e) {
  Pinch.pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (Pinch.pts.size === 2) { Pinch.active = true; Pinch.lastD = 0; }
}
function pinchMove(e) {
  if (!Pinch.pts.has(e.pointerId)) return false;
  Pinch.pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (Pinch.pts.size === 2) {
    const [a, b] = [...Pinch.pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    if (Pinch.lastD > 0) Zoom.pinch(cx, cy, d / Pinch.lastD);
    Pinch.lastD = d;
    return true;
  }
  return false;
}
function pinchUp(e) {
  Pinch.pts.delete(e.pointerId);
  if (Pinch.pts.size < 2) {
    Pinch.lastD = 0;
    if (Pinch.pts.size === 0) Pinch.active = false;
  }
}
["pointerdown"].forEach(ev => {
  $("drawcv").addEventListener(ev, pinchDown, true);
});
["pointermove"].forEach(ev => {
  $("drawcv").addEventListener(ev, e => { pinchMove(e); }, true);
});
["pointerup", "pointercancel"].forEach(ev => {
  $("drawcv").addEventListener(ev, pinchUp, true);
});

// ---- P1 GESTURE LAYER (clip-UI v2, Joe-approved): hold = momentary
// 1/4x peek (latched speed chip untouched — sacred), double-tap sides =
// +/-1s replay hop, horizontal flick = prev/next shot. Tap stays
// play/pause (fires after the double-tap window).
(() => {
  const v = $("video");
  let t0 = 0, x0 = 0, y0 = 0, moved = false, down = false;
  let holdTimer = null, holding = false, savedRate = 1;
  let lastTap = 0, tapTimer = null;
  const cancelHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  let panX = 0, panY = 0;
  v.addEventListener("pointerdown", e => {
    if (window.scrubActive) return;
    pinchDown(e);
    down = true; moved = false;
    t0 = Date.now(); x0 = e.clientX; y0 = e.clientY;
    panX = e.clientX; panY = e.clientY;
    holdTimer = setTimeout(() => {
      if (!down || moved) return;
      holding = true;
      savedRate = v.playbackRate;
      v.playbackRate = 0.25;
      if (v.paused) v.play().catch(() => {});
      $("holdpill").style.display = "block";
    }, 380);
  });
  v.addEventListener("pointermove", e => {
    if (pinchMove(e)) { moved = true; cancelHold(); return; }
    if (!down) return;
    if (Math.hypot(e.clientX - x0, e.clientY - y0) > 12) {
      moved = true; cancelHold();
      if (Zoom.scale > 1 && !Pinch.active) {
        Zoom.pan(ROT ? panX - e.clientX : e.clientX - panX,
                 ROT ? panY - e.clientY : e.clientY - panY);
      }
    }
    panX = e.clientX; panY = e.clientY;
  });
  const finish = e => {
    pinchUp(e);
    if (!down) return;
    down = false; cancelHold();
    if (Zoom.scale > 1 && moved) return;   // that was a pan, not a flick
    if (holding) {
      holding = false;
      v.playbackRate = savedRate;
      $("holdpill").style.display = "none";
      return;
    }
    const dx = e.clientX - x0, dy = e.clientY - y0;
    const dur = Date.now() - t0;
    if (moved && Math.abs(dx) > 64 && Math.abs(dx) > 2 * Math.abs(dy)
        && dur < 650) {                       // horizontal flick = shot nav
      if (dx < 0) gotoShot(Math.min(shots.length - 1, cur + 1), true);
      else gotoShot(Math.max(0, cur - 1), true);
      return;
    }
    if (moved) return;
    const now = Date.now();
    const r = v.getBoundingClientRect();
    const frac = (e.clientX - r.left) / Math.max(1, r.width);
    if (now - lastTap < 300) {                // double-tap: 1s hop
      clearTimeout(tapTimer); tapTimer = null; lastTap = 0;
      const lo = win ? win.t0 : 0, hi = win ? win.t1 : (v.duration || 1e9);
      if (frac < 0.33) requestSeek(Math.max(lo, v.currentTime - 1), false);
      else if (frac > 0.67) requestSeek(Math.min(hi, v.currentTime + 1), false);
      else togglePlay();                      // centre double-tap = just toggle
      return;
    }
    lastTap = now;
    tapTimer = setTimeout(() => { tapTimer = null; togglePlay(); }, 300);
  };
  v.addEventListener("pointerup", finish);
  v.addEventListener("pointercancel", () => {
    down = false; cancelHold();
    if (holding) {
      holding = false;
      v.playbackRate = savedRate;
      $("holdpill").style.display = "none";
    }
  });
})();
$("play").onclick = togglePlay;
$("video").addEventListener("pause", () => {
  $("vwrap").classList.add("paused");
  $("play").textContent = "▶";
});
$("video").addEventListener("play", () => {
  $("vwrap").classList.remove("paused");
  $("play").textContent = "❚❚";
});
// loading state: spinner whenever the pipe is actually stalling
const _vw = $("vwrap");
$("video").addEventListener("waiting", () => _vw.classList.add("loading"));
$("video").addEventListener("loadstart", () => _vw.classList.add("loading"));
["canplay", "playing", "seeked"].forEach(ev =>
  $("video").addEventListener(ev, () => _vw.classList.remove("loading")));

// ---- "Correct this clip" (Joe: human intervention) ---------------------
let curSession = null;
let pending = {};
function shotId(s2) {
  // stable conversational handle (Joe: "assign a Shot ID... so I can
  // address them with you"): session stem @ start-second. Survives
  // small re-segmentation drift via the reader's containment matching.
  const sess = ((s2 && s2._session) || curSession || "")
    .replace(/^session-/, "").replace(/\.mp4$/, "");
  return `${sess}@${Math.round((s2 && s2.start) || 0)}`;
}
$("sh-split").onclick = async () => {
  if (!target) return;
  const t = $("video").currentTime;
  if (!(t > target.start + 0.5 && t < target.end - 0.5)) {
    $("sh-split").textContent = "Scrub to shot 2 first";
    setTimeout(() => {
      $("sh-split").textContent = "✂ Split at playhead";
    }, 2200);
    return;
  }
  try {
    await api("/api/correct", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: target._session || curSession,
                             start: target.start,
                             split: Math.round(t * 100) / 100 }),
    });
    $("sh-split").textContent = "✓ Split queued";
  } catch (e) {
    $("sh-split").textContent = "✕ Failed — retry";
  }
  setTimeout(() => {
    $("sh-split").textContent = "✂ Split at playhead";
  }, 2500);
};
$("sh-copyid").onclick = async () => {
  if (!target) return;
  const id = shotId(target);
  try {
    await navigator.clipboard.writeText(id);
    $("sh-copyid").textContent = "✓ " + id;
  } catch (e) {
    $("sh-copyid").textContent = id;
  }
  setTimeout(() => {
    $("sh-copyid").textContent = "⧉ Copy Shot ID";
  }, 1800);
};
let target = null;    // the clip being corrected, FROZEN at sheet-open —
                      // playback keeps rolling and cur keeps advancing,
                      // which used to save the verdict to the wrong clip
let prevMode = null;  // mode to restore when Details closes
function setSheet(open) {
  $("sheet").style.display = open ? "block" : "none";
  $("nav").style.display = open ? "none" : "flex";
  $("lower").style.display = open ? "none" : "block";
  if (!open) {
    target = null;
    if (prevMode !== null) {    // Details borrowed loop mode; hand it back
      mode = prevMode;
      prevMode = null;
      modeLabel();
    }
  }
}
// Cut / Missed verdicts (Joe: "ensure the Cut/Miss tags are in the shot
// details, with the option to update these as corrections"). His tap is
// review-ranked ground truth: the stats table and the trajectory-fit
// validation both feed on it.
function _syncTagRows() {
  const t = (shots[cur] && shots[cur].tags) || {};
  [...$("sh-cut").querySelectorAll("button")].forEach(b =>
    b.classList.toggle("on", b.dataset.c === t.cut));
  [...$("sh-miss").querySelectorAll("button")].forEach(b =>
    b.classList.toggle("on", b.dataset.m === t.miss_side));
}
[...document.querySelectorAll("#sh-cut button")].forEach(b => b.onclick = async () => {
  const s0 = shots[cur]; if (!s0) return;
  s0.tags = s0.tags || {};
  s0.tags.cut = b.dataset.c; s0.tags.confidence = "review";
  _syncTagRows();
  await api("/api/correct", { method: "POST", body: {
    session: curSession, start: s0.start, cut: b.dataset.c } });
});
[...document.querySelectorAll("#sh-miss button")].forEach(b => b.onclick = async () => {
  const s0 = shots[cur]; if (!s0) return;
  s0.tags = s0.tags || {};
  s0.tags.miss_side = b.dataset.m; s0.tags.confidence = "review";
  _syncTagRows();
  await api("/api/correct", { method: "POST", body: {
    session: curSession, start: s0.start, miss_side: b.dataset.m } });
});

$("correct").onclick = () => {
  _syncTagRows();
  pending = {};
  target = shots[cur] || null;
  if (!target) return;
  syncRifeBtn();
  PL.pull().then(syncRifeBtn);     // catch renders finished since
  const no = shots.indexOf(target) + 1;
  // Details LOOPS the clip under judgment; the previous mode returns on
  // close (Joe). Snap playback onto the clip if it has rolled past.
  prevMode = mode;
  mode = "loop";
  modeLabel();
  if (cur !== no - 1) gotoShot(no - 1, !$("video").paused);
  $("sh-desc").textContent =
    `Shot ${no}: ${target.text || "(no description)"}`;
  $("sh-note").value = target.note || "";
  $("sh-clear").style.display =
    (target.corrected || target.reviewed) ? "block" : "none";
  setSheet(true);
  syncSheet();
};
$("sh-cancel").onclick = () => setSheet(false);
function syncSheet() {
  const s = target || {};
  const o = pending.outcome || s.outcome;
  const a = pending.action || s.action || "stroke";
  [...$("sh-outcome").children].forEach(b =>
    b.classList.toggle("sel", b.dataset.o === o));
  [...$("sh-action").children].forEach(b =>
    b.classList.toggle("sel", b.dataset.a === a));
}
[...$("sh-outcome").children].forEach(b =>
  b.onclick = () => { pending.outcome = b.dataset.o; syncSheet(); });
[...$("sh-action").children].forEach(b =>
  b.onclick = () => { pending.action = b.dataset.a; syncSheet(); });
async function postVerdict(s, body, optimistic) {
  Object.assign(s, optimistic);
  try {   // survive refetch until the server copy reflects it
    const ov = JSON.parse(localStorage.getItem("verdicts") || "{}");
    const k = curSession + "@" + s.start;
    if (body.clear) delete ov[k]; else ov[k] = optimistic;
    localStorage.setItem("verdicts", JSON.stringify(ov));
  } catch (e) { /* best-effort */ }
  setSheet(false);
  buildChips(); buildLane(); updateInfo();
  try {
    const r = await fetch("/api/correct", {
      method: "POST",
      headers: { "x-key": KEY || "", "Content-Type": "application/json" },
      body: JSON.stringify({ session: curSession, start: s.start, ...body }),
    });
    if (!r.ok) throw new Error(r.status);
    $("correct").textContent = "✓ saved — syncs to the PC via Dropbox";
  } catch (e) {
    $("correct").textContent = "⚠ save failed — try again";
  }
  setTimeout(updateInfo, 2500);
}
$("sh-save").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  const note = $("sh-note").value.trim();
  const patch = { ...pending };
  if (note && note !== (s.note || "")) patch.note = note;
  if (!patch.outcome && !patch.action && !patch.note) return setSheet(false);
  postVerdict(s, patch, { ...patch, corrected: true });
};
$("sh-confirm").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  postVerdict(s, { confirm: true }, { reviewed: true });
};
$("sh-clear").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  postVerdict(s, { clear: true },
              { corrected: false, reviewed: false, note: "" });
};

// keep "current shot" synced while playing
setInterval(() => {
  if (!$("player").classList.contains("open") || !shots.length) return;
  const t = $("video").currentTime;
  if (win && t >= win.t0 && t <= win.t1) return;   // inside the window: stay
  const i = shots.findIndex(s => t >= s.start - PRE_ROLL && t <= s.end + 0.5);
  if (i >= 0 && i !== cur) { cur = i; buildLane(); updateInfo(); }
}, 800);

loadSessions();
</script>
