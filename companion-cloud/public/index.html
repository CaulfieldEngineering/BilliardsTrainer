<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Billiards Review</title>
<style>
  :root { --bg:#0B0F14; --panel:#12161D; --line:#1D2530; --text:#E6EDF3;
          --dim:#7D8590; --faint:#3E4A5A; --make:#3FB950; --scratch:#E3B341;
          --accent:#58A6FF; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,
         "Segoe UI", sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:baseline; gap:10px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  /* floating pill BELOW the island — as a top bar it hid behind the
     clock (Joe's screenshot) */
  #update { display:none; position:fixed; z-index:20;
            top:calc(env(safe-area-inset-top) + 8px);
            left:16px; right:16px; padding:12px 16px;
            background:#122c1a; border:1px solid var(--make);
            border-radius:6px; color:var(--make); font-weight:600;
            text-align:center; }
  #keygate { padding:40px 24px; text-align:center; color:var(--dim);
             display:none; }
  #sessions { padding:8px 0; }
  .sess { display:grid; grid-template-columns: 1fr 64px 56px;
          gap:10px; padding:12px 16px; align-items:baseline;
          border-bottom:1px solid var(--line); }
  .sess:active { background:var(--panel); }
  .sess .d { font-weight:600; }
  .sess .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sess .dim { color:var(--dim); }
  .sess.stub .d, .sess.stub .num { color:var(--faint); font-weight:400; }
  .sess.head { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .sess.head span { color:var(--dim); font-size:11px; font-weight:600;
                    letter-spacing:.8px; }
  /* the player is a fixed-height column: video flexes to absorb what
     remains after the control stack, so every button fits on screen
     with zero scrolling (Joe) */
  #player { display:none; flex-direction:column; height:100dvh;
            overflow:hidden; }
  #player.open { display:flex; }
  #topbar { display:flex; align-items:center; gap:12px;
            padding:calc(8px + env(safe-area-inset-top)) 16px 8px; }
  #back { color:var(--accent); font-weight:600; background:none; border:none;
          font-size:15px; }
  #title { color:var(--dim); font-size:13px; margin-left:auto; }
  video { width:100%; height:100%; background:#000; display:block;
          object-fit:contain; }
  /* native controls are gone (Joe): tap the video to play/pause; a quiet
     glyph marks the paused state */
  #paused-glyph { position:absolute; inset:0; display:none;
                  align-items:center; justify-content:center;
                  font-size:44px; color:rgba(230,237,243,.55);
                  pointer-events:none; }
  #vwrap.paused #paused-glyph { display:flex; }
  #spinner { position:absolute; inset:0; display:none;
             align-items:center; justify-content:center;
             pointer-events:none; }
  #vwrap.loading #spinner { display:flex; }
  #vwrap.loading #paused-glyph { display:none; }
  #trails { position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; }
  #spinner div { width:36px; height:36px; border-radius:50%;
                 border:3px solid var(--line);
                 border-top-color:var(--accent);
                 animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #shotbar { padding:8px 16px calc(8px + env(safe-area-inset-bottom));
             flex:0 0 auto; }
  #shotinfo { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  #shotinfo .n { font-size:18px; font-weight:700; }
  #shotinfo .oc { font-weight:700; }
  #shotinfo .t { color:var(--dim); font-size:12px; margin-left:auto; }
  #desc { color:var(--dim); font-size:13px; min-height:1.3em;
          margin-bottom:6px; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; }
  #sheet #sh-desc { font-size:14px; line-height:1.45; color:var(--text);
                    margin-bottom:8px; }
  #nav { display:flex; gap:8px; margin-bottom:8px; }
  #nav #rate.on { color:var(--accent); border-color:var(--accent); }
  #correct { width:100%; height:38px; margin-bottom:8px;
             background:var(--panel); color:var(--dim);
             border:1px solid var(--line); border-radius:4px;
             font-size:14px; font-weight:600; }
  #sheet { display:none; }
  #sheet .row { display:flex; gap:6px; margin-bottom:8px; }
  #sheet button { flex:1; height:42px; background:var(--panel);
                  color:var(--dim); border:1px solid var(--line);
                  border-radius:4px; font-size:12px; font-weight:600; }
  #sheet button.sel { color:var(--make); border-color:var(--make); }
  #sheet textarea { width:100%; height:64px; padding:8px 10px;
                    background:var(--panel); color:var(--text);
                    border:1px solid var(--line); border-radius:4px;
                    /* 16px minimum or iOS auto-zooms on focus (Joe) */
                    font:16px/1.4 -apple-system, sans-serif; resize:none;
                    margin-bottom:8px; }
  #sheet #sh-save { color:var(--make); border-color:var(--make);
                    font-size:14px; }
  /* corrected clips: a subtle accent dot on the chip corner */
  .chip { position:relative; }
  .chip.fixed::after { content:""; position:absolute; top:3px; right:3px;
                       width:5px; height:5px; border-radius:50%;
                       background:var(--accent); }
  .chip.seen::after { content:""; position:absolute; top:3px; right:3px;
                      width:5px; height:5px; border-radius:50%;
                      background:var(--make); }
  #nav button { flex:1; height:44px; background:var(--panel); color:var(--text);
                border:1px solid var(--line); border-radius:4px; font-size:15px;
                font-weight:600; }
  #nav button:active { background:#1B2430; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px;
           -webkit-overflow-scrolling:touch; }
  /* glanceable shot facts: balls in play as coloured badges + the
     description's lead clause — full story stays in Details (Joe) */
  #inline { display:flex; align-items:center; gap:6px; min-height:22px;
            margin-bottom:6px; overflow:hidden; }
  #inline .ball { width:20px; height:20px; border-radius:50%; flex:0 0 auto;
                  display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:700; color:#0B0F14;
                  border:1px solid rgba(0,0,0,.4); }
  #inline .frag { color:var(--dim); font-size:12px; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; margin-left:4px; }
  #lane { position:relative; height:40px; margin:0 0 8px;
          background:var(--panel); border:1px solid var(--line);
          border-radius:4px; touch-action:none; overflow:hidden; }
  .region { position:absolute; top:5px; bottom:5px; border-radius:2px;
            opacity:.6; }
  .region.make { background:var(--make); }
  .region.miss { background:#4A5563; }
  .region.scratch { background:var(--scratch); }
  .region.inhand { background:var(--faint); opacity:.25; }
  .region.lead { opacity:.22; }
  #playhead { position:absolute; top:0; bottom:0; width:2px;
              background:var(--text); pointer-events:none; }
  /* between clips (continuity mode): the lane owns no time yet, so the
     playhead waits visibly instead of looking stuck */
  #playhead.waiting { opacity:.35; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.1; } }
  .chip { min-width:42px; height:42px; border-radius:4px; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center;
          background:var(--panel); border:2px solid var(--line);
          font-weight:700; }
  .chip.make { border-color:var(--make); color:var(--make); }
  .chip.miss { border-color:#39414d; color:var(--text); }
  .chip.scratch { border-color:var(--scratch); color:var(--scratch); }
  .chip.inhand { border-color:#242b35; color:var(--faint); opacity:.55;
                 font-size:11px; }
  .chip.cur { background:#1B2430; outline:2px solid var(--accent); }
  .empty { padding:32px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>BILLIARDS REVIEW</h1>
  <span class="sub" id="build"></span>
</header>
<div id="update">Update available — tap to reload</div>
<div id="keygate"></div>
<div id="keyentry" style="display:none; padding:0 24px 24px; text-align:center;">
  <input id="keyfield" placeholder="paste key here" autocapitalize="off"
         autocorrect="off" spellcheck="false"
         style="width:100%; max-width:340px; height:44px; padding:0 12px; font-size:16px;
                background:var(--panel); border:1px solid var(--line);
                border-radius:4px; color:var(--text); font-size:15px;">
  <button id="keysave"
          style="margin-top:10px; height:44px; padding:0 24px;
                 background:var(--panel); border:1px solid var(--accent);
                 border-radius:4px; color:var(--accent); font-weight:600;
                 font-size:15px;">Save key</button>
</div>

<div id="sessions"></div>

<div id="player">
  <div id="topbar">
    <button id="back">‹ Sessions</button>
    <span id="title"></span>
    <button id="ovbtn" title="overlays &amp; drawing"
            style="flex:0 0 auto;min-width:46px;margin-left:8px">☰</button>
  </div>
  <div id="vwrap" style="position:relative; flex:1 1 auto; min-height:120px; display:flex;">
    <video id="video" playsinline preload="metadata"></video>
    <div id="paused-glyph">▶</div>
    <div id="spinner"><div></div></div>
    <canvas id="scrubcv" style="position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none"></canvas>
    <canvas id="trails"></canvas>
    <canvas id="drawcv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none"></canvas>
  </div>
  <div id="shotbar">
    <div id="shotinfo">
      <span class="n" id="shot-n">–</span>
      <span class="oc" id="shot-oc"></span>
      <span class="t" id="shot-t"></span>
    </div>
    <div id="inline"></div>
    <div id="lane"><div id="playhead"></div></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="fprev" title="back one frame">‹·</button>
      <button id="play" title="play / pause">▶</button>
      <button id="mode" title="repeat this shot">⟳</button>
      <button id="rate" title="playback speed">1×</button>
      <button id="fnext" title="forward one frame">·›</button>
      <button id="next">›</button>
    </div>
    <div id="lower">
      <button id="correct">✎ Correct this clip</button>
      <div id="chips"></div>
    </div>
    <div id="ovmenu" style="display:none;position:absolute;right:12px;top:54px;
         left:auto;max-width:340px;z-index:40;background:#151A21;
         border:1px solid #2A323D;
         border-radius:2px;padding:10px 12px">
      <div style="display:flex;align-items:center;margin-bottom:8px">
        <span style="font-size:12px;letter-spacing:.08em;color:#8A94A2">DRAWING</span>
        <button id="ov-close" style="margin-left:auto;min-width:40px;
                padding:4px 10px">✕</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="d-line">＋ Line</button>
        <button id="d-angle">＋ Protractor</button>
        <button id="d-show">👁 Shown</button>
        <button id="d-del" disabled>Remove selected</button>
        <button id="d-clear">Clear shot</button>
      </div>
      <div style="font-size:12px;color:#5A6472;margin-top:10px">
        Aim line &amp; ball paths arrive here with the analysis overlays.
      </div>
    </div>
    <div id="dtools" style="display:none;position:absolute;left:12px;right:12px;
         bottom:90px;z-index:39;background:#151A21;border:1px solid #2A323D;
         border-radius:2px;padding:8px 10px;align-items:center;gap:10px">
      <span id="dt-colors" style="display:flex;gap:8px"></span>
      <button id="dt-w" style="min-width:44px">──</button>
      <input id="dt-a" type="range" min="15" max="100" value="55"
             style="flex:1;min-width:60px">
      <button id="dt-del" style="min-width:40px">🗑</button>
    </div>
    <div id="sheet">
      <p id="sh-desc"></p>
      <div class="row" id="sh-outcome">
        <button data-o="make">MAKE</button>
        <button data-o="miss">MISS</button>
        <button data-o="scratch">SCRATCH</button>
      </div>
      <div class="row" id="sh-action">
        <button data-a="stroke">STROKE</button>
        <button data-a="break">BREAK</button>
        <button data-a="ball_in_hand">IN HAND</button>
        <button data-a="rearrange">SHUFFLE</button>
      </div>
      <textarea id="sh-note" placeholder="Details — what did the system get wrong?"></textarea>
      <div class="row">
        <button id="sh-confirm" style="color:var(--make);
                border-color:var(--make);">✓ Looks right — mark reviewed</button>
      </div>
      <div class="row">
        <button id="sh-cancel">Cancel</button>
        <button id="sh-save">Save correction</button>
      </div>
      <div class="row">
        <button id="sh-clear"
                style="display:none; color:var(--scratch);
                       border-color:var(--scratch);">Remove correction</button>
      </div>
    </div>
  </div>
</div>

<script>
const BUILD = "__BUILD_ID__";
const PRE_ROLL = 5.0;
const $ = id => document.getElementById(id);
$("build").textContent = BUILD.slice(0, 10);

// ---- key handling: arrives once as ?k=, lives in localStorage ----------
const url = new URL(location.href);
if (url.searchParams.get("k")) {
  // strip anything a chat renderer glued onto the key (asterisks,
  // punctuation, whitespace) — the key alphabet is base64url only
  const raw = url.searchParams.get("k").replace(/[^A-Za-z0-9_-]/g, "");
  localStorage.setItem("key", raw);
  url.searchParams.delete("k");
  history.replaceState(null, "", url.pathname);
}
let KEY = localStorage.getItem("key");
document.addEventListener("DOMContentLoaded", () => {
  $("keysave").onclick = () => {
    const v = $("keyfield").value.replace(/[^A-Za-z0-9_-]/g, "");
    if (!v) return;
    localStorage.setItem("key", v);
    KEY = v;
    $("keygate").style.display = "none";
    $("keyentry").style.display = "none";
    loadSessions();
  };
});

async function api(path) {
  const r = await fetch(path, { headers: { "x-key": KEY || "" } });
  if (r.status === 401) {
    // say exactly which failure this is, so remote debugging isn't a guess
    $("keygate").textContent = KEY
      ? `A key ending "…${KEY.slice(-4)}" (${KEY.length} chars) is stored, ` +
        "but the server rejected it. Re-open the current install link — " +
        "the key may have been rotated or mangled."
      : "No key stored on this device yet. Open the install link " +
        "(the one containing ?k=…) once.";
    $("keygate").style.display = "block";
    $("keyentry").style.display = "block";
    $("sessions").innerHTML = "";
    throw new Error("401");
  }
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

// ---- self-update: poll version.json, offer one-tap reload --------------
async function checkUpdate() {
  try {
    const r = await fetch("/version.json?ts=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v.build && v.build !== BUILD) $("update").style.display = "block";
  } catch (e) { /* offline is fine */ }
}
$("update").onclick = () => location.reload();
document.addEventListener("visibilitychange",
  () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---- sessions list ------------------------------------------------------
function fmtDate(name, iso) {
  const m = name.match(/session-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return name;
  // Filename stamps are UTC (controller uses datetime.now(timezone.utc);
  // verified against file mtime: a 14-min session ending 9:11 PM EDT is
  // named 20260820-005647). The "Z" is CORRECT — Joe was not playing
  // pool at 12:56 AM, and briefly "fixing" this said he was.
  const d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00Z`);
  return d.toLocaleString([], { month: "short", day: "numeric",
                                hour: "numeric", minute: "2-digit" });
}
async function loadSessions() {
  const box = $("sessions");
  box.innerHTML = "<div class='empty'>Loading sessions…</div>";
  try {
    const resp = await api("/api/sessions");
    box.innerHTML = "";
    if (!resp.sessions.length) box.innerHTML = "<div class='empty'>No sessions.</div>";
    else {
      const head = document.createElement("div");
      head.className = "sess head";
      ["DATE", "LENGTH", "SHOTS"].forEach((t, i) => {
        const sp = document.createElement("span");
        if (i > 0) sp.className = "num";
        sp.textContent = t;
        head.appendChild(sp);
      });
      box.appendChild(head);
    }
    const fmtDur = d => d == null ? "–"
      : d >= 3600 ? `${Math.floor(d / 3600)}h${String(Math.floor(d % 3600 / 60)).padStart(2, "0")}`
      : d >= 60 ? `${Math.floor(d / 60)}m` : `${Math.floor(d)}s`;
    resp.sessions.forEach(s => {
      const el = document.createElement("div");
      el.className = "sess" + (s.analyzed ? "" : " stub");
      // textContent only — a Dropbox filename is untrusted input and the
      // fmtDate fallback returns it raw (security review: XSS sink).
      const d = document.createElement("span");
      d.className = "d";
      d.textContent = fmtDate(s.name, s.modified);
      const len = document.createElement("span");
      len.className = "num" + (s.dur_s == null ? " dim" : "");
      len.textContent = fmtDur(s.dur_s);
      const sh = document.createElement("span");
      sh.className = "num" + (s.shots == null ? " dim" : "");
      sh.textContent = s.shots == null ? "–" : s.shots;
      el.append(d, len, sh);
      el.onclick = () => openSession(s);
      box.appendChild(el);
    });
  } catch (e) {
    if (String(e.message) !== "401")
      box.innerHTML = `<div class='empty'>Couldn't reach Dropbox (${e.message})</div>`;
  }
}

// ---- player -------------------------------------------------------------
let shots = [], cur = -1;
const isAttempt = s => !s.action || s.action === "stroke" || s.action === "break";

async function openSession(s) {
  curSession = s.name;
  $("sessions").style.display = "none";
  document.querySelector("header").style.display = "none";
  $("update").style.display = "none";
  $("player").classList.add("open");
  $("title").textContent = fmtDate(s.name, s.modified);
  shots = []; cur = -1;
  $("chips").innerHTML = "";
  updateInfo();
  try {
    const [linkD, shotsD] = await Promise.all([
      api("/api/link?name=" + encodeURIComponent(s.name)),
      s.analyzed ? api("/api/shots?name=" + encodeURIComponent(s.name))
                 : Promise.resolve({ shots: [] }),
    ]);
    $("video").src = linkD.link;
    shots = shotsD.shots || [];
    // verdicts saved from THIS phone survive the summary round-trip lag:
    // overlay them until the server copy carries the corrected flag
    try {
      const ov = JSON.parse(localStorage.getItem("verdicts") || "{}");
      let dirty = false;
      shots.forEach(s => {
        const k = curSession + "@" + s.start;
        if (ov[k]) {
          if (s.corrected) { delete ov[k]; dirty = true; }
          else Object.assign(s, ov[k]);
        }
      });
      if (dirty) localStorage.setItem("verdicts", JSON.stringify(ov));
    } catch (e) { /* overlay is best-effort */ }
    buildChips();
    buildLane();
    updateInfo();
    // start at the FIRST clip and AUTO-PLAY (Joe). iOS may veto an
    // unmuted programmatic play outside a gesture — then the ▶ glyph
    // shows and one tap starts it.
    if (shots.length) gotoShot(0, true);
    else $("video").play().catch(() => {});
  } catch (e) {
    $("shot-oc").textContent = "Load failed: " + e.message;
  }
}
$("back").onclick = () => {
  $("video").pause(); $("video").removeAttribute("src"); $("video").load();
  $("player").classList.remove("open");
  document.querySelector("header").style.display = "flex";
  $("sessions").style.display = "block";
  checkUpdate();
};

function buildChips() {
  const c = $("chips");
  c.innerHTML = "";
  shots.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = (isAttempt(s)
      ? "chip " + (s.outcome || "miss")
      : "chip inhand")
      + (s.corrected ? " fixed" : s.reviewed ? " seen" : "");
    el.textContent = isAttempt(s)
      ? (s.action === "break" ? "BRK" : i + 1)
      : (s.action === "rearrange" ? "⇄" : "✋");
    el.onclick = () => gotoShot(i, true);
    c.appendChild(el);
  });
}
function gotoShot(i, play) {
  if (i < 0 || i >= shots.length) return;
  cur = i;
  const v = $("video");
  v.currentTime = Math.max(0, shots[i].start - PRE_ROLL);
  if (play) v.play().catch(() => {});
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}
$("prev").onclick = () => gotoShot(Math.max(0, cur - 1), true);
$("next").onclick = () => gotoShot(Math.min(shots.length - 1, cur + 1), true);

function fmt(t) {
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
}
function updateInfo() {
  const cs = shots[cur];
  $("correct").textContent = (cs && cs.corrected)
    ? "🛈 Details · corrected"
    : (cs && cs.reviewed) ? "🛈 Details · reviewed ✓" : "🛈 Details";
  [...$("chips").children].forEach((el, i) => el.classList.toggle("cur", i === cur));
  if (cur < 0 || !shots[cur]) {
    $("shot-n").textContent = shots.length ? `${shots.length} shots` : "–";
    $("shot-oc").textContent = ""; $("shot-t").textContent = "";
    return;
  }
  const s = shots[cur];
  $("shot-n").textContent = `Shot ${cur + 1}/${shots.length}`;
  const act = s.action || "stroke";
  const label = act === "ball_in_hand" ? "BALL IN HAND"
              : act === "rearrange" ? "REARRANGING"
              : act === "nothing" ? "—"
              : act === "break" ? "BREAK · " + (s.outcome || "").toUpperCase()
              : (s.outcome || "").toUpperCase();
  $("shot-oc").textContent = label + (s.corrected ? " ✓" : "");
  $("shot-oc").style.color = s.outcome === "make" ? "var(--make)"
                           : s.outcome === "scratch" ? "var(--scratch)"
                           : "var(--dim)";
  $("shot-t").textContent = `${fmt(s.start)} · ${(s.end - s.start).toFixed(1)}s`;
  // balls in play (stat/debug): trail participants, cue first
  const box = $("inline");
  box.innerHTML = "";
  const nums = (s.trails || []).map(tr => tr.n)
    .sort((a, b) => (a === 0 ? -1 : b === 0 ? 1 : a - b));
  nums.forEach(n => {
    const b = document.createElement("div");
    b.className = "ball";
    b.style.background = n >= 0 ? (BALL_COL[n] || "#9AA4B2") : "#4A5563";
    b.textContent = n > 0 ? n : (n === 0 ? "" : "?");
    box.appendChild(b);
  });
  const frag = document.createElement("span");
  frag.className = "frag";
  // skip the bare opener ("Stroke") — show the first INFORMATIVE clause
  const clauses = (s.text || "").split(";").map(c => c.trim());
  frag.textContent = clauses.length > 1 ? clauses[1] : clauses[0] || "";
  box.appendChild(frag);
}

// ---- SHOT-scoped scrub lane (Joe: whole-session scale was unusable) ----
// The lane covers just the current shot: routine lead-in -> settled,
// plus a 1s tail. Scrubbing works within that window; < > moves between
// shots; the mode button picks what happens at the end of the shot:
//   ⟳  loop this shot          ▸▸  roll into the next shot (CD style)
let win = null;                       // {t0, t1} of the visible window
let mode = localStorage.getItem("mode") || "cd";   // "cd" | "loop"

function modeLabel() {
  // a TOGGLE, not an action: engaged = this shot repeats until you move
  const on = mode === "loop";
  $("mode").style.color = on ? "var(--make)" : "var(--dim)";
  $("mode").style.borderColor = on ? "var(--make)" : "var(--line)";
}
$("mode").onclick = () => {
  mode = mode === "loop" ? "cd" : "loop";
  localStorage.setItem("mode", mode);
  modeLabel();
};

function buildLane() {
  const lane = $("lane");
  [...lane.querySelectorAll(".region")].forEach(el => el.remove());
  if (cur < 0 || !shots[cur]) { win = null; return; }
  const s = shots[cur];
  const t0 = Math.max(0, s.start - PRE_ROLL);
  const t1 = Math.max(s.end, s.start + 0.5) + 1.0;
  win = { t0, t1 };
  const span = t1 - t0;
  const lead = document.createElement("div");
  lead.className = "region lead "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  lead.style.left = "0%";
  lead.style.width = (100 * (s.start - t0) / span) + "%";
  lane.appendChild(lead);
  const body = document.createElement("div");
  body.className = "region "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  body.style.left = (100 * (s.start - t0) / span) + "%";
  body.style.width =
    (100 * (Math.max(s.end, s.start + 0.5) - s.start) / span) + "%";
  lane.appendChild(body);
}

// Advance WITHOUT seeking — used when the next shot's window adjoins the
// current one, so playback rolls straight through (Joe: "no time jumps
// if one clip plays into the next"). Only real dead time gets skipped.
function advanceSeamless(i) {
  cur = i;
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}

// ---- animated ball trails (Joe: "the animated tails") ------------------
// Per-shot polylines arrive pre-mapped to normalized video coords in
// shots.json; the canvas just draws the last few seconds with a fade.
const BALL_COL = { 0: "#F2F2F2", 1: "#F5D90A", 2: "#2F81F7", 3: "#E5484D",
                   4: "#8250DF", 5: "#F79009", 6: "#3FB950", 7: "#A40E26",
                   8: "#B9BBBE", 9: "#F5D90A" };
const TRAIL_TAIL_S = 4.0;
function drawTrails() {
  const cv = $("trails"), v = $("video");
  const s = shots[cur];
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(box.width * dpr)
      || cv.height !== Math.round(box.height * dpr)) {
    cv.width = Math.round(box.width * dpr);
    cv.height = Math.round(box.height * dpr);
  }
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!s || !s.trails || !v.videoWidth) return;
  const scale = Math.min(box.width / v.videoWidth,
                         box.height / v.videoHeight);
  const cw = v.videoWidth * scale, ch = v.videoHeight * scale;
  const ox = (box.width - cw) / 2, oy = (box.height - ch) / 2;
  const t = v.currentTime;
  ctx.lineWidth = 3 * dpr;
  ctx.lineJoin = ctx.lineCap = "round";
  s.trails.forEach(tr => {
    const pts = tr.p.filter(p => p[0] <= t && p[0] >= t - TRAIL_TAIL_S);
    if (pts.length < 2) return;
    const col = BALL_COL[tr.n] || "#9AA4B2";
    for (let i = 1; i < pts.length; i++) {
      const age = (t - pts[i][0]) / TRAIL_TAIL_S;
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.85 * (1 - age);
      ctx.beginPath();
      ctx.moveTo((ox + pts[i - 1][1] * cw) * dpr,
                 (oy + pts[i - 1][2] * ch) * dpr);
      ctx.lineTo((ox + pts[i][1] * cw) * dpr,
                 (oy + pts[i][2] * ch) * dpr);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

// A render loop, not timeupdate: iOS fires timeupdate ~4x/s and the
// playhead visibly stepped (Joe). rAF moves it every frame.
(function tick() {
  requestAnimationFrame(tick);
  const v = $("video");
  if (!$("player").classList.contains("open")) return;
  // trails paused per Joe ("I don't want the animated trails on here
  // yet") — data still exports; flip TRAILS_ON to re-enable
  if (window.TRAILS_ON) drawTrails();
  else { const c = $("trails");
         c.getContext("2d").clearRect(0, 0, c.width, c.height); }
  Draw.render();
  if (win) {
    // while the thumb owns the playhead, the video's lagging seek time
    // must NOT fight it (Joe: "still sticky when I drag") — the drag
    // handler positions the playhead; this loop yields until release
    if (!window.scrubActive) {
      const frac = (v.currentTime - win.t0) / (win.t1 - win.t0);
      $("playhead").style.left = (100 * Math.min(1, Math.max(0, frac))) + "%";
    }
    // in the dead time BETWEEN clips the lane owns no time: pulse the
    // playhead and count down to the next shot (Joe: "video is playing
    // but the playhead isn't moving — time isn't accounted for")
    const inGap = !v.paused && v.currentTime < win.t0 - 0.25;
    $("playhead").classList.toggle("waiting", inGap);
    if (inGap) {
      const s = Math.ceil(win.t0 - v.currentTime);
      $("shot-t").textContent = `next shot in ${s}s`;
    } else if ($("shot-t").textContent.startsWith("next shot")) {
      updateInfo();
    }
  }
  if (win && !v.paused && cur >= 0 && v.currentTime >= win.t1 - 0.05) {
    if (mode === "loop") {
      v.currentTime = win.t0;
    } else if (cur < shots.length - 1) {
      // PURE continuity (Joe: "all clips run seamlessly into each other,
      // down to the frame... watch the thing in its entirety"): never
      // seek — playback rolls straight through, the clip indicator and
      // lane just follow. Skipping is what the › button is for.
      advanceSeamless(cur + 1);
    }
    // last clip: keep rolling to the end of the video, no pause
  }
})();
// Latest-wins seek chaining: firing currentTime on every pointermove
// queues seeks inside the decoder and the picture lags the thumb by
// seconds. Issue ONE seek at a time; when it lands, jump straight to
// wherever the thumb is NOW (Joe: "more frame resolution... really
// look closely at frame timing").
let seekBusy = false, seekPending = null, seekFastMode = false;
function requestSeek(t, fast) {
  const v = $("video");
  if (seekBusy) { seekPending = t; return; }
  seekBusy = true;
  seekFastMode = !!fast;
  // fastSeek (Safari) lands on the nearest keyframe in a fraction of a
  // precise seek's time — right for live thumb-dragging; the release
  // handler issues one precise seek for exact frame inspection
  if (fast && v.fastSeek) v.fastSeek(t); else v.currentTime = t;
}
$("video").addEventListener("seeked", () => {
  const v = $("video");
  if (seekPending != null) {
    const t = seekPending;
    seekPending = null;
    if (seekFastMode && v.fastSeek) v.fastSeek(t); else v.currentTime = t;
  } else {
    seekBusy = false;
  }
});

(() => {
  const lane = $("lane");
  let scrubbing = false, wasPlaying = false, lastT = null;
  const FPS = 30;                        // recording cadence (~29.996)
  let drawSeq = 0;
  const seekTo = ev => {
    if (!win) return;
    const r = lane.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    // PRECISE seeks quantized to frame boundaries. fastSeek felt fast
    // but lands on KEYFRAMES 1-2s apart — the picture skipped whole
    // seconds (Joe: "very jumpy, can't thumb scroll frame by frame").
    // Quantizing dedupes sub-frame drag events so the latest-wins chain
    // spends its budget only on frames that actually differ.
    lastT = Math.round((win.t0 + frac * (win.t1 - win.t0)) * FPS) / FPS;
    $("playhead").style.left = (100 * frac) + "%";
    // cache first: a harvested frame draws instantly with NO seek at
    // all; only gaps hit the decoder (and self-heal once harvested)
    const seq = ++drawSeq;
    FrameCache.draw(lastT).then(hit => {
      if (seq !== drawSeq) return;       // a newer thumb position won
      if (!hit) requestSeek(lastT, false);
    });
  };
  lane.addEventListener("pointerdown", ev => {
    scrubbing = true;
    window.scrubActive = true;           // rAF loop hands the playhead over
    wasPlaying = !$("video").paused;
    $("video").pause();          // decoder devotes itself to scrub frames
    lane.setPointerCapture(ev.pointerId);
    seekTo(ev);
  });
  lane.addEventListener("pointermove", ev => { if (scrubbing) seekTo(ev); });
  const end = () => {
    if (!scrubbing) return;
    scrubbing = false;
    window.scrubActive = false;
    drawSeq++;                                     // cancel in-flight draws
    if (lastT != null) {
      requestSeek(lastT, false);                   // one precise landing
      // keep the cached frame up until the REAL video catches up, so
      // release never flashes a stale frame
      const v = $("video");
      const off = () => { FrameCache.hide(); v.removeEventListener("seeked", off); };
      v.addEventListener("seeked", off);
      setTimeout(off, 700);                        // belt and suspenders
    } else {
      FrameCache.hide();
    }
    if (wasPlaying) $("video").play();
  };
  lane.addEventListener("pointerup", end);
  lane.addEventListener("pointercancel", end);
})();

// ---- FRAME CACHE (Joe: "scrub really slowly or the video does not
// follow"): iOS precise seeks into long-keyframe video have a ~100-
// 300ms floor — no seek strategy can glide. So HARVEST every frame the
// video actually presents (requestVideoFrameCallback fires on playback
// AND on landed seeks) into JPEG blobs, and let the thumb draw straight
// from memory on a canvas over the video. After one viewing of a clip,
// scrubbing it is instant; gaps fall back to seeking and self-heal as
// the seeks land and get harvested too.
const FrameCache = (() => {
  const FPS = 30, CAP = 700;              // ~23s of unique frames
  let blobs = new Map(), bitmaps = new Map(), lastSrc = "";
  const idx = t => Math.round(t * FPS);
  const cap0 = document.createElement("canvas");
  function harvest(now, meta) {
    const v = $("video");
    v.requestVideoFrameCallback(harvest);
    if (v.currentSrc !== lastSrc) {       // new session video: reset
      lastSrc = v.currentSrc;
      blobs = new Map(); bitmaps = new Map();
    }
    const i = idx(meta.mediaTime);
    if (blobs.has(i) || !v.videoWidth) return;
    const scale = Math.min(1, 720 / v.videoHeight);
    cap0.width = Math.round(v.videoWidth * scale);
    cap0.height = Math.round(v.videoHeight * scale);
    cap0.getContext("2d").drawImage(v, 0, 0, cap0.width, cap0.height);
    cap0.toBlob(b => {
      if (!b) return;
      blobs.set(i, b);
      if (blobs.size > CAP) {             // evict farthest from playhead
        const cur = idx($("video").currentTime);
        let far = -1, fd = -1;
        for (const k of blobs.keys()) {
          const d = Math.abs(k - cur);
          if (d > fd) { fd = d; far = k; }
        }
        blobs.delete(far); bitmaps.delete(far);
      }
    }, "image/jpeg", 0.7);
  }
  if ("requestVideoFrameCallback" in HTMLVideoElement.prototype)
    $("video").requestVideoFrameCallback(harvest);
  async function draw(t) {                // true = drawn from cache
    const v = $("video");
    let i = idx(t), hit = null;
    for (let d = 0; d <= 2 && hit == null; d++)   // tolerate tiny gaps
      hit = blobs.has(i + d) ? i + d : blobs.has(i - d) ? i - d : null;
    if (hit == null) return false;
    let bm = bitmaps.get(hit);
    if (!bm) {
      bm = await createImageBitmap(blobs.get(hit));
      bitmaps.set(hit, bm);
      if (bitmaps.size > 90) {            // decoded LRU stays small
        const first = bitmaps.keys().next().value;
        if (first !== hit) { bitmaps.get(first).close(); bitmaps.delete(first); }
      }
    }
    const cv = $("scrubcv"), box = v.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(box.width * dpr);
    cv.height = Math.round(box.height * dpr);
    // contain-fit exactly like the <video> renders itself
    const s = Math.min(cv.width / bm.width, cv.height / bm.height);
    const dw = bm.width * s, dh = bm.height * s;
    cv.getContext("2d").drawImage(bm, (cv.width - dw) / 2,
                                  (cv.height - dh) / 2, dw, dh);
    cv.style.display = "block";
    return true;
  }
  return { draw, hide: () => { $("scrubcv").style.display = "none"; } };
})();

// ---- DRAWING SUITE (Joe: "straight lines that can be drawn and moved
// around, persistent across frames of a shot... maybe a protractor").
// Objects live in coordinates NORMALIZED to the video's content box, so
// they stay pinned to the table through resizes and across every frame
// of the shot. Saved per session+shot on this device.
const Draw = (() => {
  let objs = [], sel = -1, show = true, loadedKey = "";
  const cv = $("drawcv");
  const key = () => `draw:${typeof curSession !== "undefined" ? curSession : ""}:${cur}`;
  const save = () => { try { localStorage.setItem(key(), JSON.stringify(objs)); } catch (e) {} };
  const load = () => {
    loadedKey = key();
    sel = -1;
    try { objs = JSON.parse(localStorage.getItem(loadedKey) || "[]"); }
    catch (e) { objs = []; }
    syncUI();
  };
  function box() {                       // video CONTENT rect in canvas px
    const v = $("video"), r = v.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    if (!v.videoWidth) return { ox: 0, oy: 0, w: cv.width, h: cv.height };
    const s = Math.min(cv.width / v.videoWidth, cv.height / v.videoHeight);
    const w = v.videoWidth * s, h = v.videoHeight * s;
    return { ox: (cv.width - w) / 2, oy: (cv.height - h) / 2, w, h };
  }
  const toPx = (b, p) => [b.ox + p[0] * b.w, b.oy + p[1] * b.h];
  const toN = (b, x, y) => [(x - b.ox) / b.w, (y - b.oy) / b.h];
  function render() {
    if (loadedKey !== key()) load();
    const g = cv.getContext("2d");
    const b = box();
    g.clearRect(0, 0, cv.width, cv.height);
    cv.style.pointerEvents = (show && objs.length) ? "auto" : "none";
    if (!show) return;
    const dpr = window.devicePixelRatio || 1;
    objs.forEach((o, i) => {
      const P = o.pts.map(p => toPx(b, p));
      const col = o.color || "#7DF29B";
      const alpha = o.alpha != null ? o.alpha : 0.55;
      const lw = (o.w || 1.8) * dpr;
      const tracer = (a, c) => {
        g.lineCap = "round";
        g.globalAlpha = alpha * 0.5;
        g.strokeStyle = "#0A190C"; g.lineWidth = lw + 2.6 * dpr;
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(c[0], c[1]); g.stroke();
        g.globalAlpha = alpha;
        g.strokeStyle = col; g.lineWidth = lw;
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(c[0], c[1]); g.stroke();
        g.globalAlpha = 1;
      };
      if (o.type === "line") tracer(P[0], P[1]);
      else {                              // protractor: vertex + two rays
        tracer(P[0], P[1]); tracer(P[0], P[2]);
        const a1 = Math.atan2(P[1][1] - P[0][1], P[1][0] - P[0][0]);
        const a2 = Math.atan2(P[2][1] - P[0][1], P[2][0] - P[0][0]);
        let d = Math.abs(a2 - a1) * 180 / Math.PI;
        if (d > 180) d = 360 - d;
        const rr = 34 * dpr;
        g.globalAlpha = alpha;
        g.strokeStyle = col; g.lineWidth = 1.2 * dpr;
        g.beginPath(); g.arc(P[0][0], P[0][1], rr, Math.min(a1, a2), Math.max(a1, a2));
        g.stroke();
        g.globalAlpha = 1;
        const mid = (a1 + a2) / 2, lx = P[0][0] + Math.cos(mid) * (rr + 16 * dpr),
              ly = P[0][1] + Math.sin(mid) * (rr + 16 * dpr);
        const label = d.toFixed(1) + "°";
        g.font = `${12 * dpr}px -apple-system, sans-serif`;
        const tw = g.measureText(label).width;
        g.fillStyle = "rgba(13,17,23,.82)";
        g.fillRect(lx - tw / 2 - 5 * dpr, ly - 9 * dpr, tw + 10 * dpr, 18 * dpr);
        g.fillStyle = "#EAF2EA";
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(label, lx, ly);
      }
      if (i === sel) {
        P.forEach(p => {
          g.fillStyle = "rgba(255,213,74,.28)";
          g.beginPath(); g.arc(p[0], p[1], 14 * dpr, 0, 7); g.fill();
          g.fillStyle = "#FFD54A";
          g.beginPath(); g.arc(p[0], p[1], 4 * dpr, 0, 7); g.fill();
        });
      }
    });
  }
  // ---- touch: drag handles, drag bodies, tap-through to play toggle
  let drag = null;                       // {obj, pt|-1 (=whole), lx, ly}
  const near = (x, y, p, r) => (x - p[0]) ** 2 + (y - p[1]) ** 2 <= r * r;
  const segDist = (x, y, a, c) => {
    const dx = c[0] - a[0], dy = c[1] - a[1];
    const L2 = dx * dx + dy * dy || 1e-6;
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / L2));
    return Math.hypot(x - (a[0] + t * dx), y - (a[1] + t * dy));
  };
  cv.addEventListener("pointerdown", ev => {
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * dpr, y = (ev.clientY - r.top) * dpr;
    const b = box();
    const HR = 22 * dpr;
    // selected object's handles win first
    if (sel >= 0) {
      const P = objs[sel].pts.map(p => toPx(b, p));
      for (let k = 0; k < P.length; k++) {
        if (near(x, y, P[k], HR)) {
          drag = { obj: sel, pt: k }; cv.setPointerCapture(ev.pointerId); return;
        }
      }
    }
    for (let i = objs.length - 1; i >= 0; i--) {
      const P = objs[i].pts.map(p => toPx(b, p));
      const hit = objs[i].type === "line"
        ? segDist(x, y, P[0], P[1]) < HR
        : (segDist(x, y, P[0], P[1]) < HR || segDist(x, y, P[0], P[2]) < HR);
      if (hit) {
        sel = i; syncUI();
        drag = { obj: i, pt: -1, lx: x, ly: y };
        cv.setPointerCapture(ev.pointerId);
        return;
      }
    }
    if (sel >= 0) { sel = -1; syncUI(); }   // tap-away deselects...
    else togglePlay();                       // ...or acts like the video
  });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * dpr, y = (ev.clientY - r.top) * dpr;
    const b = box(), o = objs[drag.obj];
    if (drag.pt >= 0) {
      o.pts[drag.pt] = toN(b, x, y);
    } else {
      const dxn = (x - drag.lx) / b.w, dyn = (y - drag.ly) / b.h;
      o.pts = o.pts.map(p => [p[0] + dxn, p[1] + dyn]);
      drag.lx = x; drag.ly = y;
    }
  });
  const endDrag = () => { if (drag) { drag = null; save(); } };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  const COLORS = ["#7DF29B", "#FFD54A", "#FF6B6B", "#6BD5FF", "#F2F6FA"];
  const WIDTHS = [1.2, 1.8, 3.0];
  const WIDTH_GLYPH = { 1.2: "─", 1.8: "──", 3.0: "━━" };
  function add(type) {
    const o = type === "line"
      ? { type: "line", pts: [[0.3, 0.45], [0.7, 0.45]] }
      : { type: "angle", pts: [[0.5, 0.5], [0.28, 0.36], [0.72, 0.36]] };
    o.color = COLORS[0]; o.alpha = 0.55; o.w = 1.8;
    objs.push(o); sel = objs.length - 1; save(); syncUI();
  }
  // per-object style strip (Joe: "a mini digital media suite")
  COLORS.forEach(c => {
    const d = document.createElement("button");
    d.style.cssText = `width:26px;height:26px;border-radius:50%;padding:0;
      border:2px solid #2A323D;background:${c}`;
    d.onclick = () => {
      if (sel >= 0) { objs[sel].color = c; save(); syncUI(); }
    };
    $("dt-colors").appendChild(d);
  });
  $("dt-w").onclick = () => {
    if (sel < 0) return;
    const o = objs[sel];
    o.w = WIDTHS[(WIDTHS.indexOf(o.w || 1.8) + 1) % WIDTHS.length];
    save(); syncUI();
  };
  $("dt-a").addEventListener("input", () => {
    if (sel >= 0) { objs[sel].alpha = $("dt-a").value / 100; save(); }
  });
  $("dt-del").onclick = () => {
    if (sel >= 0) { objs.splice(sel, 1); sel = -1; save(); syncUI(); }
  };
  function syncUI() {
    $("d-del").disabled = sel < 0;
    $("d-show").textContent = show ? "👁 Shown" : "👁 Hidden";
    const t = $("dtools");
    t.style.display = sel >= 0 ? "flex" : "none";
    if (sel >= 0) {
      const o = objs[sel];
      $("dt-w").textContent = WIDTH_GLYPH[o.w || 1.8] || "──";
      $("dt-a").value = Math.round((o.alpha != null ? o.alpha : 0.55) * 100);
    }
  }
  return {
    render, add,
    toggleShow: () => { show = !show; syncUI(); },
    removeSel: () => { if (sel >= 0) { objs.splice(sel, 1); sel = -1; save(); syncUI(); } },
    clear: () => { objs = []; sel = -1; save(); syncUI(); },
  };
})();
$("ovbtn").onclick = ev => {
  ev.stopPropagation();
  const m = $("ovmenu");
  m.style.display = m.style.display === "none" ? "block" : "none";
};
$("ov-close").onclick = () => { $("ovmenu").style.display = "none"; };
// tapping anywhere outside the menu dismisses it too
document.addEventListener("pointerdown", ev => {
  const m = $("ovmenu");
  if (m.style.display !== "none" && !m.contains(ev.target)
      && ev.target !== $("ovbtn")) {
    m.style.display = "none";
  }
}, true);
$("d-line").onclick = () => { Draw.add("line"); $("ovmenu").style.display = "none"; };
$("d-angle").onclick = () => { Draw.add("angle"); $("ovmenu").style.display = "none"; };
$("d-show").onclick = () => Draw.toggleShow();
$("d-del").onclick = () => Draw.removeSel();
$("d-clear").onclick = () => Draw.clear();

// ---- frame stepping (Joe: "thumb scroll frame by frame"): single-
// frame nudges with precise seeks; pauses playback so the frame holds.
(() => {
  const step = dir => {
    const v = $("video");
    v.pause();
    requestSeek(Math.max(0, v.currentTime + dir / 30), false);
  };
  $("fprev").onclick = () => step(-1);
  $("fnext").onclick = () => step(1);
})();

// ---- slow motion (Joe): ONE button on the transport line, tap to
// cycle 1x -> 1/2x -> 1/4x -> 1x. iOS resets rate on new media, so
// reapply on every play.
const RATES = [1, 0.5, 0.25];
const RATE_LABEL = { 1: "1×", 0.5: "½×", 0.25: "¼×" };
let rate = parseFloat(localStorage.getItem("rate") || "1") || 1;
if (!RATES.includes(rate)) rate = 1;
function applyRate() {
  $("video").playbackRate = rate;
  $("rate").textContent = RATE_LABEL[rate];
  $("rate").classList.toggle("on", rate !== 1);
}
$("rate").onclick = () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  localStorage.setItem("rate", rate);
  applyRate();
};
$("video").addEventListener("play", applyRate);
applyRate();
modeLabel();



// no native controls: video tap and the ⏯ button both toggle
function togglePlay() {
  const v = $("video");
  if (v.paused) v.play(); else v.pause();
}
$("video").addEventListener("click", togglePlay);
$("play").onclick = togglePlay;
$("video").addEventListener("pause", () => {
  $("vwrap").classList.add("paused");
  $("play").textContent = "▶";
});
$("video").addEventListener("play", () => {
  $("vwrap").classList.remove("paused");
  $("play").textContent = "❚❚";
});
// loading state: spinner whenever the pipe is actually stalling
const _vw = $("vwrap");
$("video").addEventListener("waiting", () => _vw.classList.add("loading"));
$("video").addEventListener("loadstart", () => _vw.classList.add("loading"));
["canplay", "playing", "seeked"].forEach(ev =>
  $("video").addEventListener(ev, () => _vw.classList.remove("loading")));

// ---- "Correct this clip" (Joe: human intervention) ---------------------
let curSession = null;
let pending = {};
let target = null;    // the clip being corrected, FROZEN at sheet-open —
                      // playback keeps rolling and cur keeps advancing,
                      // which used to save the verdict to the wrong clip
let prevMode = null;  // mode to restore when Details closes
function setSheet(open) {
  $("sheet").style.display = open ? "block" : "none";
  $("nav").style.display = open ? "none" : "flex";
  $("lower").style.display = open ? "none" : "block";
  if (!open) {
    target = null;
    if (prevMode !== null) {    // Details borrowed loop mode; hand it back
      mode = prevMode;
      prevMode = null;
      modeLabel();
    }
  }
}
$("correct").onclick = () => {
  pending = {};
  target = shots[cur] || null;
  if (!target) return;
  const no = shots.indexOf(target) + 1;
  // Details LOOPS the clip under judgment; the previous mode returns on
  // close (Joe). Snap playback onto the clip if it has rolled past.
  prevMode = mode;
  mode = "loop";
  modeLabel();
  if (cur !== no - 1) gotoShot(no - 1, !$("video").paused);
  $("sh-desc").textContent =
    `Shot ${no}: ${target.text || "(no description)"}`;
  $("sh-note").value = target.note || "";
  $("sh-clear").style.display =
    (target.corrected || target.reviewed) ? "block" : "none";
  setSheet(true);
  syncSheet();
};
$("sh-cancel").onclick = () => setSheet(false);
function syncSheet() {
  const s = target || {};
  const o = pending.outcome || s.outcome;
  const a = pending.action || s.action || "stroke";
  [...$("sh-outcome").children].forEach(b =>
    b.classList.toggle("sel", b.dataset.o === o));
  [...$("sh-action").children].forEach(b =>
    b.classList.toggle("sel", b.dataset.a === a));
}
[...$("sh-outcome").children].forEach(b =>
  b.onclick = () => { pending.outcome = b.dataset.o; syncSheet(); });
[...$("sh-action").children].forEach(b =>
  b.onclick = () => { pending.action = b.dataset.a; syncSheet(); });
async function postVerdict(s, body, optimistic) {
  Object.assign(s, optimistic);
  try {   // survive refetch until the server copy reflects it
    const ov = JSON.parse(localStorage.getItem("verdicts") || "{}");
    const k = curSession + "@" + s.start;
    if (body.clear) delete ov[k]; else ov[k] = optimistic;
    localStorage.setItem("verdicts", JSON.stringify(ov));
  } catch (e) { /* best-effort */ }
  setSheet(false);
  buildChips(); buildLane(); updateInfo();
  try {
    const r = await fetch("/api/correct", {
      method: "POST",
      headers: { "x-key": KEY || "", "Content-Type": "application/json" },
      body: JSON.stringify({ session: curSession, start: s.start, ...body }),
    });
    if (!r.ok) throw new Error(r.status);
    $("correct").textContent = "✓ saved — syncs to the PC via Dropbox";
  } catch (e) {
    $("correct").textContent = "⚠ save failed — try again";
  }
  setTimeout(updateInfo, 2500);
}
$("sh-save").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  const note = $("sh-note").value.trim();
  const patch = { ...pending };
  if (note && note !== (s.note || "")) patch.note = note;
  if (!patch.outcome && !patch.action && !patch.note) return setSheet(false);
  postVerdict(s, patch, { ...patch, corrected: true });
};
$("sh-confirm").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  postVerdict(s, { confirm: true }, { reviewed: true });
};
$("sh-clear").onclick = () => {
  const s = target;
  if (!s || !curSession) return setSheet(false);
  postVerdict(s, { clear: true },
              { corrected: false, reviewed: false, note: "" });
};

// keep "current shot" synced while playing
setInterval(() => {
  if (!$("player").classList.contains("open") || !shots.length) return;
  const t = $("video").currentTime;
  if (win && t >= win.t0 && t <= win.t1) return;   // inside the window: stay
  const i = shots.findIndex(s => t >= s.start - PRE_ROLL && t <= s.end + 0.5);
  if (i >= 0 && i !== cur) { cur = i; buildLane(); updateInfo(); }
}, 800);

loadSessions();
</script>
</body>
</html>
