<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Billiards Review</title>
<style>
  :root { --bg:#0B0F14; --panel:#12161D; --line:#1D2530; --text:#E6EDF3;
          --dim:#7D8590; --faint:#3E4A5A; --make:#3FB950; --scratch:#E3B341;
          --accent:#58A6FF; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      /* app, not a web page (Joe): no text selection, no long-press
         callouts on the video, no double-tap zoom */
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none; }
  body { touch-action:manipulation; }
  /* the video area owns ALL its gestures: without this, iOS treats
     two-finger and drag input over the <video> as PAGE gestures — pinch-
     out got stolen and pans scrolled the page (Joe) */
  #vwrap, #vwrap video, #vwrap canvas { touch-action:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,
         "Segoe UI", sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:baseline; gap:10px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  /* floating pill BELOW the island — as a top bar it hid behind the
     clock (Joe's screenshot) */
  #update { display:none; position:fixed; z-index:20;
            top:calc(env(safe-area-inset-top) + 8px);
            left:16px; right:16px; padding:12px 16px;
            background:#122c1a; border:1px solid var(--make);
            border-radius:6px; color:var(--make); font-weight:600;
            text-align:center; }
  #keygate { padding:40px 24px; text-align:center; color:var(--dim);
             display:none; }
  #sessions { padding:8px 0; }
  .acc { display:flex; align-items:center; gap:10px; padding:16px 16px 10px;
         font-size:17px; font-weight:700; }
  .acc .ch { color:var(--dim); transition:transform .15s;
             display:inline-block; }
  .acc.open .ch { transform:rotate(90deg); }
  .acc .cnt { margin-left:auto; color:var(--faint); font-size:13px;
              font-weight:600; }
  .indent { padding-left:10px; }
  .swipe { position:relative; overflow:hidden; touch-action:pan-y; }
  .swipe .swdel { position:absolute; right:0; top:0; bottom:0; width:80px;
                  background:#D64545; color:#fff; border:none;
                  font-weight:700; font-size:14px; }
  .swipe .sess { position:relative; background:var(--bg); }
  .sess.new { color:var(--accent); font-weight:600; display:block; }
  .sess { display:grid; grid-template-columns: 1fr 64px 56px;
          gap:10px; padding:12px 16px; align-items:baseline;
          border-bottom:1px solid var(--line); }
  .sess:active { background:var(--panel); }
  .sess .d { font-weight:600; }
  .sess .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sess .dim { color:var(--dim); }
  .sess.stub .d, .sess.stub .num { color:var(--faint); font-weight:400; }
  .sess.head { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .sess.head span { color:var(--dim); font-size:11px; font-weight:600;
                    letter-spacing:.8px; }
  /* the player is a fixed-height column: video flexes to absorb what
     remains after the control stack, so every button fits on screen
     with zero scrolling (Joe) */
  #player { display:none; flex-direction:column; height:100dvh;
            overflow:hidden; }
  #player.open { display:flex; }
  #topbar { display:flex; align-items:center; gap:12px;
            padding:calc(8px + env(safe-area-inset-top)) 16px 8px; }
  #back { color:var(--accent); font-weight:600; background:none; border:none;
          font-size:15px; }
  #title { color:var(--dim); font-size:13px; margin-left:auto; }
  video { width:100%; height:100%; background:#000; display:block;
          object-fit:contain; }
  /* native controls are gone (Joe): tap the video to play/pause; a quiet
     glyph marks the paused state */
  #paused-glyph { position:absolute; inset:0; display:none;
                  align-items:center; justify-content:center;
                  font-size:44px; color:rgba(230,237,243,.55);
                  pointer-events:none; }
  /* show briefly on pause, then fade away (Joe: it blocks the frame
     he paused to study). Re-pausing restarts the animation. */
  #vwrap.paused #paused-glyph { display:flex;
      animation: glyphfade 2.2s ease forwards; }
  @keyframes glyphfade { 0%,55% { opacity:1; } 100% { opacity:0; } }
  #spinner { position:absolute; inset:0; display:none;
             align-items:center; justify-content:center;
             pointer-events:none; }
  #vwrap.loading #spinner { display:flex; }
  #vwrap.loading #paused-glyph { display:none; }
  #trails { position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; }
  #sh-cut button.on, #sh-miss button.on { color:var(--accent);
      border-color:var(--accent); font-weight:800; }
  #statsheet table { width:100%; border-collapse:collapse; margin-top:8px; }
  #statsheet th, #statsheet td { padding:8px 10px; text-align:center;
      border-bottom:1px solid #232B36; font-variant-numeric:tabular-nums; }
  #statsheet th { color:var(--dim); font-size:12px; font-weight:600; }
  #statsheet td.big { font-weight:800; font-size:16px; }
  .newsbar { display:flex; align-items:center; gap:4px; margin:10px 12px;
             padding:11px 14px; background:var(--panel,#12161C);
             border:1px solid #2A323D; border-radius:12px; cursor:pointer; }
  /* Legend is HUD, not overlay: it lives outside #vrot so it stays
     upright and bottom-left no matter how the video is rotated. */
  #vwrap.rot #vrot { transform: rotate(180deg); }
  /* draggable (Joe: "it's blocking my view of the shot"). It takes
     pointer events so it can be grabbed; it is small and the whole point
     is that you can move it off whatever it covers. */
  #legend { position:absolute; left:10px; top:auto; bottom:10px;
            display:none; flex-direction:column; gap:3px; z-index:19;
            font-size:11px; line-height:1.35; cursor:grab;
            touch-action:none; user-select:none; -webkit-user-select:none; }
  #legend.dragging { cursor:grabbing; opacity:.75; }
  #legend div { display:flex; align-items:center; gap:7px; color:#E6EDF3;
                background:rgba(13,17,23,.78); border-radius:5px;
                padding:2px 7px; width:max-content; }
  #legend i { display:block; width:14px; height:3px; border-radius:2px;
              flex:0 0 auto; }
  #spinner div { width:36px; height:36px; border-radius:50%;
                 border:3px solid var(--line);
                 border-top-color:var(--accent);
                 animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #shotbar { padding:8px 16px calc(8px + env(safe-area-inset-bottom));
             flex:0 0 auto; }
  #shotinfo { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  #shotinfo .n { font-size:18px; font-weight:700; }
  #shotinfo .oc { font-weight:700; }
  #shotinfo .t { color:var(--dim); font-size:12px; margin-left:auto; }
  #desc { color:var(--dim); font-size:13px; min-height:1.3em;
          margin-bottom:6px; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; }
  #sheet #sh-desc { font-size:14px; line-height:1.45; color:var(--text);
                    margin-bottom:8px; }
  #nav { display:flex; gap:8px; margin-bottom:8px; }
  #nav #rate.on { color:var(--accent); border-color:var(--accent); }
  #correct { width:100%; height:38px; margin-bottom:8px;
             background:var(--panel); color:var(--dim);
             border:1px solid var(--line); border-radius:4px;
             font-size:14px; font-weight:600; }
  /* ---- overlay bottom sheet (standard iOS pattern: scrim + slide-up
     card with grabber; tool grid like Markup) ---- */
  #ovscrim { display:none; position:fixed; inset:0; z-index:48;
             background:rgba(0,0,0,.45); }
  #ovmenu { display:none; position:fixed; left:0; right:0; bottom:0;
            z-index:49; background:var(--panel);
            border-top:1px solid var(--line);
            border-radius:14px 14px 0 0;
            padding:8px 16px calc(18px + env(safe-area-inset-bottom));
            animation:ovup .22s ease; }
  @keyframes ovup { from { transform:translateY(30%); opacity:.4; }
                    to { transform:none; opacity:1; } }
  #ovmenu .grab { width:36px; height:5px; border-radius:3px;
                  background:var(--faint); margin:4px auto 14px; }
  #ovmenu h3 { font-size:13px; font-weight:600; letter-spacing:.06em;
               color:var(--dim); text-transform:uppercase; margin:14px 0 8px; }
  #ovmenu .lrow { display:flex; align-items:center; width:100%;
                  height:48px; padding:0 4px; background:none; border:none;
                  border-bottom:1px solid var(--line); color:var(--text);
                  font-size:16px; }
  #ovmenu .lrow .chev { margin-left:auto; color:var(--faint); }
  #ovmenu .tools { display:grid; grid-template-columns:repeat(4, 1fr);
                   gap:10px; }
  #ovmenu .tool { display:flex; flex-direction:column; align-items:center;
                  gap:6px; padding:12px 0 10px; background:var(--bg);
                  border:1px solid var(--line); border-radius:12px;
                  color:var(--text); }
  #ovmenu .tool .ic { font-size:22px; line-height:1; }
  #ovmenu .tool .lb { font-size:11px; color:var(--dim); }
  #pl-pick button { display:block; width:100%; height:44px; text-align:left;
                    padding:0 10px; margin-top:6px; background:var(--bg);
                    border:1px solid var(--line); border-radius:10px;
                    color:var(--text); font-size:15px; }
  /* ---- floating style pill (Markup-style) ---- */
  #dtools { display:none; position:absolute; left:50%;
            transform:translateX(-50%); bottom:96px; z-index:39;
            background:rgba(18,22,29,.96); border:1px solid var(--line);
            border-radius:18px; padding:10px 14px;
            flex-direction:column; gap:10px;
            box-shadow:0 6px 24px rgba(0,0,0,.5);
            width:min(360px, calc(100% - 24px)); }
  #dtools .dtrow { display:flex; align-items:center; gap:12px;
                   justify-content:center; width:100%; }
  #dtools .dtrow label { font-size:13px; color:var(--dim); width:18px;
                         text-align:center; }
  #dtools input[type=range] { flex:1; min-width:0; }
  #dtools .sw { width:24px; height:24px; border-radius:50%; padding:0;
                border:2px solid transparent; }
  #dtools .sw.on { border-color:#fff; }
  #dtools input[type=range] { width:84px; }
  #sheet { display:none; }
  #sheet .row { display:flex; gap:6px; margin-bottom:8px; }
  #sheet button { flex:1; height:42px; background:var(--panel);
                  color:var(--dim); border:1px solid var(--line);
                  border-radius:4px; font-size:12px; font-weight:600; }
  #sheet button.sel { color:var(--make); border-color:var(--make); }
  #sheet textarea { width:100%; height:64px; padding:8px 10px;
                    background:var(--panel); color:var(--text);
                    border:1px solid var(--line); border-radius:4px;
                    /* 16px minimum or iOS auto-zooms on focus (Joe) */
                    font:16px/1.4 -apple-system, sans-serif; resize:none;
                    margin-bottom:8px; }
  #sheet #sh-save { color:var(--make); border-color:var(--make);
                    font-size:14px; }
  /* corrected clips: a subtle accent dot on the chip corner */
  .chip { position:relative; }
  .chip.fixed::after { content:""; position:absolute; top:3px; right:3px;
                       width:5px; height:5px; border-radius:50%;
                       background:var(--accent); }
  .chip.seen::after { content:""; position:absolute; top:3px; right:3px;
                      width:5px; height:5px; border-radius:50%;
                      background:var(--make); }
  #nav button { flex:1; height:44px; background:var(--panel); color:var(--text);
                border:1px solid var(--line); border-radius:4px; font-size:15px;
                font-weight:600; }
  #nav button:active { background:#1B2430; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px;
           -webkit-overflow-scrolling:touch; }
  /* glanceable shot facts: balls in play as coloured badges + the
     description's lead clause — full story stays in Details (Joe) */
  #inline { display:flex; align-items:center; gap:6px; min-height:22px;
            margin-bottom:6px; overflow:hidden; }
  #inline .ball { width:20px; height:20px; border-radius:50%; flex:0 0 auto;
                  display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:700; color:#0B0F14;
                  border:1px solid rgba(0,0,0,.4); }
  #inline .frag { color:var(--dim); font-size:12px; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; margin-left:4px; }
  #lane { position:relative; height:40px; margin:0 0 8px;
          background:var(--panel); border:1px solid var(--line);
          border-radius:4px; touch-action:none; overflow:hidden; }
  .region { position:absolute; top:5px; bottom:5px; border-radius:2px;
            opacity:.6; }
  .region.make { background:var(--make); }
  .region.miss { background:#4A5563; }
  .region.scratch { background:var(--scratch); }
  .region.inhand { background:var(--faint); opacity:.25; }
  .region.lead { opacity:.22; }
  #playhead { position:absolute; top:0; bottom:0; width:2px;
              background:var(--text); pointer-events:none; }
  /* between clips (continuity mode): the lane owns no time yet, so the
     playhead waits visibly instead of looking stuck */
  #playhead.waiting { opacity:.35; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.1; } }
  .chip { min-width:42px; height:42px; border-radius:4px; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center;
          background:var(--panel); border:2px solid var(--line);
          font-weight:700; }
  .chip.make { border-color:var(--make); color:var(--make); }
  .chip.miss { border-color:#39414d; color:var(--text); }
  .chip.scratch { border-color:var(--scratch); color:var(--scratch); }
  .chip.inhand { border-color:#242b35; color:var(--faint); opacity:.55;
                 font-size:11px; }
  .chip.cur { background:#1B2430; outline:2px solid var(--accent); }
  .empty { padding:32px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>BILLIARDS REVIEW</h1>
  <span class="sub" id="build"></span>
</header>
<div id="update">Update available — tap to reload</div>
<div id="keygate"></div>
<div id="keyentry" style="display:none; padding:0 24px 24px; text-align:center;">
  <input id="keyfield" placeholder="paste key here" autocapitalize="off"
         autocorrect="off" spellcheck="false"
         style="width:100%; max-width:340px; height:44px; padding:0 12px; font-size:16px;
                background:var(--panel); border:1px solid var(--line);
                border-radius:4px; color:var(--text); font-size:15px;">
  <button id="keysave"
          style="margin-top:10px; height:44px; padding:0 24px;
                 background:var(--panel); border:1px solid var(--accent);
                 border-radius:4px; color:var(--accent); font-weight:600;
                 font-size:15px;">Save key</button>
</div>

<div id="sessions"></div>
    <div id="statsheet" style="display:none;position:fixed;inset:0;z-index:40;
         background:var(--bg,#0B0F14);overflow-y:auto">
      <div style="margin:calc(10px + env(safe-area-inset-top)) 12px 20px;
           background:var(--panel,#12161C);border:1px solid #2A323D;
           border-radius:16px;padding:18px 16px 12px">
        <div style="display:flex;align-items:center;margin-bottom:4px">
          <h3 style="margin:0;font-size:17px">Lifetime Stats</h3>
          <button id="stats-close" style="margin-left:auto;min-width:44px">‹ Home</button>
        </div>
        <div id="stats-body" ></div>
      </div>
    </div>
    <div id="ovmenu">
      <div class="grab"></div>
      <h3>Drawing tools</h3>
      <div class="tools">
        <button id="d-line" class="tool"><span class="ic">╱</span>
          <span class="lb">Line</span></button>
        <button id="d-angle" class="tool"><span class="ic">∠</span>
          <span class="lb">Angle</span></button>
        <button id="d-show" class="tool"><span class="ic">👁</span>
          <span class="lb" id="d-show-lb">Shown</span></button>
        <button id="d-clear" class="tool"><span class="ic">🗑</span>
          <span class="lb">Clear</span></button>
      </div>
      <button id="d-del" class="lrow" disabled style="display:none"></button>
      <h3>View</h3>
      <button id="ov-rot" class="lrow">Rotate 180°
        <span class="chev" id="ov-rot-st">Off</span></button>
      <h3>Overlays</h3>
      <button id="ov-aim" class="lrow">Aim line
        <span class="chev" id="ov-aim-st">Off</span></button>
      <button id="ov-paths" class="lrow">Ball paths
        <span class="chev" id="ov-paths-st">Off</span></button>
      <button id="ov-why" class="lrow">Shot lines
        <span class="chev" id="ov-why-st">Off</span></button>
    </div>
    <div id="dtools">
      <div class="dtrow">
        <span id="dt-colors" style="display:flex;gap:10px"></span>
        <button id="dt-w" style="min-width:40px;background:none;border:none;
                color:var(--text)">──</button>
        <button id="dt-del" style="min-width:36px;background:none;
                border:none">🗑</button>
      </div>
      <div class="dtrow">
        <label>◐</label>
        <input id="dt-a" type="range" min="15" max="100" value="55">
      </div>
      <div class="dtrow" id="dt-lenrow" style="display:none">
        <label>↔</label>
        <input id="dt-len" type="range" min="5" max="160" value="40"
               title="line length">
      </div>
    </div>
    <div id="sheet">
      <p id="sh-desc"></p>
      <div class="row">
        <button id="sh-split">✂ Split at playhead</button>
        <button id="sh-copyid">⧉ Copy Shot ID</button>
      </div>
      <div class="row">
        <button id="pl-save">☆ Playlist</button>
        <button id="rife-req">✨ Slo-mo</button>
      </div>
      <div id="pl-pick" style="display:none"></div>
      <div class="row" id="sh-cut">
        <span style="align-self:center;color:var(--dim);font-size:12px;
              min-width:52px">CUT</span>
        <button data-c="left">LEFT</button>
        <button data-c="straight">STRAIGHT</button>
        <button data-c="right">RIGHT</button>
      </div>
      <div class="row" id="sh-miss">
        <span style="align-self:center;color:var(--dim);font-size:12px;
              min-width:52px">MISSED</span>
        <button data-m="left">LEFT</button>
        <button data-m="right">RIGHT</button>
      </div>
      <div class="row" id="sh-outcome">
        <button data-o="make">MAKE</button>
        <button data-o="miss">MISS</button>
        <button data-o="scratch">SCRATCH</button>
      </div>
      <div class="row" id="sh-action">
        <button data-a="stroke">STROKE</button>
        <button data-a="break">BREAK</button>
        <button data-a="ball_in_hand">IN HAND</button>
        <button data-a="rearrange">SHUFFLE</button>
      </div>
      <textarea id="sh-note" placeholder="Details — what did the system get wrong?"></textarea>
      <div class="row">
        <button id="sh-confirm" style="color:var(--make);
                border-color:var(--make);">✓ Looks right — mark reviewed</button>
      </div>
      <div class="row">
        <button id="sh-cancel">Cancel</button>
        <button id="sh-save">Save correction</button>
      </div>
      <div class="row">
        <button id="sh-clear"
                style="display:none; color:var(--scratch);
                       border-color:var(--scratch);">Remove correction</button>
      </div>
    </div>
  </div>
    <div id="newssheet" style="display:none;position:fixed;inset:0;z-index:40;
         background:var(--bg,#0B0F14);overflow-y:auto">
      <div style="margin:calc(10px + env(safe-area-inset-top)) 12px 20px;
           background:var(--panel,#12161C);border:1px solid #2A323D;
           border-radius:16px;padding:18px 16px 12px">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <h3 style="margin:0;font-size:17px">What’s New</h3>
          <button id="news-close" style="margin-left:auto;min-width:44px">‹ Home</button>
        </div>
        <div id="news-list" ></div>
      </div>
    </div>

<div id="player">
  <div id="topbar">
    <button id="back">‹ Sessions</button>
    <span id="title"></span>
    <button id="ovbtn" title="overlays &amp; drawing"
            style="flex:0 0 auto;min-width:46px;margin-left:8px">☰</button>
  </div>
  <div id="vwrap" style="position:relative; flex:1 1 auto; min-height:120px; display:flex; overflow:hidden;">
    <!-- ONLY this layer rotates (Joe: "keep your legend upright when I
         rotate the video", "play button seems to flip"). The video and
         the canvases that share its coordinate space live inside; every
         piece of HUD chrome stays outside and upright. -->
    <div id="vrot" style="position:absolute; inset:0; display:flex;">
    <video id="video" playsinline preload="metadata"></video>
    <canvas id="scrubcv" style="position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none"></canvas>
    <canvas id="trails"></canvas>
    <canvas id="drawcv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none"></canvas>
    </div><!-- /vrot -->
    <button id="zoomreset" style="display:none;position:absolute;top:12px;
         right:12px;z-index:21;background:rgba(13,17,23,.85);color:#EAF2F3;
         border:1px solid #2A323D;border-radius:14px;padding:4px 12px;
         font-size:13px;font-weight:700">1×</button>
    <div id="holdpill" style="display:none;position:absolute;top:12px;
         left:50%;transform:translateX(-50%);background:rgba(13,17,23,.85);
         color:#EAF2F3;border:1px solid #2A323D;border-radius:14px;
         padding:4px 12px;font-size:13px;font-weight:700;z-index:20">¼×</div>
    <div id="spinner"><div></div></div>
    <div id="paused-glyph">▶</div>
    <div id="legend"></div>
  </div>
  <div id="shotbar">
    <div id="shotinfo">
      <span class="n" id="shot-n">–</span>
      <span class="oc" id="shot-oc"></span>
      <span class="t" id="shot-t"></span>
    </div>
    <div id="inline"></div>
    <div id="lane"><div id="playhead"></div></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="fprev" title="back one frame">‹·</button>
      <button id="play" title="play / pause">▶</button>
      <button id="mode" title="repeat this shot">⟳</button>
      <button id="rate" title="playback speed">1×</button>
      <button id="fnext" title="forward one frame">·›</button>
      <button id="next">›</button>
    </div>
    <div id="lower">
      <button id="correct">✎ Correct this clip</button>
      <div id="chips"></div>
    </div>
    <div id="ovscrim"></div>
</div>

<script>
const BUILD = "__BUILD_ID__";
const PRE_ROLL = 5.0;
const $ = id => document.getElementById(id);
$("build").textContent = BUILD.slice(0, 10);

// ---- key handling: arrives once as ?k=, lives in localStorage ----------
const url = new URL(location.href);
if (url.searchParams.get("k")) {
  // strip anything a chat renderer glued onto the key (asterisks,
  // punctuation, whitespace) — the key alphabet is base64url only
  const raw = url.searchParams.get("k").replace(/[^A-Za-z0-9_-]/g, "");
  localStorage.setItem("key", raw);
  url.searchParams.delete("k");
  history.replaceState(null, "", url.pathname);
}
let KEY = localStorage.getItem("key");
document.addEventListener("DOMContentLoaded", () => {
  $("keysave").onclick = () => {
    const v = $("keyfield").value.replace(/[^A-Za-z0-9_-]/g, "");
    if (!v) return;
    localStorage.setItem("key", v);
    KEY = v;
    $("keygate").style.display = "none";
    $("keyentry").style.display = "none";
    loadSessions();
  };
});

async function api(path, opts) {
  const o = opts || {};
  o.headers = Object.assign({ "x-key": KEY || "" }, o.headers || {});
  const r = await fetch(path, o);
  if (r.status === 401) {
    // say exactly which failure this is, so remote debugging isn't a guess
    $("keygate").textContent = KEY
      ? `A key ending "…${KEY.slice(-4)}" (${KEY.length} chars) is stored, ` +
        "but the server rejected it. Re-open the current install link — " +
        "the key may have been rotated or mangled."
      : "No key stored on this device yet. Open the install link " +
        "(the one containing ?k=…) once.";
    $("keygate").style.display = "block";
    $("keyentry").style.display = "block";
    $("sessions").innerHTML = "";
    throw new Error("401");
  }
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

// ---- self-update: poll version.json, offer one-tap reload --------------
async function checkUpdate() {
  try {
    const r = await fetch("/version.json?ts=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v.build && v.build !== BUILD) $("update").style.display = "block";
  } catch (e) { /* offline is fine */ }
}
$("update").onclick = () => location.reload();
document.addEventListener("visibilitychange",
  () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---- sessions list ------------------------------------------------------
function fmtDate(name, iso) {
  const m = name.match(/session-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return name;
  // Filename stamps are UTC (controller uses datetime.now(timezone.utc);
  // verified against file mtime: a 14-min session ending 9:11 PM EDT is
  // named 20260820-005647). The "Z" is CORRECT — Joe was not playing
  // pool at 12:56 AM, and briefly "fixing" this said he was.
  const d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00Z`);
  return d.toLocaleString([], { month: "short", day: "numeric",
                                hour: "numeric", minute: "2-digit" });
}
// ---- home tabs: Sessions | Playlists (Joe: "Playlists alongside
// sessions... Save Clip from a session to a playlist")
const PL = {
  all: () => { try { return JSON.parse(localStorage.getItem("playlists") || "[]"); }
               catch (e) { return []; } },
  save: ls => {
    localStorage.setItem("playlists", JSON.stringify(ls));
    localStorage.setItem("playlistsMod", String(Date.now()));
    PL.push();
  },
  create: name => {
    const ls = PL.all();
    ls.push({ id: Date.now().toString(36), name, mod: Date.now(), clips: [] });
    PL.save(ls);
    return ls[ls.length - 1];
  },
  // ---- server sync (Dropbox via /api/playlists): whole-doc last-write-
  // wins — device-local playlists would die with the phone (Joe's
  // curation is too valuable for that). Deletes propagate because the
  // full list is what syncs.
  _timer: null,
  push: () => {
    clearTimeout(PL._timer);
    PL._timer = setTimeout(async () => {
      try {
        await api("/api/playlists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mod: Number(localStorage.getItem("playlistsMod")) || Date.now(),
            playlists: PL.all(),
          }),
        });
      } catch (e) { /* offline: next save retries */ }
    }, 1500);
  },
  pull: async () => {
    try {
      const doc = await api("/api/playlists");
      const localMod = Number(localStorage.getItem("playlistsMod")) || 0;
      if ((Number(doc.mod) || 0) > localMod) {
        localStorage.setItem("playlists",
                             JSON.stringify(doc.playlists || []));
        localStorage.setItem("playlistsMod", String(doc.mod));
        if ($("player").classList.contains("open") === false)
          renderHome();
      } else if (localMod > (Number(doc.mod) || 0)) {
        // local wins — but the Slow-mo playlist is PC-OWNED (the render
        // watcher appends to it): adopt the server's copy of it before
        // healing, or the push would erase fresh renders
        const srv = (doc.playlists || []).find(q => q.name === "Slow-mo");
        if (srv) {
          const ls = PL.all().filter(q => q.name !== "Slow-mo");
          ls.push(srv);
          localStorage.setItem("playlists", JSON.stringify(ls));
        }
        if (PL.all().length) PL.push();
      }
    } catch (e) { /* offline is fine */ }
  },
};
let sessCache = [];                       // last /api/sessions payload
// ---- home screen: accordion sections (Joe: "sessions header, then a
// playlists header, drop downs with indented content, entries slidable
// to delete")
const HOME = {
  sess: localStorage.getItem("home_sess") === "1",   // start collapsed (Joe)
  pl: localStorage.getItem("home_pl") === "1",
};
function _accHeader(box, key, title, count) {
  const h = document.createElement("div");
  h.className = "acc" + (HOME[key] ? " open" : "");
  const ch = document.createElement("span");
  ch.className = "ch"; ch.textContent = "\u203A";
  const t = document.createElement("span");
  t.textContent = title;
  const c = document.createElement("span");
  c.className = "cnt"; c.textContent = count === 0 ? "" : count;
  h.append(ch, t, c);
  h.onclick = () => {
    HOME[key] = !HOME[key];
    localStorage.setItem("home_" + key, HOME[key] ? "1" : "0");
    if (key === "pl" && HOME.pl) PL.pull();
    renderHome();
  };
  box.appendChild(h);
}
const fmtDur = d => d == null ? "\u2013"
  : d >= 3600 ? `${Math.floor(d / 3600)}h${String(Math.floor(d % 3600 / 60)).padStart(2, "0")}`
  : d >= 60 ? `${Math.floor(d / 60)}m` : `${Math.floor(d)}s`;

function _plRow(pl) {
  const holder = document.createElement("div");
  holder.className = "swipe";
  const del = document.createElement("button");
  del.className = "swdel";
  del.textContent = "Delete";
  del.onclick = () => {
    PL.save(PL.all().filter(q => q.id !== pl.id));
    renderHome();
  };
  const el = document.createElement("div");
  el.className = "sess pl";
  const n = document.createElement("span");
  n.className = "d";
  n.textContent = pl.name;
  const c = document.createElement("span");
  c.className = "num";
  c.textContent = pl.clips.length + (pl.clips.length === 1 ? " clip" : " clips");
  el.append(n, c);
  // iOS-style swipe-to-delete: horizontal drag reveals the button;
  // touch-action pan-y keeps vertical list scrolling native
  let x0 = null, dx = 0, open = false, moved = false;
  el.addEventListener("pointerdown", e => {
    x0 = e.clientX; moved = false;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (x0 == null) return;
    const raw = e.clientX - x0 - (open ? 80 : 0);
    if (Math.abs(e.clientX - x0) > 8) moved = true;
    dx = Math.min(0, Math.max(-96, raw));
    el.style.transform = `translateX(${dx}px)`;
  });
  const up = e => {
    if (x0 == null) return;
    open = dx < -40;
    el.style.transition = "transform .16s ease";
    el.style.transform = `translateX(${open ? -80 : 0}px)`;
    setTimeout(() => { el.style.transition = ""; }, 180);
    const tap = !moved && !open;
    x0 = null; dx = open ? -80 : 0;
    if (tap) openPlaylist(pl);
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  holder.append(del, el);
  return holder;
}

async function openStats() {
  $("sessions").style.display = "none";
  $("statsheet").style.display = "block";
  const box = $("stats-body");
  box.innerHTML = "<div class='empty'>Loading…</div>";
  try {
    const d = await api("/api/stats");
    const c = d.cells || {};
    const g = k => c[k] || 0;
    // Joe's structure: totals, then misses broken into subgenres with the
    // overcut/undercut reading built in (overcut = too thin: a left cut
    // missing LEFT went too thin; missing RIGHT was hit too full)
    const line = (label, n, indent, dim) =>
      `<div style="display:flex;padding:7px 2px ${indent ? "7px 18px" : "7px 2px"};
         border-bottom:1px solid #232B36;${dim ? "color:var(--dim)" : ""}">
         <span>${indent ? "• " : ""}${label}</span>
         <span style="margin-left:auto;font-weight:800;
           font-variant-numeric:tabular-nums">${n}</span></div>`;
    let html = "";
    html += line("Total Shots", d.total ?? "–");
    html += line("Makes", d.makes ?? "–");
    html += line("Misses", d.misses ?? "–");
    html += line("Cut Left / Miss Left (Overcut)", g("left|left"), true);
    html += line("Cut Left / Miss Right (Undercut)", g("left|right"), true);
    html += line("Cut Right / Miss Right (Overcut)", g("right|right"), true);
    html += line("Cut Right / Miss Left (Undercut)", g("right|left"), true);
    html += line("Straight / Miss Left", g("straight|left"), true);
    html += line("Straight / Miss Right", g("straight|right"), true);
    const cat = ["left|left","left|right","right|right","right|left",
                 "straight|left","straight|right"].reduce((a,k)=>a+g(k),0);
    html += line("Uncategorized", Math.max(0, (d.misses ?? 0) - cat), true, true);
    if (d.scratches) html += line("Scratches", d.scratches);
    html += `<p style="color:var(--dim);font-size:12px;margin-top:10px">
      Uncategorized = misses without a trusted cut/side read yet —
      set Cut and Missed in any shot’s Details to move it into its
      subgenre. Updated ${d.updated}.</p>`;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = "<div class='empty'>No stats yet — they appear after the next analysis pass.</div>";
  }
}
$("stats-close") && ($("stats-close").onclick = () => {
  $("statsheet").style.display = "none";
  $("sessions").style.display = "";
});

function renderHome() {
  const box = $("sessions");
  box.innerHTML = "";
  // What's New lives on the HOME page (Joe: it has no business in the
  // player's drawing menu). One tappable row: latest title, unread dot.
  const ns = window._newsState;
  if (ns) {
    const nb = document.createElement("div");
    nb.className = "newsbar";
    nb.innerHTML = `<span style="font-weight:700">What’s New</span>
      ${ns.unread ? '<span style="color:var(--accent);font-size:12px;margin-left:6px">● new</span>' : ""}
      <span style="color:var(--faint);font-size:13px;margin-left:10px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${ns.title}</span>
      <span style="color:var(--faint)">›</span>`;
    nb.onclick = () => window._openNews && window._openNews();
    box.appendChild(nb);
  }
  // Lifetime Stats (Joe: "a tight stats table so I can start
  // uncovering patterns") — trusted verdicts only
  const sb = document.createElement("div");
  sb.className = "newsbar";
  sb.innerHTML = `<span style="font-weight:700">Lifetime Stats</span>
    <span style="color:var(--faint);font-size:13px;margin-left:10px;flex:1">
      miss patterns, trusted shots only</span>
    <span style="color:var(--faint)">›</span>`;
  sb.onclick = openStats;
  box.appendChild(sb);
  _accHeader(box, "sess", "Sessions", sessCache.length);
  if (HOME.sess) {
    const wrap = document.createElement("div");
    wrap.className = "indent";
    if (!sessCache.length) {
      wrap.innerHTML = "<div class='empty'>Loading sessions\u2026</div>";
    } else {
      const head = document.createElement("div");
      head.className = "sess head";
      ["DATE", "LENGTH", "SHOTS"].forEach((t, i) => {
        const sp = document.createElement("span");
        if (i > 0) sp.className = "num";
        sp.textContent = t;
        head.appendChild(sp);
      });
      wrap.appendChild(head);
      sessCache.forEach(s2 => {
        const el = document.createElement("div");
        el.className = "sess" + (s2.analyzed ? "" : " stub");
        // textContent only — a Dropbox filename is untrusted input and
        // the fmtDate fallback returns it raw (security review).
        const d = document.createElement("span");
        d.className = "d";
        d.textContent = fmtDate(s2.name, s2.modified);
        const len = document.createElement("span");
        len.className = "num" + (s2.dur_s == null ? " dim" : "");
        len.textContent = fmtDur(s2.dur_s);
        const sh = document.createElement("span");
        sh.className = "num" + (s2.shots == null ? " dim" : "");
        sh.textContent = s2.shots == null ? "\u2013" : s2.shots;
        el.append(d, len, sh);
        el.onclick = () => openSession(s2);
        wrap.appendChild(el);
      });
    }
    box.appendChild(wrap);
  }
  const ls = PL.all();
  _accHeader(box, "pl", "Playlists", ls.length);
  if (HOME.pl) {
    const wrap = document.createElement("div");
    wrap.className = "indent";
    const nw = document.createElement("div");
    nw.className = "sess new";
    nw.textContent = "\uFF0B New Playlist";
    nw.onclick = () => {
      const name = (prompt("Playlist name") || "").trim();
      if (name) { PL.create(name); renderHome(); }
    };
    wrap.appendChild(nw);
    ls.forEach(pl => wrap.appendChild(_plRow(pl)));
    box.appendChild(wrap);
  }
}

let _plPulled = false;
async function loadSessions() {
  if (!_plPulled) { _plPulled = true; PL.pull(); }
  renderHome();
  try {
    const resp = await api("/api/sessions");
    sessCache = resp.sessions || [];
    renderHome();
  } catch (e) {
    if (String(e.message) !== "401")
      $("sessions").innerHTML =
        `<div class='empty'>Couldn't reach Dropbox (${e.message})</div>`;
  }
}

// ---- player -------------------------------------------------------------
let shots = [], cur = -1;
const isAttempt = s => !s.action || s.action === "stroke" || s.action === "break";

let playlistMode = null;          // {name} while a playlist is playing

async function openPlaylist(pl) {
  playlistMode = { name: pl.name };
  $("sessions").style.display = "none";
  document.querySelector("header").style.display = "none";
  $("update").style.display = "none";
  $("player").classList.add("open");
  $("title").textContent = "☆ " + pl.name;
  shots = []; cur = -1; curSession = "";
  $("chips").innerHTML = "";
  updateInfo();
  // resolve each saved clip against its session's summary (grouped per
  // session so each summary is fetched once), preserving playlist order
  const bySess = {};
  pl.clips.forEach(c => {
    if (c.slowmo) {                    // rendered clip: plays standalone
      c._resolved = { _slowmo: c.slowmo, text: c.label || c.slowmo,
                      start: 0, end: 0, outcome: "", action: "" };
      return;
    }
    (bySess[c.session] = bySess[c.session] || []).push(c);
  });
  for (const [sess, clips] of Object.entries(bySess)) {
    try {
      const d = await api("/api/shots?name=" + encodeURIComponent(sess));
      clips.forEach(c => {
        const m = (d.shots || []).find(x =>
          Math.abs(x.start - c.start) < 1.5
          || (x.start - 1 <= c.start && c.start <= (x.end || x.start) + 1));
        if (m) c._resolved = { ...m, _session: sess };
      });
    } catch (e) { /* session summary unreachable: clips stay unresolved */ }
  }
  shots = pl.clips.map(c => c._resolved).filter(Boolean);
  buildChips();
  buildLane();
  updateInfo();
  if (shots.length) gotoShot(0, true);
  else $("shot-oc").textContent = "No playable clips in this playlist.";
}

async function openSession(s) {
  playlistMode = null;
  curSession = s.name;
  $("sessions").style.display = "none";
  document.querySelector("header").style.display = "none";
  $("update").style.display = "none";
  $("player").classList.add("open");
  $("title").textContent = fmtDate(s.name, s.modified);
  shots = []; cur = -1;
  $("chips").innerHTML = "";
  updateInfo();
  try {
    const [linkD, shotsD] = await Promise.all([
      api("/api/link?name=" + encodeURIComponent(s.name)),
      s.analyzed ? api("/api/shots?name=" + encodeURIComponent(s.name))
                 : Promise.resolve({ shots: [] }),
    ]);
    $("video").src = linkD.link;
    shots = shotsD.shots || [];
    // verdicts saved from THIS phone survive the summary round-trip lag:
    // overlay them until the server copy carries the corrected flag
    try {
      const ov = JSON.parse(localStorage.getItem("verdicts") || "{}");
      let dirty = false;
      shots.forEach(s => {
        const k = curSession + "@" + s.start;
        if (ov[k]) {
          if (s.corrected) { delete ov[k]; dirty = true; }
          else Object.assign(s, ov[k]);
        }
      });
      if (dirty) localStorage.setItem("verdicts", JSON.stringify(ov));
    } catch (e) { /* overlay is best-effort */ }
    buildChips();
    buildLane();
    updateInfo();
    // start at the FIRST clip and AUTO-PLAY (Joe). iOS may veto an
    // unmuted programmatic play outside a gesture — then the ▶ glyph
    // shows and one tap starts it.
    if (shots.length) gotoShot(0, true);
    else $("video").play().catch(() => {});
  } catch (e) {
    $("shot-oc").textContent = "Load failed: " + e.message;
  }
}
$("back").onclick = () => {
  playlistMode = null;
  $("video").pause(); $("video").removeAttribute("src"); $("video").load();
  $("player").classList.remove("open");
  document.querySelector("header").style.display = "flex";
  $("sessions").style.display = "block";
  loadSessions();                  // re-render the active tab
  checkUpdate();
};

function buildChips() {
  const c = $("chips");
  c.innerHTML = "";
  shots.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = (isAttempt(s)
      ? "chip " + (s.outcome || "miss")
      : "chip inhand")
      + (s.corrected ? " fixed" : s.reviewed ? " seen" : "");
    el.textContent = isAttempt(s)
      ? (s.action === "break" ? "BRK" : i + 1)
      : (s.action === "rearrange" ? "⇄" : "✋");
    el.onclick = () => gotoShot(i, true);
    c.appendChild(el);
  });
}
async function gotoShot(i, play) {
  if (i < 0 || i >= shots.length) return;
  cur = i;
  const s = shots[i];
  // playlist clips can live in DIFFERENT session videos: swap the src
  // (spinner shows via the existing loading UI) before seeking
  if (s._slowmo) {
    if (curSession !== "slowmo:" + s._slowmo) {
      $("vwrap").classList.add("loading");
      try {
        const linkD = await api("/api/link?name="
                                + encodeURIComponent("slowmo/" + s._slowmo));
        curSession = "slowmo:" + s._slowmo;
        const v1 = $("video");
        v1.src = linkD.link;
        await new Promise(res =>
          v1.addEventListener("loadedmetadata", res, { once: true }));
        s.end = $("video").duration || 20;
      } catch (e) { /* fall through; play() below will surface it */ }
      $("vwrap").classList.remove("loading");
      if (cur !== i) return;
    }
    const v2 = $("video");
    v2.currentTime = 0;
    if (play) v2.play().catch(() => {});
    buildLane(); updateInfo();
    return;
  }
  if (s._session && s._session !== curSession) {
    $("vwrap").classList.add("loading");
    try {
      const linkD = await api("/api/link?name=" + encodeURIComponent(s._session));
      curSession = s._session;
      const v0 = $("video");
      v0.src = linkD.link;
      await new Promise(res =>
        v0.addEventListener("loadedmetadata", res, { once: true }));
    } catch (e) { /* link fetch failed; seek below still tries */ }
    $("vwrap").classList.remove("loading");
    if (cur !== i) return;        // user navigated on while loading
  }
  const v = $("video");
  v.currentTime = Math.max(0, s.start - PRE_ROLL);
  if (play) v.play().catch(() => {});
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}
$("prev").onclick = () => gotoShot(Math.max(0, cur - 1), true);
$("next").onclick = () => gotoShot(Math.min(shots.length - 1, cur + 1), true);

function fmt(t) {
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
}
function updateInfo() {
  const cs = shots[cur];
  $("correct").textContent = (cs && cs.corrected)
    ? "🛈 Details · corrected"
    : (cs && cs.reviewed) ? "🛈 Details · reviewed ✓" : "🛈 Details";
  [...$("chips").children].forEach((el, i) => el.classList.toggle("cur", i === cur));
  if (cur < 0 || !shots[cur]) {
    $("shot-n").textContent = shots.length ? `${shots.length} shots` : "–";
    $("shot-oc").textContent = ""; $("shot-t").textContent = "";
    return;
  }
  const s = shots[cur];
  $("shot-n").textContent = `Shot ${cur + 1}/${shots.length}`;
  const act = s.action || "stroke";
  const label = act === "ball_in_hand" ? "BALL IN HAND"
              : act === "rearrange" ? "REARRANGING"
              : act === "nothing" ? "—"
              : act === "break" ? "BREAK · " + (s.outcome || "").toUpperCase()
              : (s.outcome || "").toUpperCase();
  $("shot-oc").textContent = label + (s.corrected ? " ✓" : "");
  $("shot-oc").style.color = s.outcome === "make" ? "var(--make)"
                           : s.outcome === "scratch" ? "var(--scratch)"
                           : "var(--dim)";
  $("shot-t").textContent = `${fmt(s.start)} · ${(s.end - s.start).toFixed(1)}s`;
  // balls in play (stat/debug): trail participants, cue first
  const box = $("inline");
  box.innerHTML = "";
  const nums = (s.trails || []).map(tr => tr.n)
    .sort((a, b) => (a === 0 ? -1 : b === 0 ? 1 : a - b));
  nums.forEach(n => {
    const b = document.createElement("div");
    b.className = "ball";
    b.style.background = n >= 0 ? (BALL_COL[n] || "#9AA4B2") : "#4A5563";
    b.textContent = n > 0 ? n : (n === 0 ? "" : "?");
    box.appendChild(b);
  });
  // MISS TAG (Joe: "start by simply tagging each miss") — labels, not
  // degrees; the numbers live in Details.
  if (s.tags) {
    const t = s.tags;
    const chip = document.createElement("span");
    chip.className = "frag";
    chip.style.cssText = "color:#E5484D;font-weight:600;margin-right:8px";
    const head = t.cut === "straight" ? "Straight-in" :
      (t.cut === "left" ? "Left cut" : "Right cut");
    // A tag the analysis itself does not trust must not be worn as a
    // verdict (Joe was shown "Straight-in · missed right" on a shot whose
    // object ball went untracked for half a second right after contact).
    const sure = (t.confidence || "high") === "high";
    // When the ball was LOST right after contact we do not merely doubt the
    // side, we have no measurement of it -- 005048@233 said "missed right"
    // about a ball that missed left. Say what we know and stop there.
    const blind = /untracked/.test(t.confidence || "");
    chip.textContent = blind
      ? `${head} · can't tell which side — ball lost after contact`
      : `${head} · missed ${t.miss_side}`
        + (t.fullness ? ` · ${t.fullness}` : "")
        + (sure ? "" : " · unreliable");
    if (!sure) {
      chip.style.cssText =
        "color:var(--faint);font-weight:600;margin-right:8px;"
        + "text-decoration:underline dotted";
      chip.title = t.confidence;
    }
    box.appendChild(chip);
  }
  const frag = document.createElement("span");
  frag.className = "frag";
  // skip the bare opener ("Stroke") — show the first INFORMATIVE clause
  const clauses = (s.text || "").split(";").map(c => c.trim());
  frag.textContent = clauses.length > 1 ? clauses[1] : clauses[0] || "";
  box.appendChild(frag);
}

// ---- SHOT-scoped scrub lane (Joe: whole-session scale was unusable) ----
// The lane covers just the current shot: routine lead-in -> settled,
// plus a 1s tail. Scrubbing works within that window; < > moves between
// shots; the mode button picks what happens at the end of the shot:
//   ⟳  loop this shot          ▸▸  roll into the next shot (CD style)
let win = null;                       // {t0, t1} of the visible window
let mode = localStorage.getItem("mode") || "cd";   // "cd" | "loop"

function modeLabel() {
  // a TOGGLE, not an action: engaged = this shot repeats until you move
  const on = mode === "loop";
  $("mode").style.color = on ? "var(--make)" : "var(--dim)";
  $("mode").style.borderColor = on ? "var(--make)" : "var(--line)";
}
$("mode").onclick = () => {
  mode = mode === "loop" ? "cd" : "loop";
  localStorage.setItem("mode", mode);
  modeLabel();
};

function buildLane() {
  const lane = $("lane");
  [...lane.querySelectorAll(".region")].forEach(el => el.remove());
  if (cur < 0 || !shots[cur]) { win = null; return; }
  const s = shots[cur];
  const t0 = Math.max(0, s.start - PRE_ROLL);
  const t1 = Math.max(s.end, s.start + 0.5) + 1.0;
  win = { t0, t1 };
  const span = t1 - t0;
  const lead = document.createElement("div");
  lead.className = "region lead "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  lead.style.left = "0%";
  lead.style.width = (100 * (s.start - t0) / span) + "%";
  lane.appendChild(lead);
  const body = document.createElement("div");
  body.className = "region "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  body.style.left = (100 * (s.start - t0) / span) + "%";
  body.style.width =
    (100 * (Math.max(s.end, s.start + 0.5) - s.start) / span) + "%";
  lane.appendChild(body);
}

// Advance WITHOUT seeking — used when the next shot's window adjoins the
// current one, so playback rolls straight through (Joe: "no time jumps
// if one clip plays into the next"). Only real dead time gets skipped.
function advanceSeamless(i) {
  cur = i;
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}

// ---- WHY THIS MISS (Joe): draw the figure the LABEL is made of, so
// "left cut / missed left / overcut" is self-evident rather than
// asserted. Three lines from the object ball: where it SHOULD have gone
// (to the pocket), where it DID go, and the cue's approach that defines
// left vs right. All from stored geometry — identical on both surfaces.
// ---- one renderer for every analysis overlay --------------------------
// Joe: "cleaner, finer, smoother graphics... right now they're fat ugly
// pixelated things". Three causes, all fixed here:
//   * each segment used to be stroked SEPARATELY with its own dark halo,
//     so every vertex got double-blended into a bead;
//   * the halo (4.6px) outweighed the core (2.0px), reading as a muddy
//     grey band rather than a line;
//   * a 0.15s-sampled path was drawn as a raw polygon, corners and all.
// Now: one Path2D per line, smoothed through its midpoints, stroked as a
// soft same-hue bloom under a thin crisp core.

//: build a smooth Path2D through points (quadratic via midpoints)
function smoothPath(pts) {
  const path = new Path2D();
  if (!pts.length) return path;
  path.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 2) { path.lineTo(pts[1][0], pts[1][1]); return path; }
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2;
    const my = (pts[i][1] + pts[i + 1][1]) / 2;
    path.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const n = pts.length - 1;
  path.quadraticCurveTo(pts[n - 1][0], pts[n - 1][1], pts[n][0], pts[n][1]);
  return path;
}

//: a line reads over blue felt AND over a white ball, so: a whisper of
//: dark to separate it from the background, a bloom in its own hue for
//: presence, then a thin opaque core that carries the actual geometry
function strokeLine(ctx, path, col, w, dpr, opts) {
  const o = opts || {};
  ctx.save();
  ctx.lineJoin = ctx.lineCap = "round";
  if (o.dash) ctx.setLineDash(o.dash.map(d => d * dpr));
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = "#05090C";
  ctx.lineWidth = (w + 1.6) * dpr;
  ctx.stroke(path);
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = col;
  ctx.lineWidth = (w + 3.2) * dpr;
  ctx.stroke(path);
  ctx.globalAlpha = o.alpha == null ? 0.95 : o.alpha;
  ctx.strokeStyle = o.grad || col;
  ctx.lineWidth = w * dpr;
  ctx.stroke(path);
  ctx.restore();
}

//: a marker that does not look like a blob: filled core, hairline ring
function markDot(ctx, x, y, col, r, dpr) {
  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = "#05090C";
  ctx.beginPath(); ctx.arc(x, y, (r + 1.4) * dpr, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r * dpr, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = "rgba(255,255,255,.65)";
  ctx.lineWidth = 0.8 * dpr;
  ctx.beginPath(); ctx.arc(x, y, r * dpr, 0, 7); ctx.stroke();
  ctx.restore();
}

//: HiDPI backing store, sized once per frame in ONE place
function fitCanvas(cv, box) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(box.width * dpr), h = Math.round(box.height * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return dpr;
}

//: object-fit:contain letterboxing -- where the picture actually sits
//: inside the canvas, and the mapper from normalized video coords to
//: device pixels. All three overlays computed this separately.
function videoBox(cv, v) {
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = fitCanvas(cv, box);
  const sc = Math.min(box.width / v.videoWidth, box.height / v.videoHeight);
  const cw = v.videoWidth * sc, ch = v.videoHeight * sc;
  const ox = (box.width - cw) / 2, oy = (box.height - ch) / 2;
  return { box, dpr, P: q => [(ox + q[0] * cw) * dpr, (oy + q[1] * ch) * dpr] };
}

//: The target ball's recorded path. The WHOLE of it. Joe: "I just want a
//: line showing where the object ball actually goes and that is not being
//: done." It was not: this used to trim at the closest approach to the
//: pocket, which discards the rebound and leaves three points running
//: straight at the pocket — indistinguishable from the pocket line, and
//: exactly what he kept seeing. No trimming, no inference, no cleverness.
function objectTail(s, g) {
  const num = s.tags && s.tags.target;
  if (num == null || !s.trails) return [];
  const tr = s.trails.find(e => e.n === num && e.p && e.p.length > 1);
  return tr ? tr.p.map(q => [q[1], q[2]]) : [];
}

function drawWhy() {
  const cv = $("trails"), v = $("video");
  const s = shots[cur];
  const g = s && (s.lines || (s.tags && s.tags.geom));
  if (!g || !v.videoWidth) { hideLegend(); return; }
  const { dpr, P } = videoBox(cv, v);
  const ctx = cv.getContext("2d");
  const line = (a, b, col, w, dash) =>
    strokeLine(ctx, smoothPath([P(a), P(b)]), col, w, dpr, { dash: dash });
  const dot = (a, col, r) => { const q = P(a); markDot(ctx, q[0], q[1], col, r, dpr); };
  line(g.cue, g.obj, "#8AA0FF", 1.1, [5, 6]);      // the approach
  line(g.obj, g.pocket, "#7DF29B", 1.3);           // should have gone
  // WHERE IT ACTUALLY WENT. Joe: "look at the purple 4 ball here, it's
  // not travelling on your red line at all" -- because this used to be a
  // straight ray re-derived from six samples of departure direction, and
  // on that shot those samples straddled a half-second hole in the ball's
  // track. We already MEASURED the path; draw the measurement. The ray is
  // kept only as a fallback for shots that have no trail.
  // g.path is the CLEANED outbound leg: from contact until the ball stops
  // advancing on the pocket. It excludes the stub the arriving cue ball
  // steals at contact, and the rebound after it hits the rail -- both of
  // which made the line wander somewhere the object ball never went.
  // Prefer the ball's OWN TAIL over the sparse exported stub. Joe: "your
  // tail is slightly off so it doesn't point at the tail, it points at the
  // pocket." On a hard shot the outbound leg is only two or three 0.1s
  // samples, so the drawn line is nearly a straight run at the pocket and
  // carries no information. The trail has every sample we recorded; use it
  // up to the ball's closest approach, which is where the miss happens.
  const tail = objectTail(s, g);
  if (tail.length > 1) {
    strokeLine(ctx, smoothPath(tail.map(P)), "#E5484D", 1.3, dpr);
  } else if (g.path && g.path.length > 1) {
    strokeLine(ctx, smoothPath(g.path.map(P)), "#E5484D", 1.3, dpr);
  } else {
    line(g.obj, g.went, "#E5484D", 1.3);
  }
  dot(g.obj, "#FFFFFF", 2.6);
  dot(g.pocket, "#7DF29B", 3.4);
  showLegend([...(OV.aim ? [["#F0B429", "where the cue pointed"]] : []),
              ["#7DF29B", "line to the pocket"],
              ["#E5484D", "line it took"],
              ["#8AA0FF", "cue line"]]);
}

// The legend is DOM, deliberately: painted into the canvas it inherited
// the 180° flip and read upside down.
function showLegend(rows) {
  const el = $("legend");
  const key = rows.map(r => r.join("")).join("|");
  if (el.dataset.key !== key) {
    el.dataset.key = key;
    el.innerHTML = "";
    rows.forEach(([col, txt]) => {
      const d = document.createElement("div");
      const i = document.createElement("i");
      i.style.background = col;
      d.appendChild(i);
      d.appendChild(document.createTextNode(txt));
      el.appendChild(d);
    });
  }
  el.style.display = "flex";
  Legend.place();
}
function hideLegend() { $("legend").style.display = "none"; }

// ---- draggable legend -------------------------------------------------
// Joe: "can we set up to allow dragging the legend to move it out of the
// way? It's blocking my view of the shot." Stored as a FRACTION of the
// video box, not pixels, so it survives rotation, resize and a phone turned
// on its side — and it is clamped back inside on every placement, so a
// position saved on a big window can never strand it off-screen on a small
// one.
const Legend = (() => {
  const KEY = "legend_pos";
  let pos = null;
  try { pos = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { pos = null; }
  const el = () => $("legend");
  //: where the PICTURE sits inside the player — the video is letterboxed,
  //: so clamping to the wrap let the legend drift into the black bars
  //: beside the table (visible on 005048@96)
  function picture() {
    const r = $("vwrap").getBoundingClientRect(), v = $("video");
    if (!v.videoWidth) return { x: 0, y: 0, w: r.width, h: r.height, r };
    const sc = Math.min(r.width / v.videoWidth, r.height / v.videoHeight);
    const w = v.videoWidth * sc, h = v.videoHeight * sc;
    return { x: (r.width - w) / 2, y: (r.height - h) / 2, w, h, r };
  }
  function place() {
    const g = el();
    if (!pos || g.style.display === "none") return;
    const b = picture();
    const w = g.offsetWidth || 120, h = g.offsetHeight || 60;
    const x = Math.min(Math.max(b.x, b.x + pos.fx * b.w), b.x + Math.max(0, b.w - w));
    const y = Math.min(Math.max(b.y, b.y + pos.fy * b.h), b.y + Math.max(0, b.h - h));
    g.style.left = `${x}px`;
    g.style.top = `${y}px`;
    g.style.bottom = "auto";
  }
  let grab = null;
  function down(e) {
    const g = el(), r = $("vwrap").getBoundingClientRect();
    const b = g.getBoundingClientRect();
    grab = { dx: e.clientX - b.left, dy: e.clientY - b.top, r };
    g.classList.add("dragging");
    g.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  }
  function move(e) {
    if (!grab) return;
    const g = el(), b = picture();
    const w = g.offsetWidth, h = g.offsetHeight;
    const x = Math.min(Math.max(b.x, e.clientX - grab.r.left - grab.dx),
                       b.x + Math.max(0, b.w - w));
    const y = Math.min(Math.max(b.y, e.clientY - grab.r.top - grab.dy),
                       b.y + Math.max(0, b.h - h));
    g.style.left = `${x}px`;
    g.style.top = `${y}px`;
    g.style.bottom = "auto";
    pos = { fx: (x - b.x) / b.w, fy: (y - b.y) / b.h };
    e.preventDefault();
    e.stopPropagation();
  }
  function up(e) {
    if (!grab) return;
    grab = null;
    el().classList.remove("dragging");
    try { localStorage.setItem(KEY, JSON.stringify(pos)); } catch (err) { /* private mode */ }
    e.stopPropagation();
  }
  // attach NOW — this script runs after the document is parsed, so a
  // DOMContentLoaded listener would never fire and the drag would look
  // implemented while doing nothing
  const g0 = el();
  g0.addEventListener("pointerdown", down);
  g0.addEventListener("pointermove", move);
  g0.addEventListener("pointerup", up);
  g0.addEventListener("pointercancel", up);
  addEventListener("resize", place);
  return { place };
})();
ovSync();

function drawAim() {
  const cv = $("trails"), v = $("video");
  const s = shots[cur];
  if (!s || !s.aim || !v.videoWidth) return;
  const { dpr, P } = videoBox(cv, v);
  const ctx = cv.getContext("2d");
  const [a, b] = s.aim.p;
  // amber, NOT the green of "line to the pocket": with both overlays on,
  // two different meanings in one colour read as a single line running
  // straight through the object ball.
  strokeLine(ctx, smoothPath([P(a), P(b)]), "#F0B429", 1.2, dpr);
}

function drawTrails() {
  const cv = $("trails"), v = $("video");
  const s = shots[cur];
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = fitCanvas(cv, box);
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!s || !s.trails || !v.videoWidth) return;
  const { P } = videoBox(cv, v);
  const t = v.currentTime;
  const Q = q => P([q[1], q[2]]);      // trail points are [t, x, y]
  s.trails.forEach(tr => {
    // WHOLE SHOT, not a 4s tail (Joe: "should persist through the
    // entire duration of the shot") — the path is the record of what
    // happened, and it disappearing mid-review defeated the point.
    const pts = tr.p.filter(p => p[0] <= t).map(Q);
    if (pts.length < 2) return;
    const col = BALL_COL[tr.n] || "#9AA4B2";
    // The fade from faint-at-the-start to solid-at-the-ball used to be a
    // separate stroke PER SEGMENT, which beaded at every vertex. A single
    // gradient along the path gives the same read, smoothly.
    const a = pts[0], b = pts[pts.length - 1];
    let grad = col;
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 1) {
      grad = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
      grad.addColorStop(0, col + "38");
      grad.addColorStop(0.55, col + "9E");
      grad.addColorStop(1, col + "FF");

    strokeLine(ctx, smoothPath(pts), col, 1.5, dpr, { grad: grad, alpha: 1 });
    markDot(ctx, b[0], b[1], col, 2.6, dpr);   // where the ball is now

// A render loop, not timeupdate: iOS fires timeupdate ~4x/s and the
// playhead visibly stepped (Joe). rAF moves it every frame.
(function tick() {
  requestAnimationFrame(tick);
  const v = $("video");
  if (!$("player").classList.contains("open")) return;
  // trails paused per Joe ("I don't want the animated trails on here
  // yet") — data still exports; flip TRAILS_ON to re-enable
  if (OV.paths || window.TRAILS_ON) drawTrails();
  else { const c = $("trails");
         c.getContext("2d").clearRect(0, 0, c.width, c.height); }
  if (OV.aim) drawAim();
  if (OV.why) drawWhy(); else hideLegend();
  Draw.render();
  if (win) {
    // while the thumb owns the playhead, the video's lagging seek time
    // must NOT fight it (Joe: "still sticky when I drag") — the drag
    // handler positions the playhead; this loop yields until release

      const frac = (v.currentTime - win.t0) / (win.t1 - win.t0);
      $("playhead").style.left = (100 * Math.min(1, Math.max(0, frac))) + "%";
    }
    // in the dead time BETWEEN clips the lane owns no time: pulse the
    // playhead and count down to the next shot (Joe: "video is playing
    // but the playhead isn't moving — time isn't accounted for")
    const inGap = !v.paused && v.currentTime < win.t0 - 0.25;
    $("playhead").classList.toggle("waiting", inGap);
    if (inGap) {
      const s = Math.ceil(win.t0 - v.currentTime);
      $("shot-t").textContent = `next shot in ${s}s`;
    } else if ($("shot-t").textContent.startsWith("next shot")) {
      updateInfo();

  }
  if (win && !v.paused && cur >= 0 && v.currentTime >= win.t1 - 0.05) {
    if (mode === "loop") {
      v.currentTime = win.t0;
    } else if (cur < shots.length - 1) {
      // PURE continuity (Joe: "all clips run seamlessly into each other,
      // down to the frame... watch the thing in its entirety"): never
      // seek — playback rolls straight through, the clip indicator and
      // lane just follow. Skipping is what the › button is for.
      {
        const nx = shots[cur + 1];
        if (nx && nx._session && nx._session !== curSession)
          gotoShot(cur + 1, true);   // playlist crossing into another video

// Latest-wins seek chaining: firing currentTime on every pointermove
// queues seeks inside the decoder and the picture lags the thumb by
// seconds. Issue ONE seek at a time; when it lands, jump straight to
// wherever the thumb is NOW (Joe: "more frame resolution... really
// look closely at frame timing").
let seekBusy = false, seekPending = null, seekFastMode = false;

  if (seekBusy) { seekPending = t; return; }

  seekFastMode = !!fast;

  // precise seek's time — right for live thumb-dragging; the release
  // handler issues one precise seek for exact frame inspection
  if (fast && v.fastSeek) v.fastSeek(t); else v.currentTime = t;

$("video").addEventListener("seeked", () => {
  const v = $("video");
  if (seekPending != null) {
    const t = seekPending;
    seekPending = null;
    if (seekFastMode && v.fastSeek) v.fastSeek(t); else v.currentTime = t;
  } else {
    seekBusy = false;
  }
});

(() => {
  const lane = $("lane");
  let scrubbing = false, wasPlaying = false, lastT = null;
  const FPS = 30;                        // recording cadence (~29.996)
  let drawSeq = 0;
  const seekTo = ev => {
    if (!win) return;
    const r = lane.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    // PRECISE seeks quantized to frame boundaries. fastSeek felt fast
    // but lands on KEYFRAMES 1-2s apart — the picture skipped whole
    // seconds (Joe: "very jumpy, can't thumb scroll frame by frame").
    // Quantizing dedupes sub-frame drag events so the latest-wins chain
    // spends its budget only on frames that actually differ.
    lastT = Math.round((win.t0 + frac * (win.t1 - win.t0)) * FPS) / FPS;
    $("playhead").style.left = (100 * frac) + "%";
    // cache first: a harvested frame draws instantly with NO seek at
    // all; only gaps hit the decoder (and self-heal once harvested)
    const seq = ++drawSeq;
    // WIDE tolerance while dragging (Joe: "seeking backwards is still
    // unacceptable"): a backward seek restarts from the previous
    // keyframe (~200-400ms on iOS), so waiting on the decoder is what
    // feels stuck. Draw the nearest cached frame INSTANTLY — the
    // picture tracks the thumb and sharpens as the cache fills — and
    // only fall back to a seek when nothing near is cached. Release
    // still lands the exact frame.
    FrameCache.draw(lastT, 24).then(hit => {
      if (seq !== drawSeq) return;       // a newer thumb position won
      if (!hit) requestSeek(lastT, false);
    });
  };
  lane.addEventListener("pointerdown", ev => {
    if (typeof Warmer !== "undefined") Warmer.stop(false);
    scrubbing = true;
    window.scrubActive = true;           // rAF loop hands the playhead over
    wasPlaying = !$("video").paused;
    $("video").pause();          // decoder devotes itself to scrub frames
    lane.setPointerCapture(ev.pointerId);
    seekTo(ev);
  });
  lane.addEventListener("pointermove", ev => { if (scrubbing) seekTo(ev); });
  const end = () => {
    if (!scrubbing) return;
    scrubbing = false;
    window.scrubActive = false;
    drawSeq++;                                     // cancel in-flight draws
    if (lastT != null) {
      requestSeek(lastT, false);                   // one precise landing
      // keep the cached frame up until the REAL video catches up, so
      // release never flashes a stale frame
      const v = $("video");
      const off = () => { FrameCache.hide(); v.removeEventListener("seeked", off); };
      v.addEventListener("seeked", off);
      setTimeout(off, 700);                        // belt and suspenders

      FrameCache.hide();

})();

// ---- FRAME CACHE (Joe: "scrub really slowly or the video does not
// follow"): iOS precise seeks into long-keyframe video have a ~100-
// 300ms floor — no seek strategy can glide. So HARVEST every frame the
// video actually presents (requestVideoFrameCallback fires on playback
// AND on landed seeks) into JPEG blobs, and let the thumb draw straight
// from memory on a canvas over the video. After one viewing of a clip,
// scrubbing it is instant; gaps fall back to seeking and self-heal as
// the seeks land and get harvested too.
const FrameCache = (() => {
  const FPS = 30, CAP = 700;              // ~23s of unique frames
  let blobs = new Map(), bitmaps = new Map(), lastSrc = "";
  const idx = t => Math.round(t * FPS);
  const cap0 = document.createElement("canvas");
  function harvest(now, meta) {
    const v = $("video");
    v.requestVideoFrameCallback(harvest);
    if (v.currentSrc !== lastSrc) {       // new session video: reset
      lastSrc = v.currentSrc;
      blobs = new Map(); bitmaps = new Map();
    }
    const i = idx(meta.mediaTime);
    if (blobs.has(i) || !v.videoWidth) return;
    const scale = Math.min(1, 720 / v.videoHeight);
    cap0.width = Math.round(v.videoWidth * scale);
    cap0.height = Math.round(v.videoHeight * scale);
    cap0.getContext("2d").drawImage(v, 0, 0, cap0.width, cap0.height);
    cap0.toBlob(b => {
      if (!b) return;
      blobs.set(i, b);
      if (blobs.size > CAP) {             // evict farthest from playhead
        const cur = idx($("video").currentTime);
        let far = -1, fd = -1;
        for (const k of blobs.keys()) {
          const d = Math.abs(k - cur);
          if (d > fd) { fd = d; far = k; }
        }
        blobs.delete(far); bitmaps.delete(far);
      }

  }
  if ("requestVideoFrameCallback" in HTMLVideoElement.prototype)
    $("video").requestVideoFrameCallback(harvest);
  async function draw(t, tol) {           // true = drawn from cache
    const v = $("video");
    const T = tol == null ? 2 : tol;
    let i = idx(t), hit = null;
    for (let d = 0; d <= T && hit == null; d++)
      hit = blobs.has(i + d) ? i + d : blobs.has(i - d) ? i - d : null;
    if (hit == null) return false;
    let bm = bitmaps.get(hit);
    if (!bm) {
      bm = await createImageBitmap(blobs.get(hit));
      bitmaps.set(hit, bm);
      if (bitmaps.size > 90) {            // decoded LRU stays small
        const first = bitmaps.keys().next().value;
        if (first !== hit) { bitmaps.get(first).close(); bitmaps.delete(first); }
      }
    }
    const cv = $("scrubcv"), box = v.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(box.width * dpr);
    cv.height = Math.round(box.height * dpr);
    // contain-fit exactly like the <video> renders itself
    const s = Math.min(cv.width / bm.width, cv.height / bm.height);
    const dw = bm.width * s, dh = bm.height * s;
    cv.getContext("2d").drawImage(bm, (cv.width - dw) / 2,
                                  (cv.height - dh) / 2, dw, dh);
    cv.style.display = "block";
    return true;
  }
  return { draw, hide: () => { $("scrubcv").style.display = "none"; },
           has: t => blobs.has(idx(t)) };
})();

// ---- CACHE WARMER (Joe: "scrubbing backwards is still sticky"):
// backward seeks restart from the previous keyframe, so uncached
// regions are slow in reverse. While PAUSED, quietly seek through the
// shot's uncached frames under a frozen cover frame; once harvested,
// scrubbing is instant in both directions.
const Warmer = (() => {
  const FPS = 30;
  let on = false, holdT = null, timer = null;
  function nextUncached() {
    if (!win) return null;
    const lo = Math.max(0, Math.round(win.t0 * FPS));
    const hi = Math.round(win.t1 * FPS);
    // NEAREST-FIRST around the playhead: the frames the thumb is most
    // likely to want next get cached first (a linear sweep left the
    // region under his finger cold for the longest).
    const cur = Math.round(($("video").currentTime || win.t0) * FPS);
    for (let d = 0; d <= (hi - lo); d++) {
      const a = cur - d, b = cur + d;
      if (a >= lo && !FrameCache.has(a / FPS)) return a / FPS;
      if (b <= hi && !FrameCache.has(b / FPS)) return b / FPS;
    }
    return null;
  }
  function stop(restore) {
    if (!on) return;
    on = false;
    clearInterval(timer);
    const v = $("video");
    if (restore && holdT != null) {
      requestSeek(holdT, false);
      const off = () => { FrameCache.hide(); v.removeEventListener("seeked", off); };
      v.addEventListener("seeked", off);
      setTimeout(off, 800);
    } else {
      FrameCache.hide();
    }
    holdT = null;
  }
  function start() {
    const v = $("video");
    if (on || !win || !v.paused || !v.videoWidth) return;
    if (nextUncached() == null) return;      // already fully covered
    holdT = v.currentTime;
    FrameCache.draw(holdT);                  // freeze the view (best-effort)
    on = true;
    timer = setInterval(() => {
      if (!on) return;
      const v2 = $("video");
      if (!v2.paused || window.scrubActive || seekBusy) return;
      const t = nextUncached();
      if (t == null) { stop(true); return; }
      requestSeek(t, false);
    }, 45);
  }
  return { start, stop };
})();
$("video").addEventListener("pause", () => setTimeout(() => Warmer.start(), 250));
$("video").addEventListener("loadeddata", () => setTimeout(() => Warmer.start(), 600));
$("video").addEventListener("play", () => Warmer.stop(false));

// ---- DRAWING SUITE (Joe: "straight lines that can be drawn and moved
// around, persistent across frames of a shot... maybe a protractor").
// Objects live in coordinates NORMALIZED to the video's content box, so
// they stay pinned to the table through resizes and across every frame
// of the shot. Saved per session+shot on this device.
const Draw = (() => {
  let objs = [], sel = -1, show = true, loadedKey = "";
  const cv = $("drawcv");
  const key = () => {
    // keyed by SESSION + SHOT START so drawings follow the clip itself —
    // including when it plays inside a playlist
    const s = (typeof shots !== "undefined" && shots[cur]) || null;
    const sess = (s && s._session)
      || (typeof curSession !== "undefined" ? curSession : "");
    return `draw:${sess}:${s ? s.start : cur}`;
  };
  const save = () => { try { localStorage.setItem(key(), JSON.stringify(objs)); } catch (e) {} };
  const load = () => {
    loadedKey = key();
    sel = -1;
    try { objs = JSON.parse(localStorage.getItem(loadedKey) || "[]"); }
    catch (e) { objs = []; }
    syncUI();
  };
  function box() {                       // video CONTENT rect in canvas px
    const v = $("video"), r = v.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    if (!v.videoWidth) return { ox: 0, oy: 0, w: cv.width, h: cv.height };
    const s = Math.min(cv.width / v.videoWidth, cv.height / v.videoHeight);
    const w = v.videoWidth * s, h = v.videoHeight * s;

    if (loadedKey !== key()) load();

    if (!show) return;
    const dpr = window.devicePixelRatio || 1;
    objs.forEach((o, i) => {
      const P = o.pts.map(p => toPx(b, p));
      const col = o.color || "#7DF29B";

      const lw = (o.w || 1.8) * dpr;

        const a2 = Math.atan2(P[2][1] - P[0][1], P[2][0] - P[0][0]);

        g.stroke();

        const tw = g.measureText(label).width;

        cv.setPointerCapture(ev.pointerId);

      }

      cv.setPointerCapture(ev.pointerId);

  const WIDTHS = [1.2, 1.8, 3.0];
  const WIDTH_GLYPH = { 1.2: "─", 1.8: "──", 3.0: "━━" };
  function add(type) {
    const o = type === "line"
      ? { type: "line", pts: [[0.3, 0.45], [0.7, 0.45]] }
      : { type: "angle", pts: [[0.5, 0.5], [0.28, 0.36], [0.72, 0.36]] };
    o.color = COLORS[0]; o.alpha = 0.55; o.w = 1.8;

  }

  COLORS.forEach(c => {
    const d = document.createElement("button");
    d.className = "sw";
    d.dataset.c = c;
    d.style.background = c;
    d.onclick = () => {

  });

    $("d-show-lb").textContent = show ? "Shown" : "Hidden";
