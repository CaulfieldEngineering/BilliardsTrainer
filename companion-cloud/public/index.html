<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Billiards Review</title>
<style>
  :root { --bg:#0B0F14; --panel:#12161D; --line:#1D2530; --text:#E6EDF3;
          --dim:#7D8590; --faint:#3E4A5A; --make:#3FB950; --scratch:#E3B341;
          --accent:#58A6FF; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,
         "Segoe UI", sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:baseline; gap:10px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  #update { display:none; padding:10px 16px; background:#122c1a;
            border-bottom:1px solid var(--make); color:var(--make);
            font-weight:600; }
  #keygate { padding:40px 24px; text-align:center; color:var(--dim);
             display:none; }
  #sessions { padding:8px 0; }
  .sess { display:grid; grid-template-columns: 1fr 64px 56px;
          gap:10px; padding:12px 16px; align-items:baseline;
          border-bottom:1px solid var(--line); }
  .sess:active { background:var(--panel); }
  .sess .d { font-weight:600; }
  .sess .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sess .dim { color:var(--dim); }
  .sess.stub .d, .sess.stub .num { color:var(--faint); font-weight:400; }
  .sess.head { padding:8px 16px 6px; border-bottom:1px solid var(--line); }
  .sess.head span { color:var(--dim); font-size:11px; font-weight:600;
                    letter-spacing:.8px; }
  #player { display:none; }
  #topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; }
  #back { color:var(--accent); font-weight:600; background:none; border:none;
          font-size:15px; }
  #title { color:var(--dim); font-size:13px; margin-left:auto; }
  video { width:100%; max-height:52vh; background:#000; display:block; }
  #shotbar { padding:12px 16px; }
  #shotinfo { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  #shotinfo .n { font-size:18px; font-weight:700; }
  #shotinfo .oc { font-weight:700; }
  #shotinfo .t { color:var(--dim); font-size:12px; margin-left:auto; }
  #desc { color:var(--dim); font-size:13px; min-height:1.4em; margin-bottom:8px; }
  #nav { display:flex; gap:8px; margin-bottom:10px; }
  #nav #rate.on { color:var(--accent); border-color:var(--accent); }
  #nav button { flex:1; height:44px; background:var(--panel); color:var(--text);
                border:1px solid var(--line); border-radius:4px; font-size:15px;
                font-weight:600; }
  #nav button:active { background:#1B2430; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px;
           -webkit-overflow-scrolling:touch; }
  #lane { position:relative; height:44px; margin:0 0 10px;
          background:var(--panel); border:1px solid var(--line);
          border-radius:4px; touch-action:none; overflow:hidden; }
  .region { position:absolute; top:5px; bottom:5px; border-radius:2px;
            opacity:.6; }
  .region.make { background:var(--make); }
  .region.miss { background:#4A5563; }
  .region.scratch { background:var(--scratch); }
  .region.inhand { background:var(--faint); opacity:.25; }
  .region.lead { opacity:.22; }
  #playhead { position:absolute; top:0; bottom:0; width:2px;
              background:var(--text); pointer-events:none; }
  .chip { min-width:44px; height:44px; border-radius:4px; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center;
          background:var(--panel); border:2px solid var(--line);
          font-weight:700; }
  .chip.make { border-color:var(--make); color:var(--make); }
  .chip.miss { border-color:#39414d; color:var(--text); }
  .chip.scratch { border-color:var(--scratch); color:var(--scratch); }
  .chip.inhand { border-color:#242b35; color:var(--faint); opacity:.55;
                 font-size:11px; }
  .chip.cur { background:#1B2430; outline:2px solid var(--accent); }
  .empty { padding:32px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>BILLIARDS REVIEW</h1>
  <span class="sub" id="build"></span>
</header>
<div id="update">Update available — tap to reload</div>
<div id="keygate"></div>
<div id="keyentry" style="display:none; padding:0 24px 24px; text-align:center;">
  <input id="keyfield" placeholder="paste key here" autocapitalize="off"
         autocorrect="off" spellcheck="false"
         style="width:100%; max-width:340px; height:44px; padding:0 12px;
                background:var(--panel); border:1px solid var(--line);
                border-radius:4px; color:var(--text); font-size:15px;">
  <button id="keysave"
          style="margin-top:10px; height:44px; padding:0 24px;
                 background:var(--panel); border:1px solid var(--accent);
                 border-radius:4px; color:var(--accent); font-weight:600;
                 font-size:15px;">Save key</button>
</div>

<div id="sessions"></div>

<div id="player">
  <div id="topbar">
    <button id="back">‹ Sessions</button>
    <span id="title"></span>
  </div>
  <video id="video" controls playsinline preload="metadata"></video>
  <div id="shotbar">
    <div id="shotinfo">
      <span class="n" id="shot-n">–</span>
      <span class="oc" id="shot-oc"></span>
      <span class="t" id="shot-t"></span>
    </div>
    <div id="desc"></div>
    <div id="lane"><div id="playhead"></div></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="mode" title="repeat this shot">⟳ Repeat</button>
      <button id="rate" title="playback speed">1×</button>
      <button id="next">›</button>
    </div>
    <div id="chips"></div>
  </div>
</div>

<script>
const BUILD = "__BUILD_ID__";
const PRE_ROLL = 5.0;
const $ = id => document.getElementById(id);
$("build").textContent = BUILD.slice(0, 10);

// ---- key handling: arrives once as ?k=, lives in localStorage ----------
const url = new URL(location.href);
if (url.searchParams.get("k")) {
  // strip anything a chat renderer glued onto the key (asterisks,
  // punctuation, whitespace) — the key alphabet is base64url only
  const raw = url.searchParams.get("k").replace(/[^A-Za-z0-9_-]/g, "");
  localStorage.setItem("key", raw);
  url.searchParams.delete("k");
  history.replaceState(null, "", url.pathname);
}
let KEY = localStorage.getItem("key");
document.addEventListener("DOMContentLoaded", () => {
  $("keysave").onclick = () => {
    const v = $("keyfield").value.replace(/[^A-Za-z0-9_-]/g, "");
    if (!v) return;
    localStorage.setItem("key", v);
    KEY = v;
    $("keygate").style.display = "none";
    $("keyentry").style.display = "none";
    loadSessions();
  };
});

async function api(path) {
  const r = await fetch(path, { headers: { "x-key": KEY || "" } });
  if (r.status === 401) {
    // say exactly which failure this is, so remote debugging isn't a guess
    $("keygate").textContent = KEY
      ? `A key ending "…${KEY.slice(-4)}" (${KEY.length} chars) is stored, ` +
        "but the server rejected it. Re-open the current install link — " +
        "the key may have been rotated or mangled."
      : "No key stored on this device yet. Open the install link " +
        "(the one containing ?k=…) once.";
    $("keygate").style.display = "block";
    $("keyentry").style.display = "block";
    $("sessions").innerHTML = "";
    throw new Error("401");
  }
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

// ---- self-update: poll version.json, offer one-tap reload --------------
async function checkUpdate() {
  try {
    const r = await fetch("/version.json?ts=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v.build && v.build !== BUILD) $("update").style.display = "block";
  } catch (e) { /* offline is fine */ }
}
$("update").onclick = () => location.reload();
document.addEventListener("visibilitychange",
  () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---- sessions list ------------------------------------------------------
function fmtDate(name, iso) {
  const m = name.match(/session-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return name;
  const d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00Z`);
  return d.toLocaleString([], { month: "short", day: "numeric",
                                hour: "numeric", minute: "2-digit" });
}
async function loadSessions() {
  const box = $("sessions");
  box.innerHTML = "<div class='empty'>Loading sessions…</div>";
  try {
    const resp = await api("/api/sessions");
    box.innerHTML = "";
    if (!resp.sessions.length) box.innerHTML = "<div class='empty'>No sessions.</div>";
    else {
      const head = document.createElement("div");
      head.className = "sess head";
      ["DATE", "LENGTH", "SHOTS"].forEach((t, i) => {
        const sp = document.createElement("span");
        if (i > 0) sp.className = "num";
        sp.textContent = t;
        head.appendChild(sp);
      });
      box.appendChild(head);
    }
    const fmtDur = d => d == null ? "–"
      : d >= 3600 ? `${Math.floor(d / 3600)}h${String(Math.floor(d % 3600 / 60)).padStart(2, "0")}`
      : d >= 60 ? `${Math.floor(d / 60)}m` : `${Math.floor(d)}s`;
    resp.sessions.forEach(s => {
      const el = document.createElement("div");
      el.className = "sess" + (s.analyzed ? "" : " stub");
      // textContent only — a Dropbox filename is untrusted input and the
      // fmtDate fallback returns it raw (security review: XSS sink).
      const d = document.createElement("span");
      d.className = "d";
      d.textContent = fmtDate(s.name, s.modified);
      const len = document.createElement("span");
      len.className = "num" + (s.dur_s == null ? " dim" : "");
      len.textContent = fmtDur(s.dur_s);
      const sh = document.createElement("span");
      sh.className = "num" + (s.shots == null ? " dim" : "");
      sh.textContent = s.shots == null ? "–" : s.shots;
      el.append(d, len, sh);
      el.onclick = () => openSession(s);
      box.appendChild(el);
    });
  } catch (e) {
    if (String(e.message) !== "401")
      box.innerHTML = `<div class='empty'>Couldn't reach Dropbox (${e.message})</div>`;
  }
}

// ---- player -------------------------------------------------------------
let shots = [], cur = -1;
const isAttempt = s => !s.action || s.action === "stroke" || s.action === "break";

async function openSession(s) {
  $("sessions").style.display = "none";
  $("player").style.display = "block";
  $("title").textContent = fmtDate(s.name, s.modified);
  shots = []; cur = -1;
  $("chips").innerHTML = ""; $("desc").textContent = "";
  updateInfo();
  try {
    const [linkD, shotsD] = await Promise.all([
      api("/api/link?name=" + encodeURIComponent(s.name)),
      s.analyzed ? api("/api/shots?name=" + encodeURIComponent(s.name))
                 : Promise.resolve({ shots: [] }),
    ]);
    $("video").src = linkD.link;
    shots = shotsD.shots || [];
    buildChips();
    buildLane();
    updateInfo();
    // start at the FIRST clip, rearranges included (Joe: don't skip them)
    if (shots.length) gotoShot(0, false);
  } catch (e) {
    $("desc").textContent = "Load failed: " + e.message;
  }
}
$("back").onclick = () => {
  $("video").pause(); $("video").removeAttribute("src"); $("video").load();
  $("player").style.display = "none";
  $("sessions").style.display = "block";
};

function buildChips() {
  const c = $("chips");
  c.innerHTML = "";
  shots.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = isAttempt(s)
      ? "chip " + (s.outcome || "miss")
      : "chip inhand";
    el.textContent = isAttempt(s)
      ? (s.action === "break" ? "BRK" : i + 1)
      : (s.action === "rearrange" ? "⇄" : "✋");
    el.onclick = () => gotoShot(i, true);
    c.appendChild(el);
  });
}
function gotoShot(i, play) {
  if (i < 0 || i >= shots.length) return;
  cur = i;
  const v = $("video");
  v.currentTime = Math.max(0, shots[i].start - PRE_ROLL);
  if (play) v.play();
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}
$("prev").onclick = () => gotoShot(Math.max(0, cur - 1), true);
$("next").onclick = () => gotoShot(Math.min(shots.length - 1, cur + 1), true);

function fmt(t) {
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
}
function updateInfo() {
  [...$("chips").children].forEach((el, i) => el.classList.toggle("cur", i === cur));
  if (cur < 0 || !shots[cur]) {
    $("shot-n").textContent = shots.length ? `${shots.length} shots` : "–";
    $("shot-oc").textContent = ""; $("shot-t").textContent = "";
    return;
  }
  const s = shots[cur];
  $("shot-n").textContent = `Shot ${cur + 1}/${shots.length}`;
  const act = s.action || "stroke";
  const label = act === "ball_in_hand" ? "BALL IN HAND"
              : act === "rearrange" ? "REARRANGING"
              : act === "nothing" ? "—"
              : act === "break" ? "BREAK · " + (s.outcome || "").toUpperCase()
              : (s.outcome || "").toUpperCase();
  $("shot-oc").textContent = label + (s.corrected ? " ✓" : "");
  $("shot-oc").style.color = s.outcome === "make" ? "var(--make)"
                           : s.outcome === "scratch" ? "var(--scratch)"
                           : "var(--dim)";
  $("shot-t").textContent = `${fmt(s.start)} · ${(s.end - s.start).toFixed(1)}s`;
  $("desc").textContent = s.text || "";
}

// ---- SHOT-scoped scrub lane (Joe: whole-session scale was unusable) ----
// The lane covers just the current shot: routine lead-in -> settled,
// plus a 1s tail. Scrubbing works within that window; < > moves between
// shots; the mode button picks what happens at the end of the shot:
//   ⟳  loop this shot          ▸▸  roll into the next shot (CD style)
let win = null;                       // {t0, t1} of the visible window
let mode = localStorage.getItem("mode") || "cd";   // "cd" | "loop"

function modeLabel() {
  // a TOGGLE, not an action: engaged = this shot repeats until you move
  const on = mode === "loop";
  $("mode").style.color = on ? "var(--make)" : "var(--dim)";
  $("mode").style.borderColor = on ? "var(--make)" : "var(--line)";
}
$("mode").onclick = () => {
  mode = mode === "loop" ? "cd" : "loop";
  localStorage.setItem("mode", mode);
  modeLabel();
};

function buildLane() {
  const lane = $("lane");
  [...lane.querySelectorAll(".region")].forEach(el => el.remove());
  if (cur < 0 || !shots[cur]) { win = null; return; }
  const s = shots[cur];
  const t0 = Math.max(0, s.start - PRE_ROLL);
  const t1 = Math.max(s.end, s.start + 0.5) + 1.0;
  win = { t0, t1 };
  const span = t1 - t0;
  const lead = document.createElement("div");
  lead.className = "region lead "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  lead.style.left = "0%";
  lead.style.width = (100 * (s.start - t0) / span) + "%";
  lane.appendChild(lead);
  const body = document.createElement("div");
  body.className = "region "
    + (isAttempt(s) ? (s.outcome || "miss") : "inhand");
  body.style.left = (100 * (s.start - t0) / span) + "%";
  body.style.width =
    (100 * (Math.max(s.end, s.start + 0.5) - s.start) / span) + "%";
  lane.appendChild(body);
}

// Advance WITHOUT seeking — used when the next shot's window adjoins the
// current one, so playback rolls straight through (Joe: "no time jumps
// if one clip plays into the next"). Only real dead time gets skipped.
function advanceSeamless(i) {
  cur = i;
  buildLane();
  updateInfo();
  const chip = $("chips").children[i];
  if (chip) chip.scrollIntoView({ behavior: "smooth", inline: "center",
                                  block: "nearest" });
}

// A render loop, not timeupdate: iOS fires timeupdate ~4x/s and the
// playhead visibly stepped (Joe). rAF moves it every frame.
(function tick() {
  requestAnimationFrame(tick);
  const v = $("video");
  if ($("player").style.display === "none") return;
  if (win) {
    const frac = (v.currentTime - win.t0) / (win.t1 - win.t0);
    $("playhead").style.left = (100 * Math.min(1, Math.max(0, frac))) + "%";
  }
  if (win && !v.paused && cur >= 0 && v.currentTime >= win.t1 - 0.05) {
    if (mode === "loop") {
      v.currentTime = win.t0;
    } else if (cur < shots.length - 1) {
      const nextT0 = Math.max(0, shots[cur + 1].start - PRE_ROLL);
      if (nextT0 <= win.t1 + 0.75) {
        advanceSeamless(cur + 1);   // contiguous: keep rolling, no seek
      } else {
        gotoShot(cur + 1, true);    // real dead time: skip it
      }
    } else {
      v.pause();
    }
  }
})();
// Latest-wins seek chaining: firing currentTime on every pointermove
// queues seeks inside the decoder and the picture lags the thumb by
// seconds. Issue ONE seek at a time; when it lands, jump straight to
// wherever the thumb is NOW (Joe: "more frame resolution... really
// look closely at frame timing").
let seekBusy = false, seekPending = null;
function requestSeek(t) {
  const v = $("video");
  if (seekBusy) { seekPending = t; return; }
  seekBusy = true;
  v.currentTime = t;
}
$("video").addEventListener("seeked", () => {
  if (seekPending != null) {
    const t = seekPending;
    seekPending = null;
    $("video").currentTime = t;
  } else {
    seekBusy = false;
  }
});

(() => {
  const lane = $("lane");
  let scrubbing = false, wasPlaying = false;
  const seekTo = ev => {
    if (!win) return;
    const r = lane.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    requestSeek(win.t0 + frac * (win.t1 - win.t0));
    $("playhead").style.left = (100 * frac) + "%";
  };
  lane.addEventListener("pointerdown", ev => {
    scrubbing = true;
    wasPlaying = !$("video").paused;
    $("video").pause();          // decoder devotes itself to scrub frames
    lane.setPointerCapture(ev.pointerId);
    seekTo(ev);
  });
  lane.addEventListener("pointermove", ev => { if (scrubbing) seekTo(ev); });
  const end = () => {
    if (!scrubbing) return;
    scrubbing = false;
    if (wasPlaying) $("video").play();
  };
  lane.addEventListener("pointerup", end);
  lane.addEventListener("pointercancel", end);
})();

// ---- slow motion (Joe): ONE button on the transport line, tap to
// cycle 1x -> 1/2x -> 1/4x -> 1x. iOS resets rate on new media, so
// reapply on every play.
const RATES = [1, 0.5, 0.25];
const RATE_LABEL = { 1: "1×", 0.5: "½×", 0.25: "¼×" };
let rate = parseFloat(localStorage.getItem("rate") || "1") || 1;
if (!RATES.includes(rate)) rate = 1;
function applyRate() {
  $("video").playbackRate = rate;
  $("rate").textContent = RATE_LABEL[rate];
  $("rate").classList.toggle("on", rate !== 1);
}
$("rate").onclick = () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  localStorage.setItem("rate", rate);
  applyRate();
};
$("video").addEventListener("play", applyRate);
applyRate();
modeLabel();

// keep "current shot" synced while playing
setInterval(() => {
  if ($("player").style.display === "none" || !shots.length) return;
  const t = $("video").currentTime;
  if (win && t >= win.t0 && t <= win.t1) return;   // inside the window: stay
  const i = shots.findIndex(s => t >= s.start - PRE_ROLL && t <= s.end + 0.5);
  if (i >= 0 && i !== cur) { cur = i; buildLane(); updateInfo(); }
}, 800);

loadSessions();
</script>
</body>
</html>
